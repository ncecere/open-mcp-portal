# Exported by omp (schema omp/v1). Secrets are never exported: a server with a static
# header names an environment variable in authValueEnv, which "omp import" reads.
# Set it before an import that creates the server or replaces its secret.
# Governance and sensitivity ceilings are comparison-only. Imports cannot create
# objects with policy that automation tokens cannot preserve; use the browser UI.
schema: omp/v1
servers:
  - team: bravo
    slug: billing
    name: Billing
    description: ""
    url: https://billing.example.com/mcp
    enabled: true
    timeoutSeconds: 45
    authMode: static_header
    authHeaderName: X-API-Key
    authValueEnv: OMP_BILLING_AUTH_VALUE
    publish: request
  - team: bravo
    slug: status
    name: Service status
    description: Is it up
    url: https://status.example.com/mcp
    enabled: true
    timeoutSeconds: 30
    authMode: none
    publish: none
