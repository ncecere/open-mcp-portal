# The portal's egress to Dex, its OpenID Connect provider (the base allows
# TCP 443 only). Enforced only where the CNI enforces NetworkPolicy
# (SMOKE_CNI=calico).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-mcp-portal-egress-dex
  labels:
    app.kubernetes.io/name: open-mcp-portal
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: open-mcp-portal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: open-mcp-portal
      app.kubernetes.io/component: server
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: omp-smoke-dex
      ports:
        - protocol: TCP
          port: 5556
