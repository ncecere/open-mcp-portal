# Where TLS ends and traffic enters: a Gateway API Gateway (Envoy Gateway,
# installed by the script from a pinned, checksum-verified release) with an
# https listener for omp.smoke.test, and an HTTPRoute to the portal's Service.
# The proxy's pods run in envoy-gateway-system, the namespace the ingress
# NetworkPolicy allows (patched in kustomization.yaml).
#
# The route's request timeout is the one docs/deploy.md ("Ingress") asks for:
# an MCP call may wait 120 s for its upstream, so reads get 300 s.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: omp-smoke
spec:
  gatewayClassName: omp-smoke-envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: omp.smoke.test
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: omp-smoke-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-mcp-portal
spec:
  parentRefs:
    - name: omp-smoke
      sectionName: https
  hostnames: [omp.smoke.test]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: open-mcp-portal
          port: 80
      timeouts:
        request: 300s
