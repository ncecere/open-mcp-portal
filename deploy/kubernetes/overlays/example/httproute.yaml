# Gateway API alternative to ingress.yaml: list it in kustomization.yaml
# instead. The parent Gateway (with the TLS listener for mcp.example.org) is
# the cluster's; patch parentRefs to it, and the NetworkPolicy
# open-mcp-portal-ingress to the namespace its data plane runs in.
#
# timeouts.request must cover an upstream MCP call (up to 120s), with
# headroom for streamed (SSE) responses. This is the shape the smoke test's
# ingress scenario runs on Envoy Gateway (overlays/smoke-ingress/gateway.yaml).
# No session persistence is needed: /mcp/{slug} is stateless.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-mcp-portal
  labels:
    app.kubernetes.io/name: open-mcp-portal
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: open-mcp-portal
spec:
  parentRefs:
    - name: example-gateway
      namespace: gateway-system
      sectionName: https
  hostnames: [mcp.example.org]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: open-mcp-portal
          port: 80
      timeouts:
        request: 300s
