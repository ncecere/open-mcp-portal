# Example install: the base in its own namespace behind an NGINX Ingress
# with cert-manager TLS, an external (managed) PostgreSQL and an OIDC
# provider. httproute.yaml is the Gateway API alternative to ingress.yaml.
#
# Copy this directory into your own GitOps repository, replace every
# example.org value and the image digest, and create the secret
# open-mcp-portal-runtime first (docs/deploy.md, "Secrets").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: open-mcp-portal

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  # Gateway API instead of an Ingress: replace ingress.yaml with
  # - httproute.yaml
  # Prometheus scrapes /metrics on port 9090 from the monitoring namespace.
  - networkpolicy-metrics.yaml
  # With the Prometheus Operator's CRDs installed, add:
  # - servicemonitor.yaml
  # - prometheusrule.yaml
  # With tracing on (OTEL_EXPORTER_OTLP_ENDPOINT), the portal may reach the
  # collector only if a policy says so:
  # - networkpolicy-otlp.yaml

# Pin by digest (never a mutable tag). Take the digest of the release you deploy from its GitHub Release
# (open-mcp-portal-<tag>.digest.txt) and verify the signature first (docs/deploy.md).
images:
  - name: ghcr.io/ncecere/open-mcp-portal
    newTag: v0.10.0
    digest: sha256:b6060f98b8efc256f76ecae23a0174eaa95de5116c4ba41687f7d7b37785bf13

configMapGenerator:
  - name: open-mcp-portal-config
    behavior: merge
    literals:
      - APP_URL=https://mcp.example.org
      - OIDC_ISSUER=https://idp.example.org
      - OIDC_CLIENT_ID=open-mcp-portal
      - OIDC_ALLOWED_EMAIL_DOMAINS=example.org
      # The ingress controller's pod network, so client IPs are logged and
      # rate-limited correctly.
      - TRUSTED_PROXIES=10.0.0.0/8
      - ORG_NAME=Example Corp
      - SUPPORT_URL=https://help.example.org
      # Prometheus metrics on their own port (no authentication: only the
      # monitoring namespace may reach it, networkpolicy-metrics.yaml).
      - METRICS_ADDR=:9090

patches:
  # The metrics port, on the pods and the Service (for a ServiceMonitor).
  - target:
      kind: Deployment
      name: open-mcp-portal
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/ports/-
        value:
          name: metrics
          containerPort: 9090
          protocol: TCP
  - target:
      kind: Service
      name: open-mcp-portal
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: metrics
          port: 9090
          targetPort: metrics
          protocol: TCP
  # The ingress controller's namespace.
  - target:
      kind: NetworkPolicy
      name: open-mcp-portal-ingress
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ingress-nginx
  # The managed PostgreSQL's address only.
  - target:
      kind: NetworkPolicy
      name: open-mcp-portal-egress-postgres
    patch: |-
      - op: replace
        path: /spec/egress/0/to
        value:
          - ipBlock:
              cidr: 192.0.2.10/32
  # An MCP server registered on https://mcp.example.com:8443 needs its port.
  - target:
      kind: NetworkPolicy
      name: open-mcp-portal-egress-https
    patch: |-
      - op: add
        path: /spec/egress/0/ports/-
        value:
          protocol: TCP
          port: 8443
