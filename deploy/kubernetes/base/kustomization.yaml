# Open MCP Portal: generic Kubernetes base (docs/deploy.md).
#
# Namespace-agnostic and free of secret values. An overlay sets the
# namespace, pins the image by digest (the base uses the release tag), merges its settings into
# open-mcp-portal-config, creates the secret open-mcp-portal-runtime and
# adds an Ingress or Gateway API route. See ../overlays/example.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicies.yaml

# open-mcp-portal-config, from config.env. The name gets a hash of the
# content (open-mcp-portal-config-<hash>) and the Deployment's references
# follow, so a configuration change rolls the pods. Overlays merge keys:
#   configMapGenerator:
#     - name: open-mcp-portal-config
#       behavior: merge
#       literals:
#         - APP_URL=https://mcp.example.org
configMapGenerator:
  - name: open-mcp-portal-config
    envs:
      - config.env
    options:
      labels:
        app.kubernetes.io/name: open-mcp-portal
        app.kubernetes.io/part-of: open-mcp-portal

# The release this base shipped with. A tag can move, so overlays should pin
# the digest from the GitHub Release (verify its cosign signature first; the
# digest takes precedence over the tag), never `latest`:
#   images:
#     - name: ghcr.io/ncecere/open-mcp-portal
#       newTag: v0.3.1
#       digest: sha256:<digest>
images:
  - name: ghcr.io/ncecere/open-mcp-portal
    newTag: v0.3.1
