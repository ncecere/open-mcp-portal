    put:
      tags:
      - me
      - connections
      operationId: setMyServerSecret
      summary: Enter, replace or change the caller's own key for a server
      description: 'Browser session only (403 session_required; API keys, automation tokens, service accounts and agents
        are refused: a key is a person''s own decision). The key is sealed with ENCRYPTION_KEY, bound to the person, the
        server and the origin it has now, and never returned, logged or audited (person_secret.create, person_secret.rotate;
        person_secret.agents_update when only allowAgents changes). The request names the origin the person was shown.
        404 server_not_found (no such server, or one the caller may not use through a gateway); 409 not_person_secret;
        409 server_changed (another origin than the one shown: reload); 400 invalid_secret (no origin); 400
        invalid_secret_value (8-4096 characters on one line); 400 secret_required (no key stored and none sent); 403
        when useForSetup is asked by someone who is not an editor of the server''s team. 429 slow_down (20 a minute per
        person, shared with revokeMyServerSecret).'
