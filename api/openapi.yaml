  /v1/admin/overview:
    get:
      tags:
      - admin
      operationId: adminGetOverview
      x-omp-token-scopes:
      - platform:read
      summary: Headline counts and what needs attention across the platform (platform admins and auditors)
      description: 'Computed when asked (no cache, Cache-Control: no-store) from the registry, gateways, keys, connections,
        notification outbox and the hourly usage rollups; the figures lag the call log by the rollup''s few minutes (last24h.rolledUpTo).
        attention lists up to 20 items per kind, most severe first (severity, then at); totals has the exact number per kind
        and truncated says whether any kind was cut. Published servers only for server_failing, capabilities_changed and upstream_signin_lapsed:
        a team''s private servers are the team''s business (getTeamAttention). Items carry a link the web app routes on. 403
        for everyone but platform admins and auditors. docs/admin-overview.md.'
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AdminOverview'
        '403':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/attention:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - teams
      operationId: getTeamAttention
      summary: 'What needs the team''s attention: failing servers, changed capabilities, pending reviews, expiring keys (team
        members; platform staff read any team)'
      description: 'Every member sees what they can already open: failing servers (enabled, any publish state), capabilities_changed,
        upstream_signin_lapsed and review_pending (servers waiting for a platform review). Only the team''s owners and admins
        (and platform staff) also see service_account_keys_expiring, automation_tokens_expiring (within 14 days) and notification_failures,
        because those lists are theirs. An archived team answers 200 with no items (its servers are unavailable). 404 team_not_found
        for people outside the team, like every team route. Connections that need re-consent are personal (Account > Connections)
        and service accounts can''t use them, so there is no such item here.'
      responses:
        '200':
          description: Attention items for the team
          content:
