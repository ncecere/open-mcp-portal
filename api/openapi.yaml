  /v1/teams/{team}/notification-destinations:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - notifications
      operationId: listTeamNotificationDestinations
      summary: The team's webhook destinations (team owners and admins; platform staff read any team)
      description: 'A webhook destination. The URL is sealed with ENCRYPTION_KEY and never returned (a Slack incoming-webhook
        URL is itself a credential): urlDisplay shows scheme and host only. Format json is signed; the signing secret is shown
        once on creation and on rotation. Format slack is unsigned ({"text": ...}).'
      responses:
        '200':
          description: Destinations ordered by name
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationDestination'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - notifications
      operationId: createTeamNotificationDestination
      summary: Add a webhook destination (team owners and admins, browser session only)
      description: 'A webhook destination. The URL is sealed with ENCRYPTION_KEY and never returned (a Slack incoming-webhook
        URL is itself a credential): urlDisplay shows scheme and host only. Format json is signed; the signing secret is shown
        once on creation and on rotation. Format slack is unsigned ({"text": ...}). 400 invalid_name, invalid_format. 409
        name_taken (names are unique within the scope), too_many_destinations (at most 10 per team and 10 for the platform),
        team_archived. 422 url_not_allowed (details.reason: invalid, too_long, userinfo, fragment, scheme, private_address,
        blocked_address; the same address policy and internal-network allowlist as MCP servers, checked again on every delivery),
        invalid_events (details.events lists what this destination can''t receive; at least one event is required). Events
        a team destination can receive: server.unhealthy, server.recovered, capability.changed, publish.decided, upstream_signin.lapsed,
        key.expiring (service-account keys and publisher tokens).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationDestinationCreate'
      responses:
        '201':
          description: Created; secret is shown only now (null for slack)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationDestinationCreated'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '422':
          $ref: '#/components/responses/ErrorReply'
