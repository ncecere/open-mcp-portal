            a person's account (a provider requirement); service accounts are refused them, so capabilityCount leaves
            them out
    MyGatewayDetail:
      type: object
      required:
      - gateway
      - capabilities
      properties:
        gateway:
          $ref: '#/components/schemas/MyGateway'
        capabilities:
          type: array
          description: Available to the caller now (role and availability applied). A capability that requires an
            account is listed whether or not the caller connected it; requires.connected says which
          items:
            $ref: '#/components/schemas/GatewayCapability'
    ApiKey:
      type: object
      required:
      - id
      - name
      - prefix
      - createdAt
      - status
      - gateways
      properties:
        toolScope:
          $ref: '#/components/schemas/ToolScope'
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the key, to recognise it (omp_xxxxxxxx)
        status:
          type: string
          enum:
          - active
          - expired
          - revoked
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        gateways:
          type: array
          description: The gateways the key is limited to, by name. Empty means every gateway its owner can use.
            A deleted gateway stays listed (exists false); a key whose gateways are all gone works nowhere.
          items:
            $ref: '#/components/schemas/ApiKeyGateway'
    ApiKeyGateway:
      type: object
      required:
      - id
      - slug
      - name
      - exists
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: The gateway's slug (as it was when the key was created, once deleted)
        name:
          type: string
        exists:
          type: boolean
    ApiKeyCreate:
      type: object
      required:
      - name
      properties:
        toolScope:
          $ref: '#/components/schemas/ToolScope'
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Claude Code on my laptop
        expiresInDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          default: 90
          description: Keys always expire
        gatewayIds:
          type: array
          maxItems: 50
          description: Limit the key to these gateways, each one the caller can use now. Absent or empty means every
            gateway the caller can use. A limit never widens access.
          items:
            type: string
            format: uuid
    ApiKeyCreated:
      type: object
      required:
      - key
      - secret
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
        secret:
          type: string
          description: The full key, shown only now. Send it as Authorization Bearer to /mcp/{slug}.
    McpCallOutcome:
      type: string
      enum:
      - ok
      - tool_error
      - denied
      - upstream_error
      - timeout
      - too_large
      - bad_request
      - needs_authorization
      - rate_limited
      description: 'ok: answered. tool_error: the tool reported an error. denied: refused by policy (logged; the
        client saw not found, or for a service account calling a capability that requires an account, a clear
        refusal). upstream_error: unreachable, refused or malformed (also provider_unavailable: the provider''s token
        endpoint failed). bad_request: the client''s request was invalid. needs_authorization: not forwarded because
        the person must connect or reconnect an account; the client got a consent link (JSON-RPC -32042), or, for a
        call from an agent, a tool error without a link (errorClass needs_connection).
        rate_limited: not forwarded because a rate limit was exceeded (HTTP 429, JSON-RPC -32029; errorClass names
        the limit: person_per_minute, credential_per_minute, service_account_per_minute or gateway_per_minute).'
    McpCall:
      type: object
      required:
      - id
      - occurredAt
      - method
      - outcome
      - latencyMs
      - requestBytes
      - responseBytes
      - requestId
      - gateway
      - principal
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        method:
          type: string
          description: tools/list, tools/call, prompts/list, prompts/get, resources/list, resources/templates/list
            or resources/read
          example: tools/call
        exposedName:
          type: string
          description: The tool or prompt name, or the exposed resource URI, the client used (absent for list calls)
        gateway:
          $ref: '#/components/schemas/CallRef'
        server:
          $ref: '#/components/schemas/CallRef'
        principal:
          $ref: '#/components/schemas/CallPrincipal'
        clientName:
          type: string
          description: clientInfo.name from initialize, when sent
        outcome:
          $ref: '#/components/schemas/McpCallOutcome'
        errorClass:
          type: string
          description: 'Why a call was denied or failed, for example no_access, role, unknown, key_scope (the API
            key is limited to other gateways), tool_scope (a credential, account or matching gateway-grant ceiling excludes the tool), gateway_disabled or an unavailability reason. For capabilities that
            require an account; needs_authorization with not_connected, missing_scopes, needs_reconsent or
            server_not_allowed (connected, but the person hasn''t allowed this server, at its current address, to use
            the account); denied with
            service_account, provider_disabled, provider_not_allowed (the provider is restricted and its access list
            excludes the server), person_not_present (an agent''s call whose server or capability requires
            a present person) or, for an agent''s call for a person, person_no_account or person_suspended; needs_authorization
            with needs_connection for an agent''s call (the person must connect an account; the answer was a tool error
            with no link); upstream_error with provider_unavailable. For a server where each person enters their own
            key (decision 72): needs_authorization with secret_missing or secret_rejected (the answer carried the
            link, or for an agent''s call a tool error with none) or agents_not_allowed (an agent''s call, the person
            has a key but hasn''t allowed agents); denied with service_account or person_suspended.'
        providerSlug:
          type: string
          description: The auth provider the capability required at the time of the call (absent when none)
        toolClass:
          $ref: '#/components/schemas/ToolClass'
        identitySent:
          type: boolean
          nullable: true
          description: 'Whether the signed identity token (name, email, teams) was attached to the request to the
            server (decision 64). true: sent. false: not sent (the server''s Send identity token switch was off).
            null: the call was not forwarded (denied, needs authorization, rate limited) or was recorded before
            this field existed'
        latencyMs:
          type: integer
          format: int32
        requestBytes:
          type: integer
          format: int64
        responseBytes:
          type: integer
          format: int64
        requestId:
          type: string
        traceId:
          type: string
          description: The request's OpenTelemetry trace ID (32 hex digits), present when the portal had tracing on and the
            trace was sampled (decision 71). Absent otherwise, and for calls recorded before v0.3.1
        traceUrl:
          type: string
          description: Where to open the trace, from the deployment's TRACE_LINK_TEMPLATE; absent when no template is set
            or the call has no traceId
        captured:
          type: boolean
          description: A captured payload is stored that the caller may open (team views; captured under this team's
            gateway or server switch; admin views; any). Absent from servers before Phase 6.
        agent:
          allOf:
          - $ref: '#/components/schemas/AgentCall'
          nullable: true
          description: Set when a trusted agent platform relayed the call (docs/agent-platforms.md); the principal is
            then the relay service account. Absent from servers before v0.3
    CallRef:
      type: object
      required:
      - id
      - slug
      - name
      - exists
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        exists:
          type: boolean
    CallPrincipal:
      type: object
      required:
      - kind
      - displayName
      properties:
        kind:
          type: string
          enum:
          - api_key
          - oauth
          - service_account
          description: 'api_key: a personal key; oauth: a connected MCP client acting for a person; service_account:
            a team service account key'
        userId:
          type: string
          format: uuid
          description: The person (api_key and oauth)
        displayName:
          type: string
          description: The person's name, or the service account's name
        email:
          type: string
          description: The person (api_key and oauth)
        apiKeyName:
          type: string
          description: The key used (api_key and service_account)
        oauthClientName:
          type: string
          description: The connected client (oauth)
        oauthClientVerified:
          type: boolean
          description: 'oauth: true when the client is identified by a Client ID Metadata Document (its host vouches for
            it); false when it registered itself, so its name is only its own claim'
        serviceAccountId:
          type: string
          format: uuid
        serviceAccountTeamSlug:
          type: string
        serviceAccountExists:
          type: boolean
          description: 'service_account: false once the account was deleted (its name is the one recorded)'
    McpCallPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/McpCall'
        nextCursor:
          type: string
          nullable: true
    OAuthClientInfo:
      type: object
      required:
      - id
      - kind
      - name
      - host
      - uri
      - logoUrl
      - trusted
      properties:
        id:
          type: string
          description: 'The client_id: an https URL (a Client ID Metadata Document) or a registered client''s id'
        kind:
          type: string
          enum:
          - metadata
          - registered
          description: 'metadata: its host vouches for it; registered: it registered itself, so its name is unverified'
        name:
          type: string
        host:
          type: string
          description: The host that vouches for the client, or a registered client's own home page host (may be
            empty)
        uri:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        trusted:
          type: boolean
          description: On the trusted-client list (skips the consent screen)
    OAuthConsent:
      type: object
      required:
      - client
      - gateway
      - redirectUri
      - redirectHost
      - remembered
      - notice
      properties:
        requestedToolScope:
          $ref: '#/components/schemas/ToolScope'
        client:
          $ref: '#/components/schemas/OAuthClientInfo'
        gateway:
          $ref: '#/components/schemas/MyGateway'
        redirectUri:
          type: string
        redirectHost:
          type: string
          description: Where the browser goes back to, such as 127.0.0.1:53211
        remembered:
          type: boolean
          description: The caller already allowed this client for this gateway
        notice:
          type: boolean
          description: A trusted client asks for the first time with a loopback redirect, so the page is a short
            confirmation instead of the usual consent screen (the answer is still allow or deny)
    OAuthConsentDecision:
      type: object
      required:
      - query
      - decision
      properties:
        toolScope:
          allOf:
          - $ref: '#/components/schemas/ToolScope'
          nullable: true
          description: Classes only. Omitted defaults to the requested ceiling; null must not widen a restricted request.
        query:
          type: string
          maxLength: 8000
          description: The authorization request's query string, as the consent page received it
        decision:
          type: string
          enum:
          - allow
          - deny
    OAuthGrant:
      type: object
      required:
      - id
      - client
      - gateway
      - createdAt
      properties:
        toolScope:
          $ref: '#/components/schemas/ToolScope'
        id:
          type: string
          format: uuid
        client:
          $ref: '#/components/schemas/OAuthClientInfo'
        gateway:
          $ref: '#/components/schemas/CallRef'
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the app has to sign in again however often it is used (OAUTH_REFRESH_ABSOLUTE_TTL after the
            person last signed it in); null when the portal sets no limit. Past it, the app is shown as expired.
    TrustedClient:
      type: object
      required:
      - clientId
      properties:
        clientId:
          type: string
          maxLength: 500
          example: https://claude.ai/oauth/claude-code-client-metadata
        label:
          type: string
          maxLength: 100
          example: Claude Code
    TrustedClients:
      type: object
      required:
      - clients
      - openRegistration
      - revision
      - updatedAt
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/TrustedClient'
        openRegistration:
          type: boolean
          description: Whether POST /oauth/register accepts registrations (and the authorization server metadata lists
            registration_endpoint). On by default. Apps already registered keep working when it is off.
        revision:
          $ref: '#/components/schemas/Revision'
        updatedAt:
          type: string
          format: date-time
    TrustedClientsUpdate:
      type: object
      required:
      - clients
      properties:
        clients:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TrustedClient'
        openRegistration:
          type: boolean
          description: Turn open client registration on or off; omitted keeps it as it is
    ServiceAccountRole:
      type: string
      enum:
      - member
      - editor
      description: The team role used for capabilities' minimum roles (decision 22)
    ServiceAccount:
      type: object
      required:
      - id
      - teamId
      - teamSlug
      - name
      - description
      - role
      - enabled
      - activeKeyCount
      - revision
      - createdAt
      - updatedAt
      properties:
        toolScope:
          $ref: '#/components/schemas/ToolScope'
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        teamSlug:
          type: string
        name:
          type: string
          example: ci-release-bot
        description:
          type: string
        role:
          $ref: '#/components/schemas/ServiceAccountRole'
        enabled:
          type: boolean
        activeKeyCount:
          type: integer
          format: int64
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdByName:
          type: string
          nullable: true
        relayPlatform:
          allOf:
          - $ref: '#/components/schemas/ServiceAccountRelayPlatform'
          nullable: true
          description: The trusted agent platform this account relays for (set by a platform admin only; null for an
            ordinary service account). Absent from servers before v0.3
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ServiceAccountRelayPlatform:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ServiceAccountPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccount'
        nextCursor:
          type: string
          nullable: true
    ServiceAccountCreate:
      type: object
      required:
      - name
      properties:
        toolScope:
          $ref: '#/components/schemas/ToolScope'
        name:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
          description: Lower-case letters, digits and dashes; unique within the team
        description:
          type: string
          maxLength: 2000
        role:
          allOf:
          - $ref: '#/components/schemas/ServiceAccountRole'
          default: member
        enabled:
          type: boolean
          default: true
    ServiceAccountUpdate:
      type: object
      properties:
        toolScope:
          allOf:
          - $ref: '#/components/schemas/ToolScope'
          nullable: true
          description: Omitted retains the ceiling; null clears it; an object replaces it. Existing keys intersect this live value on every call.
        name:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
        description:
          type: string
          maxLength: 2000
        role:
          $ref: '#/components/schemas/ServiceAccountRole'
        enabled:
          type: boolean
    ServiceAccountKey:
      type: object
      required:
      - id
      - name
      - prefix
      - status
      - createdAt
      - expiresAt
      - gateways
      properties:
        toolScope:
          $ref: '#/components/schemas/ToolScope'
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the key (omp_sa_xxxxxxxx)
        status:
          type: string
          enum:
          - active
          - expired
          - revoked
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        gateways:
          type: array
          description: The gateways the key is limited to (empty = every gateway the account can use)
          items:
            $ref: '#/components/schemas/ApiKeyGateway'
    ServiceAccountKeyCreate:
      type: object
      required:
      - name
      properties:
        toolScope:
          $ref: '#/components/schemas/ToolScope'
        name:
          type: string
          minLength: 1
          maxLength: 100
        expiresInDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          default: 90
        gatewayIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    ServiceAccountKeyCreated:
      type: object
      required:
      - key
      - secret
      properties:
        key:
          $ref: '#/components/schemas/ServiceAccountKey'
        secret:
          type: string
          description: The full key, shown only now
    ScopeList:
      type: array
      maxItems: 50
      description: OAuth scopes exactly as the provider names them (RFC 6749 scope characters, no spaces or quotes);
        duplicates collapse. Use the provider's canonical names (the ones its token response returns), otherwise the
        gateway can't tell that they were granted.
      items:
        type: string
        minLength: 1
        maxLength: 200
        pattern: '^[!#-\[\]-~]+$'
    AuthProviderKind:
      type: string
      enum:
      - oauth2
      - mcp_server
      description: 'oauth2: a platform provider, OAuth 2.0 authorization code grant (with PKCE where the provider
        supports it). mcp_server: the OAuth client of one MCP server in oauth mode (docs/phase7-upstream-oauth.md),
        bound to that server; never listed among platform providers and never reusable'
    AuthProviderPresetName:
      type: string
      enum:
      - github
      - google
      - microsoft
      - atlassian
      - slack
      - gitlab
      description: Which built-in preset the provider started from; only used for its icon and help text
    AuthProviderTokenAuthMethod:
      type: string
      enum:
      - client_secret_basic
      - client_secret_post
      - none
      description: How the portal authenticates to the token endpoint. none (a public client) requires pkce
    AuthProviderTokenResponseFormat:
      type: string
      enum:
      - standard
      - slack_authed_user
      description: 'standard: RFC 6749 (access_token, refresh_token, expires_in, scope at the top level).
        slack_authed_user: Slack''s user-token response, where they are under authed_user'
    AuthProviderSummary:
      type: object
      description: What any signed-in person may see about a provider
      required:
      - id
      - slug
      - name
      - kind
      - preset
      - defaultScopes
      - logoUrl
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Immutable; sent to MCP servers in MCP-Gateway-Provider and the identity token's provider claim
          example: github
        name:
          type: string
          example: GitHub
        kind:
          $ref: '#/components/schemas/AuthProviderKind'
        preset:
          allOf:
          - $ref: '#/components/schemas/AuthProviderPresetName'
          nullable: true
        defaultScopes:
          $ref: '#/components/schemas/ScopeList'
        logoUrl:
          type: string
          nullable: true
    AuthProviderAccessMode:
      type: string
      enum:
      - open
      - restricted
      description: open - any team's server may require the provider. restricted - only a server of a listed team, or a
        listed server
    AuthProviderAccessTeam:
      type: object
      required:
      - id
      - slug
      - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    AuthProviderAccess:
      type: object
      description: Who may use an auth provider (decision 69)
      required:
      - accessMode
      - teams
      - servers
      - blocked
      - blockedCount
      - revision
      properties:
        accessMode:
          $ref: '#/components/schemas/AuthProviderAccessMode'
        teams:
          type: array
          description: Teams whose servers may require a restricted provider, by name
          items:
            $ref: '#/components/schemas/AuthProviderAccessTeam'
        servers:
          type: array
          description: Servers that may require a restricted provider whatever their team, by name
          items:
            $ref: '#/components/schemas/ConnectServer'
        blocked:
          type: array
          description: Up to 20 servers that require the provider though a restricted list excludes them (their calls are
            refused until a team or the server is added)
          items:
            $ref: '#/components/schemas/ConnectServer'
        blockedCount:
          type: integer
          format: int64
        revision:
          $ref: '#/components/schemas/Revision'
    AuthProviderAccessInput:
      type: object
      required:
      - accessMode
      - teamIds
      - serverIds
      properties:
        accessMode:
          $ref: '#/components/schemas/AuthProviderAccessMode'
        teamIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
        serverIds:
          type: array
          maxItems: 500
          items:
            type: string
            format: uuid
    AuthProvider:
      type: object
      description: An OAuth app configured by platform admins. The client secret is never returned
      required:
      - id
      - slug
      - name
      - kind
      - preset
      - enabled
      - clientId
      - hasClientSecret
      - clientSecretHint
      - tokenAuthMethod
      - pkce
      - authorizationUrl
      - tokenUrl
      - revocationUrl
      - userinfoUrl
      - defaultScopes
      - scopeParam
      - scopeSeparator
      - tokenResponseFormat
      - extraAuthorizeParams
      - logoUrl
      - redirectUri
      - serverCount
      - connectionCount
      - accessMode
      - narrowOnRefresh
      - revision
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Immutable; sent to MCP servers in MCP-Gateway-Provider and the identity token's provider claim
          example: github
        name:
          type: string
          example: GitHub
        kind:
          $ref: '#/components/schemas/AuthProviderKind'
        preset:
          allOf:
          - $ref: '#/components/schemas/AuthProviderPresetName'
          nullable: true
        enabled:
          type: boolean
          description: Turned off, calls that require it are refused and nobody can connect; connections are kept
        clientId:
          type: string
        hasClientSecret:
          type: boolean
        clientSecretHint:
          type: string
          description: Last 4 characters of the secret when it has at least 8, otherwise empty
        tokenAuthMethod:
          $ref: '#/components/schemas/AuthProviderTokenAuthMethod'
        pkce:
          type: boolean
          description: Send a PKCE S256 challenge (on unless the provider rejects it)
        authorizationUrl:
          type: string
          example: https://github.com/login/oauth/authorize
        tokenUrl:
          type: string
          example: https://github.com/login/oauth/access_token
        revocationUrl:
          type: string
          nullable: true
          description: RFC 7009 endpoint used when a connection is removed (null; tokens are only erased here)
        userinfoUrl:
          type: string
          nullable: true
          description: Read once after connecting to label the account (preferred_username, email, login, username or
            name); the label is informational only
        defaultScopes:
          $ref: '#/components/schemas/ScopeList'
        scopeParam:
          type: string
          description: The authorization request parameter that carries scopes (scope; Slack user tokens use
            user_scope)
        scopeSeparator:
          type: string
          enum:
          - ' '
          - ','
        tokenResponseFormat:
          $ref: '#/components/schemas/AuthProviderTokenResponseFormat'
        extraAuthorizeParams:
          type: object
          additionalProperties:
            type: string
          description: Added to every authorization request, such as access_type=offline for Google
        logoUrl:
          type: string
          nullable: true
        redirectUri:
          type: string
          description: APP_URL + /connect/callback, to register with the provider's OAuth app
          example: https://mcp.example.com/connect/callback
        serverCount:
          type: integer
          format: int64
          description: MCP servers that require it (as their requirement or in a capability override)
        connectionCount:
          type: integer
          format: int64
        accessMode:
          $ref: '#/components/schemas/AuthProviderAccessMode'
        narrowOnRefresh:
          type: boolean
          description: Calls carry a token refreshed with only the scopes the call needs (RFC 6749 section 6), kept in
            memory and never stored; the stored token, which holds every scope granted, is not sent. Only where the
            provider honours scope on refresh (the Microsoft preset documents it; the others do not) and for
            connections that hold a refresh token; the rest keep sending the stored token
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdByName:
          type: string
          nullable: true
    AuthProviderCreate:
      type: object
      required:
      - slug
      - name
      - clientId
      - authorizationUrl
      - tokenUrl
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,46}[a-z0-9])?$
          description: Unique, immutable
        name:
          type: string
          minLength: 1
          maxLength: 100
        preset:
          $ref: '#/components/schemas/AuthProviderPresetName'
        enabled:
          type: boolean
          default: true
        clientId:
          type: string
          minLength: 1
          maxLength: 500
        clientSecret:
          type: string
          maxLength: 2000
          description: Sealed with ENCRYPTION_KEY, never returned. Required unless tokenAuthMethod is none
        tokenAuthMethod:
          allOf:
          - $ref: '#/components/schemas/AuthProviderTokenAuthMethod'
          default: client_secret_post
        pkce:
          type: boolean
          default: true
        authorizationUrl:
          type: string
          maxLength: 500
        tokenUrl:
          type: string
          maxLength: 500
        revocationUrl:
          type: string
          maxLength: 500
        userinfoUrl:
          type: string
          maxLength: 500
        defaultScopes:
          $ref: '#/components/schemas/ScopeList'
        scopeParam:
          type: string
          pattern: ^[A-Za-z0-9_.-]{1,64}$
          default: scope
        scopeSeparator:
          type: string
          enum:
          - ' '
          - ','
          default: ' '
        tokenResponseFormat:
          allOf:
          - $ref: '#/components/schemas/AuthProviderTokenResponseFormat'
          default: standard
        extraAuthorizeParams:
          type: object
          maxProperties: 10
          additionalProperties:
            type: string
            maxLength: 500
          description: Keys match ^[A-Za-z0-9_.-]{1,64}$; response_type, client_id, redirect_uri, state, scope (and
            scopeParam), code_challenge and code_challenge_method are reserved
        logoUrl:
          type: string
          maxLength: 500
          description: An https URL or a same-origin path
        narrowOnRefresh:
          type: boolean
          default: false
          description: See AuthProvider.narrowOnRefresh. A new provider is always restricted (accessMode) with empty
            lists; change that with adminSetAuthProviderAccess
    AuthProviderUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        preset:
          allOf:
          - $ref: '#/components/schemas/AuthProviderPresetName'
          nullable: true
        enabled:
          type: boolean
        clientId:
          type: string
          minLength: 1
          maxLength: 500
          description: Changing it marks every connection needs_reconsent
        clientSecret:
          type: string
          maxLength: 2000
          description: Omit to keep the stored secret
        tokenAuthMethod:
          $ref: '#/components/schemas/AuthProviderTokenAuthMethod'
        pkce:
          type: boolean
        authorizationUrl:
          type: string
          maxLength: 500
        tokenUrl:
          type: string
          maxLength: 500
        revocationUrl:
          type: string
          maxLength: 500
          nullable: true
          description: null removes it
        userinfoUrl:
          type: string
          maxLength: 500
          nullable: true
          description: null removes it
        defaultScopes:
          $ref: '#/components/schemas/ScopeList'
        scopeParam:
          type: string
          pattern: ^[A-Za-z0-9_.-]{1,64}$
        scopeSeparator:
          type: string
          enum:
          - ' '
          - ','
        tokenResponseFormat:
          $ref: '#/components/schemas/AuthProviderTokenResponseFormat'
        extraAuthorizeParams:
          type: object
          maxProperties: 10
          additionalProperties:
            type: string
            maxLength: 500
          description: Replaces the whole set
        logoUrl:
          type: string
          maxLength: 500
          nullable: true
        narrowOnRefresh:
          type: boolean
          description: See AuthProvider.narrowOnRefresh
    AuthProviderUrlParameter:
      type: object
      required:
      - name
      - label
      properties:
        name:
          type: string
          description: The placeholder in the preset's URLs, without braces
          example: tenant
        label:
          type: string
          example: Directory (tenant) ID, or organizations
        default:
          type: string
          nullable: true
          example: organizations
    AuthProviderPreset:
      type: object
      required:
      - preset
      - name
      - authorizationUrl
      - tokenUrl
      - revocationUrl
      - userinfoUrl
      - defaultScopes
      - tokenAuthMethod
      - pkce
      - scopeParam
      - scopeSeparator
      - tokenResponseFormat
      - extraAuthorizeParams
      - urlParameters
      - docsUrl
      - narrowOnRefresh
      properties:
        preset:
          $ref: '#/components/schemas/AuthProviderPresetName'
        name:
          type: string
          example: GitHub
        authorizationUrl:
          type: string
        tokenUrl:
          type: string
        revocationUrl:
          type: string
          nullable: true
        userinfoUrl:
          type: string
          nullable: true
        defaultScopes:
          $ref: '#/components/schemas/ScopeList'
        tokenAuthMethod:
          $ref: '#/components/schemas/AuthProviderTokenAuthMethod'
        pkce:
          type: boolean
        scopeParam:
          type: string
        scopeSeparator:
          type: string
          enum:
          - ' '
          - ','
        tokenResponseFormat:
          $ref: '#/components/schemas/AuthProviderTokenResponseFormat'
        extraAuthorizeParams:
          type: object
          additionalProperties:
            type: string
        urlParameters:
          type: array
          description: Placeholders in the URLs the form asks for (Microsoft's tenant, a self-managed GitLab's host)
          items:
            $ref: '#/components/schemas/AuthProviderUrlParameter'
        docsUrl:
          type: string
          description: Where to create the OAuth app
        redirectUri:
          type: string
          description: APP_URL + /connect/callback, to register with the provider's OAuth app (the same for every
            provider)
          example: https://mcp.example.com/connect/callback
        notes:
          type: string
          description: Provider quirks worth knowing, shown in the form
        narrowOnRefresh:
          type: boolean
          description: Pre-fills the narrowing switch; true only where the provider documents that a refresh request's
            scope narrows the new access token
    ProviderRef:
      type: object
      required:
      - id
      - slug
      - name
      - preset
      - logoUrl
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        preset:
          allOf:
          - $ref: '#/components/schemas/AuthProviderPresetName'
          nullable: true
        logoUrl:
          type: string
          nullable: true
        kind:
          allOf:
          - $ref: '#/components/schemas/AuthProviderKind'
          description: mcp_server for an MCP server's own sign-in (then name is the server's name and server is set).
            Absent before Phase 7 (oauth2)
        server:
          allOf:
          - $ref: '#/components/schemas/McpServerRef'
          nullable: true
          description: The MCP server a kind mcp_server provider belongs to (null for platform providers)
    McpServerRequirement:
      type: object
      required:
      - providerId
      - providerSlug
      - providerName
      - providerEnabled
      - scopes
      properties:
        providerId:
          type: string
          format: uuid
        providerSlug:
          type: string
        providerName:
          type: string
        providerEnabled:
          type: boolean
          description: false while a platform admin has turned the provider off (calls that need it are refused)
        scopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: Empty means the provider's default scopes
    McpServerRequirementInput:
      type: object
      required:
      - providerId
      properties:
        providerId:
          type: string
          format: uuid
        scopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: Absent or empty means the provider's default scopes
    CapabilityRequirementOverride:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - inherit
          - none
          - scopes
          description: 'inherit: the server''s requirement. none: no provider token and no consent. scopes: the
            server''s provider with these scopes'
        scopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: Only with mode scopes (at least one)
    CapabilityRequirement:
      type: object
      description: The account a capability needs, with its effective scopes
      required:
      - providerId
      - providerSlug
      - providerName
      - scopes
      properties:
        providerId:
          type: string
          format: uuid
        providerSlug:
          type: string
          example: github
        providerName:
          type: string
          example: GitHub
        scopes:
          $ref: '#/components/schemas/ScopeList'
        connected:
          type: boolean
          description: 'Only in the caller''s own views (MyGatewayDetail): true when the caller has an active connection
            to the provider whose granted scopes include these, so a call would be forwarded without asking'
        providerKind:
          allOf:
          - $ref: '#/components/schemas/AuthProviderKind'
          description: mcp_server when the capability's server is in oauth mode (the person signs in to the server
            itself; providerName is the server's name). Absent before Phase 7
    ProviderConnectionStatus:
      type: string
      enum:
      - active
      - needs_reconsent
      description: 'needs_reconsent: the tokens were erased (a refresh failed, the access token expired without a
        refresh token, or the provider''s client ID changed); the next call asks the person to connect again'
    ProviderConnection:
      type: object
      description: A person's connected account. Tokens are never returned
      required:
      - id
      - provider
      - accountLabel
      - scopes
      - status
      - connectedAt
      - refreshedAt
      - lastUsedAt
      - expiresAt
      - refreshable
      - narrowsScopes
      - allowedServers
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/ProviderRef'
        accountLabel:
          type: string
          nullable: true
          description: The provider account as its userinfo endpoint named it (such as octocat); informational
        scopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: Scopes granted (as the provider reported them, else as asked for)
        status:
          $ref: '#/components/schemas/ProviderConnectionStatus'
        connectedAt:
          type: string
          format: date-time
          description: When the person last completed consent
        refreshedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: When a token was last sent to an MCP server
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the current access token expires (null; the provider gave no expiry). The portal refreshes
            it before then when it has a refresh token
        refreshable:
          type: boolean
          description: The portal holds a refresh token
        narrowsScopes:
          type: boolean
          description: A call carries a token refreshed with only the scopes that call needs. False means the token an
            allowed server receives holds every scope in scopes (the provider is not set to narrow, or no refresh token
            is held)
        allowedServers:
          type: array
          description: 'The MCP servers this account may be used by: the person allowed each one (for the scopes listed,
            at the address listed) when they confirmed a consent link. A platform provider''s token is sent only to
            these. Disconnecting removes them all. Empty for an MCP server''s own sign-in (its connection is for that
            server alone). A server whose address moves to another host, or that requires another provider, is removed
            and must be allowed again.'
          items:
            $ref: '#/components/schemas/ProviderServerGrant'
    ConnectServer:
      type: object
      description: An MCP server and its team, as a person is asked to allow it
      required:
      - id
      - slug
      - name
      - teamSlug
      - teamName
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        teamSlug:
          type: string
        teamName:
          type: string
    ProviderServerGrant:
      type: object
      description: A person's consent for one MCP server to use a connected account
      required:
      - server
      - origin
      - scopes
      - consentedAt
      properties:
        server:
          $ref: '#/components/schemas/ConnectServer'
        origin:
          type: string
          description: The scheme, host and port of the server's URL when the person allowed it; the token is sent
            only while the server's URL has this origin
          example: https://tools.example.com
        scopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: What the person allowed this server to use
        consentedAt:
          type: string
          format: date-time
    AllowableServer:
      type: object
      description: A server a person may allow to use a connected account, as the Allow button shows it
      required:
      - server
      - origin
      - scopes
      - covered
      - allowed
      properties:
        server:
          $ref: '#/components/schemas/ConnectServer'
        origin:
          type: string
          description: The scheme, host and port of the server's URL now; an allowance is bound to it
          example: https://tools.example.com
        scopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: What the server's capabilities, as the person may use them, ask of the account
        covered:
          type: boolean
          description: The connection is active and already has every one of scopes
        allowed:
          type: boolean
          description: Already allowed at this origin for these scopes
    AllowServerRequest:
      type: object
      description: The server to allow, with the address and scopes the person was shown
      required:
      - serverId
      - origin
      - scopes
      properties:
        serverId:
          type: string
          format: uuid
        origin:
          type: string
          description: The origin listAllowableServers returned; refused (409 server_changed) when the server has another now
        scopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: The scopes listAllowableServers returned; refused when the server asks for any that are not here
    ConnectConfirmed:
      type: object
      required:
      - provider
      - server
      - scopes
      properties:
        provider:
          $ref: '#/components/schemas/ProviderRef'
        server:
          $ref: '#/components/schemas/ConnectServer'
        scopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: Everything the server is now allowed to use of the account
    ConnectStart:
      type: object
      required:
      - providerId
      properties:
        providerId:
          type: string
          format: uuid
        scopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: Extra scopes to ask for (absent, with no requestId; the provider's default scopes)
        requestId:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: The consent link's request; its required scopes are added, and it is used up on success
        returnTo:
          type: string
          maxLength: 2000
          description: A path on this site to return to (starting with a single /). Default; /connect/done
    ConnectStarted:
      type: object
      required:
      - authorizeUrl
      - scopes
      - expiresAt
      properties:
        authorizeUrl:
          type: string
          description: The provider's authorization URL; send the browser there
        scopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: Everything asked for
        expiresAt:
          type: string
          format: date-time
          description: The state expires then (10 minutes)
    ConnectRequestCapability:
      type: object
      required:
      - kind
      - exposedName
      - title
      properties:
        kind:
          $ref: '#/components/schemas/GatewayCapabilityKind'
        exposedName:
          type: string
          example: github-tools__create_issue
        title:
          type: string
    ConnectRequest:
      type: object
      description: Why a call asked the person to connect an account (a consent link from JSON-RPC -32042)
      required:
      - id
      - provider
      - reason
      - requiredScopes
      - requestScopes
      - grantedScopes
      - accountLabel
      - gateway
      - capability
      - server
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderRef'
        server:
          allOf:
          - $ref: '#/components/schemas/ConnectServer'
          nullable: true
          description: The MCP server the link was made for, which the person is asked to allow to use the account (a
            consent link is for one server at one address). Null for an MCP server's own sign-in (provider.kind
            mcp_server)
        reason:
          type: string
          enum:
          - not_connected
          - missing_scopes
          - needs_reconsent
          - server_not_allowed
        requiredScopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: What the capability needs
        requestScopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: What will be asked for (granted scopes kept, plus the required ones)
        grantedScopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: What the person's active connection has now (empty when none)
        accountLabel:
          type: string
          nullable: true
          description: The account connected now, if any
        gateway:
          $ref: '#/components/schemas/CallRef'
        capability:
          $ref: '#/components/schemas/ConnectRequestCapability'
        authorizationServerHost:
          type: string
          nullable: true
          description: For an MCP server's own sign-in (provider.kind mcp_server), the host of its authorization server,
            for "lets <server> act as you at github.com"; null or absent for platform providers
          example: github.com
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    McpServerAuthMode:
      type: string
      enum:
      - none
      - static_header
      - oauth
      - person_secret
      - machine_oauth
      description: 'How the portal authenticates to the server (decision 39). none: only the identity token, in
        Authorization: Bearer. static_header: the static credential (authHeaderName, or credentials); the identity
        token moves to MCP-Gateway-Identity when it sets Authorization. oauth: each person''s own token from the
        server''s authorization server in Authorization: Bearer, and the identity token in MCP-Gateway-Identity. oauth
        excludes a static Authorization header and a requirement (one credential per call). person_secret (decision
        72): each person''s own API key or token, entered under Account > My connections and sent as the placement
        in personSecret says (a header, a bearer token or a query parameter); a bearer or an Authorization header
        moves the identity token to MCP-Gateway-Identity; it excludes a requirement and a static part that sets
        the same header, query parameter or Authorization. machine_oauth (decision 73): the portal''s own token from
        the server''s authorization server (the client credentials grant, machineOAuth), the same for every caller,
        in Authorization: Bearer, and the identity token in MCP-Gateway-Identity; it excludes a static Authorization
        header and a requirement like oauth does'
    PersonSecretInput:
      type: object
      description: How a server's person secrets travel and how the page where people enter them describes the key
      required:
      - placement
      properties:
        placement:
          $ref: '#/components/schemas/PersonSecretPlacement'
        name:
          type: string
          maxLength: 100
          description: The header (not a reserved one; Authorization is allowed) or the query parameter (1-64 letters,
            digits, dots, hyphens and underscores, never starting with mcp-). Absent for bearer
          example: X-API-Key
        prefix:
          type: string
          maxLength: 64
          description: Sent before the secret, for example "Token ". Not for bearer
        label:
          type: string
          maxLength: 100
          description: What the key is called on the page where people enter it
          example: Acme API key
        help:
          type: string
          maxLength: 2000
          description: Plain text on that page, saying where to find the key
    PersonSecretPlacement:
      type: string
      enum:
      - header
      - bearer
      - query
      description: 'header: Name: prefix + secret. bearer: Authorization: Bearer secret. query: ?Name=prefix+secret,
        added to each request and never to the saved URL; many servers and proxies log URLs, so prefer header or bearer'
    PersonSecretSettings:
      type: object
      required:
      - placement
      - prefix
      - label
      - help
      - people
      - rejected
      - setup
      properties:
        placement:
          $ref: '#/components/schemas/PersonSecretPlacement'
        name:
          type: string
          nullable: true
        prefix:
          type: string
        label:
          type: string
        help:
          type: string
        people:
          type: integer
          format: int64
          description: How many people have entered a key for this server
        rejected:
          type: integer
          format: int64
          description: Of those, how many the server refused (they are asked to enter them again)
        setup:
          $ref: '#/components/schemas/PersonSecretSetup'
    PersonSecretSetup:
      type: object
      description: The editor whose own key reads the server's capabilities (decision 42's counterpart); scheduled
        health checks send nobody's key
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - active
          - rejected
          - missing
          description: missing when nobody was chosen, or the person is no longer an active editor of the team, or
            their key was revoked or is for another address
        personId:
          type: string
          format: uuid
          nullable: true
        personName:
          type: string
          nullable: true
        at:
          type: string
          format: date-time
          nullable: true
    ServerSecret:
      type: object
      description: A server in person_secret mode with the caller's own key for it, if any. The key itself is never
        returned, only its last four characters when it has at least eight
      required:
      - server
      - config
      - origin
      - hasSecret
      - allowAgents
      - reachable
      - canSetup
      - isSetup
      properties:
        server:
          $ref: '#/components/schemas/ConnectServer'
        config:
          $ref: '#/components/schemas/PersonSecretInput'
        origin:
          type: string
          description: The scheme, host and port of the server's URL now; an entered key is bound to it
        hasSecret:
          type: boolean
        hint:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
          enum:
          - active
          - rejected
          description: The server answered 401 or 403 to a rejected key; it is not sent again until replaced
        allowAgents:
          type: boolean
          description: An agent that relays a call for the person may use the key (decisions 66 and 68). Off by default
        createdAt:
          type: string
          format: date-time
          nullable: true
        rotatedAt:
          type: string
          format: date-time
          nullable: true
        rejectedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        reachable:
          type: boolean
          description: The caller may use the server through a gateway now (they may enter or replace a key)
        canSetup:
          type: boolean
          description: The caller is an active editor of the server's team, so their key can read its capabilities
        isSetup:
          type: boolean
          description: Their key reads the server's capabilities now
    SetServerSecret:
      type: object
      description: A key, or a change to the caller's entry for one server
      required:
      - origin
      properties:
        origin:
          type: string
          description: The origin the page showed (ServerSecret.origin); refused (409 server_changed) when the server has
            another now
        value:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 4096
          description: The key, on one line (surrounding space is trimmed). Omit to keep the stored key while changing
            allowAgents or useForSetup. Sealed, never returned, logged or audited
        allowAgents:
          type: boolean
          description: Omit to keep (false for a new entry)
        useForSetup:
          type: boolean
          description: Read the server's capabilities with this key from now on (editors of the server's team only, else 403). The capabilities are read once it is saved; a failure is stored as the server's refresh error
    SecretRequest:
      type: object
      description: Why a call asked the person to enter their key (a link from JSON-RPC -32042 or an input request)
      required:
      - id
      - reason
      - server
      - config
      - origin
      - gateway
      - capability
      - secret
      properties:
        id:
          type: string
        reason:
          type: string
          enum:
          - secret_missing
          - secret_rejected
        server:
          $ref: '#/components/schemas/ConnectServer'
        config:
          $ref: '#/components/schemas/PersonSecretInput'
        origin:
          type: string
          description: Where the key will be sent, and only there
        gateway:
          $ref: '#/components/schemas/CallRef'
        capability:
          $ref: '#/components/schemas/ConnectRequestCapability'
        secret:
          $ref: '#/components/schemas/ServerSecret'
    McpServerOAuthRegistration:
      type: string
      enum:
      - dcr
      - cimd
      - manual
      - platform_provider
      description: 'How the portal got its OAuth client at the authorization server. dcr: registered automatically
        (RFC 7591). cimd: the portal''s Client ID Metadata Document <APP_URL>/oauth/upstream-client-metadata.json (a
        public client), offered only when APP_URL is public https and the authorization server supports it. manual:
        a client the team created at the authorization server (client ID and secret entered). platform_provider:
        the client of a platform auth provider whose authorization and token endpoints equal the discovered ones'
    McpServerOAuthRegistrationChoice:
      type: string
      enum:
      - auto
      - dcr
      - cimd
      - manual
      - platform_provider
      description: 'auto: cimd when offered, else dcr (the MCP spec''s order); 422 registration_unavailable when
        neither is. Stored as the McpServerOAuthRegistration it resolved to'
    McpServerRef:
      type: object
      required:
      - id
      - slug
      - name
      - teamSlug
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        teamSlug:
          type: string
    McpServerOAuthSetupConnection:
      type: object
      description: The sign-in the portal uses to read the server's capabilities and for manual tests (decision 42)
      required:
      - status
      - personId
      - personName
      - authorizedAt
      properties:
        status:
          type: string
          enum:
          - active
          - needs_reconsent
          - missing
          description: 'missing: nobody has signed in yet, or the person disconnected or was deleted.
            needs_reconsent: the sign-in lapsed (refresh refused, token revoked); refresh answers 409
            setup_reconsent_required until an editor signs in again'
        personId:
          type: string
          format: uuid
          nullable: true
        personName:
          type: string
          nullable: true
          description: Shown as "Capabilities read as <name>"
        authorizedAt:
          type: string
          format: date-time
          nullable: true
    McpServerOAuth:
      type: object
      description: An oauth server's sign-in configuration, as discovered and chosen. The client secret is never
        returned
      required:
      - providerId
      - providerSlug
      - resource
      - resourceMetadataUrl
      - authorizationServer
      - issuer
      - authorizationEndpoint
      - tokenEndpoint
      - revocationEndpoint
      - scopes
      - scopesSupported
      - registration
      - clientIdHint
      - hasClientSecret
      - clientSecretExpiresAt
      - tokenAuthMethod
      - sendResource
      - issParameterSupported
      - platformProvider
      - setupConnection
      - connectionCount
      - discoveredAt
      properties:
        providerId:
          type: string
          format: uuid
          description: The server-bound provider (kind mcp_server); people's connections to this server name it
        providerSlug:
          type: string
          description: Generated (mcp-...); used in consent links (/connect/{slug}) and call records
        resource:
          type: string
          description: The server's canonical URI from its protected-resource metadata; sent as the resource parameter
            and the only URL its tokens are ever sent to
          example: https://api.githubcopilot.com/mcp/
        resourceMetadataUrl:
          type: string
          example: https://api.githubcopilot.com/.well-known/oauth-protected-resource/mcp/
        authorizationServer:
          type: string
          description: The authorization server as the resource metadata lists it
          example: https://github.com/login/oauth
        issuer:
          type: string
          description: issuer from the authorization server's metadata (equal to authorizationServer); checked against
            the iss parameter of every authorization response
          example: https://github.com/login/oauth
        authorizationEndpoint:
          type: string
          example: https://github.com/login/oauth/authorize
        tokenEndpoint:
          type: string
          example: https://github.com/login/oauth/access_token
        revocationEndpoint:
          type: string
          nullable: true
        scopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: Asked for on every sign-in (empty; no scope parameter). Widening sends a published server back
            to review
        scopesSupported:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: scopes_supported from the resource metadata
        registration:
          $ref: '#/components/schemas/McpServerOAuthRegistration'
        clientIdHint:
          type: string
          description: Last 6 characters of the client ID (the CIMD URL in full for cimd)
        hasClientSecret:
          type: boolean
        clientSecretExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: dcr only, when the authorization server gave an expiry
        tokenAuthMethod:
          $ref: '#/components/schemas/AuthProviderTokenAuthMethod'
        sendResource:
          type: boolean
          description: Send the resource parameter (RFC 8707) on authorization and token requests, as the MCP spec
            requires; turn off only for an authorization server that rejects it
        issParameterSupported:
          type: boolean
          description: The authorization server sends iss in its authorization responses (RFC 9207); then a
            response without it is refused
        platformProvider:
          allOf:
          - $ref: '#/components/schemas/ProviderRef'
          nullable: true
          description: The linked platform provider (registration platform_provider)
        setupConnection:
          $ref: '#/components/schemas/McpServerOAuthSetupConnection'
        connectionCount:
          type: integer
          format: int64
          description: People signed in to this server
        discoveredAt:
          type: string
          format: date-time
          description: When the metadata was last read (on save)
        redirectUri:
          type: string
          description: The callback the server's OAuth client uses (<APP_URL>/connect/callback); register it with a
            manual client. Absent before this field was added
          example: https://mcp.example.com/connect/callback
    McpServerMachineOAuth:
      type: object
      description: >-
        A server's machine OAuth client (decision 73, docs/machine-oauth.md). The portal gets a token with
        the client credentials grant from tokenUrl and sends it as Authorization: Bearer to the server's URL. The client
        secret is never returned
      required:
      - tokenUrl
      - clientIdHint
      - hasClientSecret
      - clientSecretHint
      - tokenAuthMethod
      - scopes
      - audience
      - resource
      properties:
        tokenUrl:
          type: string
          description: The authorization server's token endpoint
        clientIdHint:
          type: string
          description: The last six characters of the client ID (all of a shorter one)
        hasClientSecret:
          type: boolean
          description: Always true (a machine client has a secret)
        clientSecretHint:
          type: string
          description: The last four characters of a secret of eight or more, else empty
        tokenAuthMethod:
          type: string
          enum:
          - client_secret_basic
          - client_secret_post
          description: How the portal authenticates to the token endpoint
        scopes:
          $ref: '#/components/schemas/ScopeList'
        audience:
          type: string
          nullable: true
          description: Sent as the audience parameter when set
        resource:
          type: string
          nullable: true
          description: Sent as the resource parameter (RFC 8707) when set
    McpServerMachineOAuthInput:
      type: object
      properties:
        tokenUrl:
          type: string
          maxLength: 1000
          description: The authorization server's token endpoint. The address rules apply as for a server's URL (https
            unless an internal-network entry allows http; no userinfo, query or fragment; 422 url_not_allowed with
            details.field machineOAuth.tokenUrl), when saved and at every token request
        clientId:
          type: string
          minLength: 1
          maxLength: 500
        clientSecret:
          type: string
          minLength: 1
          maxLength: 2000
          description: Sealed with ENCRYPTION_KEY, never returned. Replace-only; omit to keep the stored one (not
            allowed when tokenUrl, clientId or the server's origin changes)
        tokenAuthMethod:
          type: string
          enum:
          - client_secret_basic
          - client_secret_post
          description: 'Default client_secret_basic: the client ID and secret in an HTTP Basic header. client_secret_post
            sends them in the request body'
        scopes:
          $ref: '#/components/schemas/ScopeList'
        audience:
          type: string
          maxLength: 500
          description: Sent as the audience parameter (some authorization servers want it). An empty string removes it
        resource:
          type: string
          maxLength: 500
          description: An absolute URI without a fragment, sent as the resource parameter (RFC 8707) so the token is for
            this server only (authorization servers that ignore it leave the token usable elsewhere). An empty string
            removes it
    McpServerOAuthInput:
      type: object
      properties:
        authorizationServer:
          type: string
          maxLength: 500
          description: One of the resource metadata's authorization_servers (default; the first)
        registration:
          allOf:
          - $ref: '#/components/schemas/McpServerOAuthRegistrationChoice'
          default: auto
        clientId:
          type: string
          minLength: 1
          maxLength: 500
          description: manual only
        clientSecret:
          type: string
          minLength: 1
          maxLength: 2000
          description: manual only. Sealed with ENCRYPTION_KEY, never returned. Replace-only; omit to keep the stored
            one. Required unless tokenAuthMethod is none
        tokenAuthMethod:
          allOf:
          - $ref: '#/components/schemas/AuthProviderTokenAuthMethod'
          description: manual only (default client_secret_post, or the first the authorization server lists). dcr picks
            from the metadata; cimd is always none; platform_provider uses the provider's
        platformProviderId:
          type: string
          format: uuid
          description: platform_provider only; one of DetectAuthRegistration.matchingProviders
        scopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: 'Default: the challenge''s scope, else the resource metadata''s scopes_supported (the MCP
            spec''s scope selection)'
        sendResource:
          type: boolean
          default: true
    OAuthSetupStart:
      type: object
      properties:
        returnTo:
          type: string
          maxLength: 2000
          description: A path on this site (default /teams/{team}/servers/{serverId}?setup=connected)
    IdentityDefault:
      type: object
      required:
      - basis
      - sendIdentity
      properties:
        basis:
          type: string
          enum:
          - public_host
          - internal_host
          - unresolved_host
          description: 'public_host: a public address that no internal allowlist entry names. internal_host: named by
            an allowlist entry, or a private address. unresolved_host: the name could not be resolved in time; treated
            as public, because nothing shows it is internal'
        sendIdentity:
          type: boolean
          description: The default of Send identity token for a server with no authentication at this URL. false for
            public_host and unresolved_host, true for internal_host
    DetectAuthRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          maxLength: 500
          description: The MCP endpoint, checked like a server URL
    DetectAuthOutcome:
      type: string
      enum:
      - no_auth
      - oauth
      - other_auth
      - unreachable
      description: 'no_auth: initialize worked without credentials (authMode none). oauth: a Bearer challenge and
        usable metadata (authMode oauth possible; check problems). other_auth: 401/403 without usable OAuth metadata
        (use a static header). unreachable: network error, timeout, 5xx or not an MCP endpoint'
    DetectAuthChallenge:
      type: object
      description: The parsed WWW-Authenticate header of the 401
      required:
      - scheme
      - resourceMetadataUrl
      - scope
      - error
      properties:
        scheme:
          type: string
          example: Bearer
        resourceMetadataUrl:
          type: string
          nullable: true
        scope:
          $ref: '#/components/schemas/ScopeList'
        error:
          type: string
          nullable: true
    DetectAuthResourceMetadata:
      type: object
      description: RFC 9728 protected-resource metadata
      required:
      - url
      - resource
      - resourceName
      - authorizationServers
      - scopesSupported
      - bearerMethodsSupported
      properties:
        url:
          type: string
          description: Where it was read
        resource:
          type: string
        resourceName:
          type: string
          nullable: true
        authorizationServers:
          type: array
          maxItems: 20
          items:
            type: string
        scopesSupported:
          $ref: '#/components/schemas/ScopeList'
        bearerMethodsSupported:
          type: array
          maxItems: 10
          items:
            type: string
    DetectAuthServerMetadata:
      type: object
      description: RFC 8414 / OpenID Connect metadata of the chosen authorization server
      required:
      - issuer
      - metadataUrl
      - authorizationEndpoint
      - tokenEndpoint
      - revocationEndpoint
      - registrationEndpoint
      - scopesSupported
      - codeChallengeMethodsSupported
      - tokenEndpointAuthMethodsSupported
      - grantTypesSupported
      - issParameterSupported
      - clientIdMetadataDocumentSupported
      properties:
        issuer:
          type: string
        metadataUrl:
          type: string
          example: https://github.com/.well-known/oauth-authorization-server/login/oauth
        authorizationEndpoint:
          type: string
        tokenEndpoint:
          type: string
        revocationEndpoint:
          type: string
          nullable: true
        registrationEndpoint:
          type: string
          nullable: true
        scopesSupported:
          $ref: '#/components/schemas/ScopeList'
        codeChallengeMethodsSupported:
          type: array
          maxItems: 10
          items:
            type: string
        tokenEndpointAuthMethodsSupported:
          type: array
          maxItems: 10
          items:
            type: string
        grantTypesSupported:
          type: array
          maxItems: 20
          items:
            type: string
        issParameterSupported:
          type: boolean
        clientIdMetadataDocumentSupported:
          type: boolean
    DetectAuthRegistration:
      type: object
      description: How the portal can get a client, and what to give a manual one
      required:
      - options
      - recommended
      - cimdUnavailableReason
      - matchingProviders
      - redirectUri
      - clientMetadataUrl
      properties:
        options:
          type: array
          items:
            $ref: '#/components/schemas/McpServerOAuthRegistration'
          description: Always includes manual
        recommended:
          $ref: '#/components/schemas/McpServerOAuthRegistration'
        cimdUnavailableReason:
          type: string
          nullable: true
          enum:
          - not_supported
          - app_url_not_public
        matchingProviders:
          type: array
          items:
            $ref: '#/components/schemas/ProviderRef'
          description: Enabled platform providers whose authorization and token endpoints equal the discovered ones
        redirectUri:
          type: string
          description: Register this callback with a manual client
          example: https://mcp.example.com/connect/callback
        clientMetadataUrl:
          type: string
          description: The portal's Client ID Metadata Document (the client ID for cimd)
    DetectAuthProblem:
      type: object
      required:
      - code
      - blocking
      - message
      properties:
        code:
          type: string
          enum:
          - no_resource_metadata
          - resource_mismatch
          - several_authorization_servers
          - metadata_not_found
          - invalid_metadata
          - issuer_mismatch
          - no_pkce
          - endpoint_not_allowed
          - no_registration
          - no_refresh
          description: 'blocking ones stop oauth mode: resource_mismatch (the metadata''s resource isn''t this URL;
            see suggestedUrl), metadata_not_found, invalid_metadata, issuer_mismatch, no_pkce (S256 not listed, so
            the MCP spec says not to proceed), endpoint_not_allowed (an endpoint isn''t https or is refused by the
            address rules). Informational: no_resource_metadata (found by the well-known fallback),
            several_authorization_servers (the first is used unless another is chosen), no_registration (enter a
            client), no_refresh (refresh_token not in grant_types_supported)'
        blocking:
          type: boolean
        message:
          type: string
    DetectAuthStep:
      type: object
      description: One request the probe made, so the UI can show what was tried
      required:
      - purpose
      - url
      - httpStatus
      - result
      - latencyMs
      properties:
        purpose:
          type: string
          enum:
          - mcp
          - resource_metadata
          - authorization_server_metadata
        url:
          type: string
        httpStatus:
          type: integer
          format: int32
          nullable: true
        result:
          type: string
          enum:
          - ok
          - challenge
          - not_found
          - error
          - not_allowed
          - timeout
        latencyMs:
          type: integer
          format: int64
    DetectAuthMachine:
      type: object
      required:
      - tokenEndpoint
      - grantTypesListed
      - clientCredentials
      - tokenAuthMethods
      - resource
      properties:
        tokenEndpoint:
          type: string
          description: The authorization server's token endpoint, to enter as tokenUrl
        grantTypesListed:
          type: boolean
          description: grant_types_supported was in its metadata (RFC 8414 defaults an absent list to authorization_code
            and implicit, so clientCredentials is false when it is not listed)
        clientCredentials:
          type: boolean
          description: client_credentials is in grant_types_supported
        tokenAuthMethods:
          type: array
          items:
            type: string
            enum:
            - client_secret_basic
            - client_secret_post
          description: The token endpoint authentication methods it lists that the portal can use
        resource:
          type: string
          description: The protected resource identifier from the server's metadata, to enter as resource when the
            authorization server supports RFC 8707 (empty when none was found)
    DetectAuthResult:
      type: object
      required:
      - url
      - outcome
      - httpStatus
      - challenge
      - resourceMetadata
      - suggestedUrl
      - authorizationServer
      - registration
      - suggestedScopes
      - problems
      - steps
      properties:
        url:
          type: string
          description: The URL probed
        outcome:
          $ref: '#/components/schemas/DetectAuthOutcome'
        httpStatus:
          type: integer
          format: int32
          nullable: true
        challenge:
          allOf:
          - $ref: '#/components/schemas/DetectAuthChallenge'
          nullable: true
        resourceMetadata:
          allOf:
          - $ref: '#/components/schemas/DetectAuthResourceMetadata'
          nullable: true
        suggestedUrl:
          type: string
          nullable: true
          description: The metadata's resource when it differs from url only by a trailing slash or the case of
            scheme and host; register the server with this URL
        authorizationServer:
          allOf:
          - $ref: '#/components/schemas/DetectAuthServerMetadata'
          nullable: true
        registration:
          allOf:
          - $ref: '#/components/schemas/DetectAuthRegistration'
          nullable: true
        machineOAuth:
          allOf:
          - $ref: '#/components/schemas/DetectAuthMachine'
          nullable: true
          description: Whether the authorization server it found offers the client credentials grant (for authMode
            machine_oauth); null when no authorization server metadata was found
        suggestedScopes:
          allOf:
          - $ref: '#/components/schemas/ScopeList'
          description: The challenge's scope, else the resource metadata's scopes_supported
        problems:
          type: array
          items:
            $ref: '#/components/schemas/DetectAuthProblem'
        steps:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/DetectAuthStep'
    UsagePrincipalKind:
      type: string
      enum:
      - api_key
      - oauth
      - service_account
      description: As CallPrincipal.kind
    RateLimitKey:
      type: string
      enum:
      - person_per_minute
      - credential_per_minute
      - service_account_per_minute
      - gateway_per_minute
      description: 'person_per_minute: every /mcp request by one person, any credential and gateway.
        credential_per_minute: per personal API key or OAuth connection. service_account_per_minute: per service
        account, all its keys (team override). gateway_per_minute: per gateway, all callers together (team override as
        the default of the team''s gateways; each gateway can set its own).'
    RateLimitValue:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000
      nullable: true
      description: Requests per minute; null means unlimited (or, for a ceiling, no ceiling)
    PlatformRateLimit:
      type: object
      required:
      - key
      - label
      - description
      - teamOverridable
      - default
      - ceiling
      - builtInDefault
      - max
      - cappedTeams
      - cappedGateways
      properties:
        key:
          $ref: '#/components/schemas/RateLimitKey'
        label:
          type: string
        description:
          type: string
        teamOverridable:
          type: boolean
          description: Teams can have their own value (and gateways, for gateway_per_minute), up to the ceiling
        default:
          allOf:
          - $ref: '#/components/schemas/RateLimitValue'
          description: 'Applies where no override is set (null: unlimited)'
        ceiling:
          allOf:
          - $ref: '#/components/schemas/RateLimitValue'
          description: 'The most a team override or gateway value can be (null: no ceiling). Always null when
            teamOverridable is false.'
        builtInDefault:
          allOf:
          - $ref: '#/components/schemas/RateLimitValue'
          description: The default before any platform admin changed it
        max:
          type: integer
          format: int64
          description: The most the portal allows for any value (1000000)
        cappedTeams:
          type: integer
          format: int64
          description: Active teams whose override is above the ceiling (the ceiling applies)
        cappedGateways:
          type: integer
          format: int64
          description: Gateways whose own value is above the ceiling (the ceiling applies)
    LimitSettings:
      type: object
      required:
      - items
      - revision
      - updatedAt
      properties:
        items:
          type: array
          description: Every key, in a fixed order
          items:
            $ref: '#/components/schemas/PlatformRateLimit'
        revision:
          $ref: '#/components/schemas/Revision'
        updatedAt:
          type: string
          format: date-time
    PlatformRateLimitSetting:
      type: object
      required:
      - key
      - default
      - ceiling
      properties:
        key:
          $ref: '#/components/schemas/RateLimitKey'
        default:
          allOf:
          - $ref: '#/components/schemas/RateLimitValue'
          description: null = unlimited; at most the ceiling
        ceiling:
          allOf:
          - $ref: '#/components/schemas/RateLimitValue'
          description: null = no ceiling; must be null for keys teams can't override
    LimitSettingsUpdate:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/PlatformRateLimitSetting'
    TeamRateLimit:
      type: object
      required:
      - key
      - label
      - description
      - teamOverridable
      - override
      - default
      - ceiling
      - effective
      properties:
        key:
          $ref: '#/components/schemas/RateLimitKey'
        label:
          type: string
        description:
          type: string
        teamOverridable:
          type: boolean
        override:
          allOf:
          - $ref: '#/components/schemas/RateLimitValue'
          description: 'The team''s own value (null: inherits the default; always null when teamOverridable is false)'
        default:
          $ref: '#/components/schemas/RateLimitValue'
        ceiling:
          $ref: '#/components/schemas/RateLimitValue'
        effective:
          allOf:
          - $ref: '#/components/schemas/RateLimitValue'
          description: 'What applies: override, else default, capped at the ceiling (null: unlimited). For
            gateway_per_minute, what the team''s gateways without their own value get.'
    TeamLimits:
      type: object
      required:
      - teamId
      - teamSlug
      - revision
      - items
      properties:
        teamId:
          type: string
          format: uuid
        teamSlug:
          type: string
        revision:
          allOf:
          - $ref: '#/components/schemas/Revision'
          description: The team's revision (If-Match for the admin update)
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamRateLimit'
    TeamLimitChange:
      type: object
      required:
      - key
      - value
      properties:
        key:
          $ref: '#/components/schemas/RateLimitKey'
        value:
          allOf:
          - $ref: '#/components/schemas/RateLimitValue'
          description: A value up to the ceiling, or null to inherit the platform default
    TeamLimitsUpdate:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/TeamLimitChange'
    CaptureRule:
      type: object
      description: A built-in redaction rule (always on)
      required:
      - name
      - description
      properties:
        name:
          type: string
          example: github
        description:
          type: string
    RedactionPattern:
      type: object
      required:
      - pattern
      properties:
        pattern:
          type: string
          minLength: 1
          maxLength: 500
          description: An RE2 regular expression (Go regexp syntax; case-sensitive unless it starts with (?i)). Every
            match in a captured string becomes [REDACTED]. Must not match the empty string.
          example: EMP-[0-9]{6}
        note:
          type: string
          maxLength: 200
    CaptureSettings:
      type: object
      required:
      - builtInRules
      - sensitiveKeys
      - patterns
      - maxPartBytes
      - revision
      - updatedAt
      properties:
        builtInRules:
          type: array
          items:
            $ref: '#/components/schemas/CaptureRule'
        sensitiveKeys:
          type: array
          description: Normalised JSON member names (lower case, without - and _) whose values are always replaced
          items:
            type: string
        patterns:
          type: array
          maxItems: 50
          description: The platform admins' extra patterns
          items:
            $ref: '#/components/schemas/RedactionPattern'
        maxPartBytes:
          type: integer
          format: int32
          description: Arguments and result are each truncated to this many bytes after redaction (16384)
        revision:
          $ref: '#/components/schemas/Revision'
        updatedAt:
          type: string
          format: date-time
    CaptureSettingsUpdate:
      type: object
      required:
      - patterns
      properties:
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/RedactionPattern'
    RedactionTestRequest:
      type: object
      required:
      - sample
      properties:
        sample:
          type: string
          maxLength: 65536
          description: JSON (member-name rules apply too) or plain text (string rules only)
        patterns:
          type: array
          description: 'Patterns to try instead of the saved ones (absent: the saved ones)'
          items:
            $ref: '#/components/schemas/RedactionPattern'
    RedactionRuleCount:
      type: object
      required:
      - rule
      - count
      properties:
        rule:
          type: string
          description: A built-in rule name, sensitive_keys, or pattern:<index> for an admin pattern
        count:
          type: integer
          format: int32
    RedactionTestResult:
      type: object
      required:
      - redacted
      - redactions
      - rules
      - truncated
      properties:
        redacted:
          type: string
        redactions:
          type: integer
          format: int32
        rules:
          type: array
          description: Which rules matched, and how often
          items:
            $ref: '#/components/schemas/RedactionRuleCount'
        truncated:
          type: boolean
    RetentionKind:
      type: string
      enum:
      - call_metadata
      - captured_payloads
      - audit_log
      - usage_rollups
      description: 'call_metadata: call records (mcp_calls); captured_payloads: captured arguments and results;
        audit_log: the audit log (platform only); usage_rollups: hourly usage (platform only).'
    RetentionPeriod:
      type: object
      required:
      - kind
      - days
      - builtInDays
      - minDays
      - maxDays
      - teamOverridable
      properties:
        kind:
          $ref: '#/components/schemas/RetentionKind'
        days:
          type: integer
          format: int32
          description: The platform period
        builtInDays:
          type: integer
          format: int32
          description: 'The default before any platform admin changed it (call_metadata 90, captured_payloads 14,
            audit_log 400, usage_rollups 400)'
        minDays:
          type: integer
          format: int32
        maxDays:
          type: integer
          format: int32
        teamOverridable:
          type: boolean
    RetentionRun:
      type: object
      required:
      - startedAt
      - finishedAt
      - deleted
      - errors
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        deleted:
          type: object
          description: Rows deleted per kind (RetentionKind values as keys)
          additionalProperties:
            type: integer
            format: int64
        errors:
          type: object
          description: Kinds that failed, with an error class (retried at the next run)
          additionalProperties:
            type: string
    RetentionSettings:
      type: object
      required:
      - periods
      - revision
      - updatedAt
      - lastRun
      properties:
        periods:
          type: array
          description: Every kind, in a fixed order
          items:
            $ref: '#/components/schemas/RetentionPeriod'
        revision:
          $ref: '#/components/schemas/Revision'
        updatedAt:
          type: string
          format: date-time
        lastRun:
          allOf:
          - $ref: '#/components/schemas/RetentionRun'
          nullable: true
          description: The latest run of the retention loop (null before the first)
    RetentionPeriodSetting:
      type: object
      required:
      - kind
      - days
      properties:
        kind:
          $ref: '#/components/schemas/RetentionKind'
        days:
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
          description: Within the kind's minDays and maxDays
    RetentionSettingsUpdate:
      type: object
      required:
      - periods
      properties:
        periods:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/RetentionPeriodSetting'
    TeamRetentionPeriod:
      type: object
      required:
      - kind
      - override
      - default
      - effective
      - minDays
      - maxDays
      properties:
        kind:
          $ref: '#/components/schemas/RetentionKind'
        override:
          type: integer
          format: int32
          nullable: true
          description: 'The team''s own period in days (null: the platform period)'
        default:
          type: integer
          format: int32
          description: The platform period
        effective:
          type: integer
          format: int32
          description: override, else default. Calls that also involve another team use the shorter of the two teams'
            periods
        minDays:
          type: integer
          format: int32
        maxDays:
          type: integer
          format: int32
    TeamRetention:
      type: object
      required:
      - teamId
      - teamSlug
      - revision
      - periods
      properties:
        teamId:
          type: string
          format: uuid
        teamSlug:
          type: string
        revision:
          allOf:
          - $ref: '#/components/schemas/Revision'
          description: The team's revision (If-Match for the admin update)
        periods:
          type: array
          description: The kinds teams can override (call_metadata, captured_payloads)
          items:
            $ref: '#/components/schemas/TeamRetentionPeriod'
    TeamRetentionChange:
      type: object
      required:
      - kind
      - days
      properties:
        kind:
          $ref: '#/components/schemas/RetentionKind'
        days:
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
          nullable: true
          description: Within the kind's minDays and maxDays, or null to use the platform period
    TeamRetentionUpdate:
      type: object
      required:
      - periods
      properties:
        periods:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/TeamRetentionChange'
    CallPayloadPart:
      type: object
      required:
      - content
      - bytes
      - truncated
      - redactions
      properties:
        content:
          type: string
          description: The redacted JSON text; no longer valid JSON when truncated. Binary content items show as
            [binary N bytes]
        bytes:
          type: integer
          format: int64
          description: Size of the redacted JSON before truncation
        truncated:
          type: boolean
          description: Cut to 16 KiB (at a UTF-8 boundary)
        redactions:
          type: integer
          format: int32
          description: Values replaced with [REDACTED]
    CallPayload:
      type: object
      description: What a call sent and received, as captured (redacted, then truncated). Never contains the identity
        JWT, provider tokens, client credentials or the server's static header.
      required:
      - callId
      - capturedAt
      - expiresAt
      - capturedBy
      - arguments
      - result
      - redactions
      - truncated
      properties:
        callId:
          type: integer
          format: int64
        capturedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When retention deletes it under the current settings
        capturedBy:
          type: array
          description: Whose switch captured it (one or both)
          items:
            type: string
            enum:
            - gateway
            - server
        arguments:
          allOf:
          - $ref: '#/components/schemas/CallPayloadPart'
          description: 'The call''s arguments (tools/call, prompts/get) or {"uri": <exposed URI>} (resources/read)'
        result:
          allOf:
          - $ref: '#/components/schemas/CallPayloadPart'
          nullable: true
          description: What the client received (the result, or the server's JSON-RPC error); null when there was none
            (timeout, unreachable, too large)
        redactions:
          type: integer
          format: int32
          description: Both parts together
        truncated:
          type: boolean
          description: Either part was truncated
    UsageGroupBy:
      type: string
      enum:
      - gateway
      - server
      - capability
      - team
      - principalKind
      - day
      - hour
      default: day
      description: 'team: the gateway''s team (platform gateways are one row with key platform). day and hour are UTC
        buckets; hour allows at most 7 days.'
    UsageMetrics:
      type: object
      required:
      - calls
      - errors
      - outcomes
      - p50LatencyMs
      - p95LatencyMs
      - requestBytes
      - responseBytes
      properties:
        calls:
          type: integer
          format: int64
          description: Recorded requests (lists and calls)
        errors:
          type: integer
          format: int64
          description: Recorded requests with any outcome but ok
        outcomes:
          type: object
          description: Count per McpCallOutcome (outcomes with no calls are left out)
          additionalProperties:
            type: integer
            format: int64
        p50LatencyMs:
          type: integer
          format: int32
          nullable: true
          description: Median latency, interpolated within fixed buckets (null without calls)
        p95LatencyMs:
          type: integer
          format: int32
          nullable: true
        requestBytes:
          type: integer
          format: int64
        responseBytes:
          type: integer
          format: int64
    UsageBucket:
      type: object
      required:
      - start
      - metrics
      properties:
        start:
          type: string
          format: date-time
        metrics:
          $ref: '#/components/schemas/UsageMetrics'
    UsageRow:
      type: object
      required:
      - key
      - label
      - metrics
      properties:
        key:
          type: string
          description: 'Stable within the grouping: a gateway, server or team ID, platform, a capability ID (or
            name:<exposedName> for calls that named no known capability), a principal kind, or the bucket start'
        label:
          type: string
          description: A name to show (as recorded, for deleted objects)
        ref:
          allOf:
          - $ref: '#/components/schemas/CallRef'
          description: The gateway, server or team (groupBy gateway, server, team)
        capability:
          type: object
          description: groupBy capability
          required:
          - exposedName
          properties:
            id:
              type: string
              format: uuid
            exposedName:
              type: string
            server:
              $ref: '#/components/schemas/CallRef'
        principalKind:
          $ref: '#/components/schemas/UsagePrincipalKind'
        start:
          type: string
          format: date-time
          description: groupBy day or hour
        metrics:
          $ref: '#/components/schemas/UsageMetrics'
        series:
          type: array
          description: With series=true and a non-time grouping, one bucket per UTC day in the range (empty days
            included)
          items:
            $ref: '#/components/schemas/UsageBucket'
    UsageReport:
      type: object
      required:
      - from
      - to
      - groupBy
      - rolledUpTo
      - totals
      - rows
      - truncated
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        groupBy:
          $ref: '#/components/schemas/UsageGroupBy'
        rolledUpTo:
          type: string
          format: date-time
          nullable: true
          description: Calls up to this time are included (the rollup runs every 5 minutes); null before the first
            rollup
        totals:
          $ref: '#/components/schemas/UsageMetrics'
        rows:
          type: array
          description: Time groupings in time order with empty buckets; others by calls, most first, at most limit
          items:
            $ref: '#/components/schemas/UsageRow'
        truncated:
          type: boolean
          description: More rows than limit (totals still cover everything)
    TeamRef:
      type: object
      description: A team, as named in overviews, notifications and tokens
      required:
      - id
      - slug
      - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    LinkTarget:
      type: object
      description: 'Where the web app goes for an item (docs/admin-overview.md, Link targets). server: the server page (team
        page for members, Admin > Servers for platform staff); servers: the team''s server list; review_queue: Admin > Publishing;
        gateways: Admin > Gateways; service_account / service_accounts: the team''s service accounts; automation_tokens: Admin
        > Automation tokens; team_automation_tokens: the team''s Settings > Automation tokens; auth_providers: Admin > Auth
        providers; usage: Admin > Usage; notification_settings: Admin > Notifications; team_notification_settings: the team''s
        Settings > Notifications; account_connections: Account > Connections; account_api_keys: Account > API keys.'
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - server
          - servers
          - review_queue
          - gateways
          - service_account
          - service_accounts
          - automation_tokens
          - team_automation_tokens
          - auth_providers
          - usage
          - notification_settings
          - team_notification_settings
          - account_connections
          - account_api_keys
        id:
          type: string
          description: The object's ID for singular types (server, service_account)
        teamSlug:
          type: string
          description: The team's slug, for team pages and for the team's server or service account
    AttentionKind:
      type: string
      enum:
      - server_failing
      - upstream_signin_lapsed
      - review_pending
      - capabilities_changed
      - personal_keys_expiring
      - service_account_keys_expiring
      - automation_tokens_expiring
      - connections_reconsent
      - gateways_disabled
      - rate_limited
      - notification_failures
      - server_certificate_expiring
      description: 'server_certificate_expiring: one item per enabled server whose mTLS client certificate expires within
        14 days or has expired (at = notAfter; critical once expired, warning within 3 days). server_failing: one item per enabled server whose latest health check failed (at = failing since). upstream_signin_lapsed:
        one per oauth-mode server whose setup sign-in needs re-consent (at = since). review_pending: one item, count = servers
        waiting for a platform review, at = the oldest request. capabilities_changed: one per published server with changed
        or unapproved capabilities (count = how many, held back from the catalog). personal_keys_expiring: count of personal
        API keys expiring within 14 days (platform overview only; no link: they belong to individuals). service_account_keys_expiring:
        one per team, count = keys expiring within 14 days (at = the earliest expiry). automation_tokens_expiring: one for platform
        tokens and one per team, count within 14 days. connections_reconsent: count of people''s connections that need re-consent
        (setup sign-ins of servers are upstream_signin_lapsed instead). gateways_disabled: count of switched-off gateways of
        active teams. rate_limited: calls refused by a rate limit in the last 24 hours. notification_failures: failing webhook
        destinations (stopped automatically, or 3 or more failures in a row) plus one if email had a failed delivery in the
        last 24 hours.'
    AttentionSeverity:
      type: string
      enum:
      - critical
      - warning
      - info
    AttentionSubject:
      type: object
      description: The server (or gateway) an item is about
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
    AttentionItem:
      type: object
      required:
      - kind
      - severity
      - summary
      properties:
        kind:
          $ref: '#/components/schemas/AttentionKind'
        severity:
          $ref: '#/components/schemas/AttentionSeverity'
        summary:
          type: string
          description: One line in English, for scripts and logs; the web app builds its own wording from the fields
        count:
          type: integer
          format: int64
          description: How many, for kinds that count
        at:
          type: string
          format: date-time
          nullable: true
          description: 'The time that matters for the kind (see AttentionKind): failing since, the oldest request, the earliest
            expiry. Null when none.'
        subject:
          allOf:
          - $ref: '#/components/schemas/AttentionSubject'
          nullable: true
        team:
          allOf:
          - $ref: '#/components/schemas/TeamRef'
          nullable: true
        link:
          allOf:
          - $ref: '#/components/schemas/LinkTarget'
          nullable: true
          description: Where to go; null when there is nowhere useful (personal keys)
    OverviewCounts:
      type: object
      required:
      - users
      - teams
      - servers
      - publishedServers
      - gateways
      - serviceAccounts
      - automationTokens
      properties:
        users:
          type: integer
          format: int64
          description: Active people
        teams:
          type: integer
          format: int64
          description: Active teams
        servers:
          type: integer
          format: int64
        publishedServers:
          type: integer
          format: int64
        gateways:
          type: integer
          format: int64
          description: Gateways of active teams, and platform gateways
        serviceAccounts:
          type: integer
          format: int64
        automationTokens:
          type: integer
          format: int64
          description: Active automation tokens (both kinds)
    OverviewActivity:
      type: object
      description: The last 24 hourly rollup buckets (the current hour included), from the usage rollups
      required:
      - calls
      - errors
      - errorRate
      - rateLimited
      - rolledUpTo
      properties:
        calls:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
          description: Every outcome but ok, as Admin > Usage counts them (denied, rate_limited and needs_authorization included),
            so the figures agree
        errorRate:
          type: number
          format: double
          nullable: true
          description: errors / calls from 0 to 1; null without calls
        rateLimited:
          type: integer
          format: int64
        rolledUpTo:
          type: string
          format: date-time
          nullable: true
          description: Calls up to this time are included (rollups run every 5 minutes)
    AdminOverview:
      type: object
      description: The platform overview (Admin > Overview)
      required:
      - generatedAt
      - counts
      - last24h
      - attention
      - totals
      - truncated
      properties:
        generatedAt:
          type: string
          format: date-time
        counts:
          $ref: '#/components/schemas/OverviewCounts'
        last24h:
          $ref: '#/components/schemas/OverviewActivity'
        attention:
          type: array
          items:
            $ref: '#/components/schemas/AttentionItem'
          description: At most 20 items per kind, most severe first
        totals:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Exact number per AttentionKind (servers for per-server kinds, otherwise the sum of count); kinds with
            nothing are left out. Larger than the items listed when truncated.
        truncated:
          type: boolean
    TeamAttention:
      type: object
      description: The team overview's attention card
      required:
      - generatedAt
      - attention
      - totals
      - truncated
      properties:
        generatedAt:
          type: string
          format: date-time
        attention:
          type: array
          items:
            $ref: '#/components/schemas/AttentionItem'
        totals:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Exact number per AttentionKind (servers for per-server kinds, otherwise the sum of count); kinds with
            nothing are left out. Larger than the items listed when truncated.
        truncated:
          type: boolean
    NotificationEventType:
      type: string
      enum:
      - server.unhealthy
      - server.recovered
      - capability.changed
      - publish.requested
      - publish.decided
      - connection.needs_reconsent
      - upstream_signin.lapsed
      - key.expiring
      description: 'server.unhealthy: 3 failed checks in a row, once per incident, a reminder every 24 hours while it lasts.
        server.recovered. capability.changed: a published server''s definition changed or grew and is held back. publish.requested:
        a server entered review (platform admins). publish.decided: approved or rejected (team owners and admins). connection.needs_reconsent:
        a person''s connection to a provider or server lapsed (that person only). upstream_signin.lapsed: an oauth server''s
        setup sign-in lapsed (editors and above). key.expiring: a key or token expires in 7 days. Webhooks can''t subscribe
        to connection.needs_reconsent or to personal keys.'
    NotificationItem:
      type: object
      required:
      - id
      - event
      - title
      - body
      - team
      - link
      - createdAt
      - readAt
      properties:
        id:
          type: integer
          format: int64
        event:
          $ref: '#/components/schemas/NotificationEventType'
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 500
        team:
          allOf:
          - $ref: '#/components/schemas/TeamRef'
          nullable: true
        link:
          allOf:
          - $ref: '#/components/schemas/LinkTarget'
          nullable: true
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
    NotificationPage:
      type: object
      required:
      - items
      - unreadCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationItem'
        nextCursor:
          type: string
          nullable: true
        unreadCount:
          type: integer
          format: int64
    NotificationUnreadCount:
      type: object
      required:
      - count
      properties:
        count:
          type: integer
          format: int64
    NotificationMarked:
      type: object
      required:
      - marked
      properties:
        marked:
          type: integer
          format: int64
    NotificationPreference:
      type: object
      required:
      - event
      - inApp
      - email
      - custom
      properties:
        event:
          $ref: '#/components/schemas/NotificationEventType'
        inApp:
          type: boolean
        email:
          type: boolean
        custom:
          type: boolean
          description: false while both values are the defaults
    NotificationPreferences:
      type: object
      required:
      - emailAvailable
      - emailAddress
      - items
      properties:
        emailAvailable:
          type: boolean
          description: The operator configured SMTP; without it email choices are kept but nothing is sent
        emailAddress:
          type: string
          description: 'Where email goes: the address on the person''s profile'
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreference'
    NotificationPreferenceChange:
      type: object
      required:
      - event
      properties:
        event:
          $ref: '#/components/schemas/NotificationEventType'
        inApp:
          type: boolean
        email:
          type: boolean
    NotificationPreferencesUpdate:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/NotificationPreferenceChange'
    NotificationFormat:
      type: string
      enum:
      - json
      - slack
      description: 'json: a signed JSON envelope (docs/notifications.md). slack: {"text": ...}, unsigned, for Slack-compatible
        incoming webhooks.'
    NotificationErrorClass:
      type: string
      enum:
      - not_allowed
      - connect
      - tls
      - timeout
      - auth
      - rejected
      - server_error
      - address
      - expired
      - internal
      description: 'not_allowed: the address isn''t allowed (blocked or not in the internal-network allowlist, or a redirect).
        connect: unreachable. tls: certificate or handshake problem (or STARTTLS missing). timeout. auth: SMTP login refused.
        rejected: the destination answered 4xx (SMTP 5xx). server_error: it answered 5xx. address: the recipient address was
        refused. expired: still undelivered after 24 hours. internal.'
    NotificationDestinationHealth:
      type: object
      required:
      - state
      - consecutiveFailures
      properties:
        state:
          type: string
          enum:
          - unknown
          - ok
          - failing
        consecutiveFailures:
          type: integer
          format: int32
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        lastFailureAt:
          type: string
          format: date-time
          nullable: true
        lastErrorClass:
          allOf:
          - $ref: '#/components/schemas/NotificationErrorClass'
          nullable: true
    NotificationDestination:
      type: object
      description: 'A webhook destination. The URL is sealed with ENCRYPTION_KEY and never returned (a Slack incoming-webhook
        URL is itself a credential): urlDisplay shows scheme and host only. Format json is signed; the signing secret is shown
        once on creation and on rotation. Format slack is unsigned ({"text": ...}).'
      required:
      - id
      - scope
      - name
      - format
      - urlDisplay
      - events
      - teamEvents
      - enabled
      - hasSecret
      - secretHint
      - health
      - revision
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          enum:
          - team
          - platform
        team:
          allOf:
          - $ref: '#/components/schemas/TeamRef'
          nullable: true
        name:
          type: string
        format:
          $ref: '#/components/schemas/NotificationFormat'
        urlDisplay:
          type: string
          example: https://hooks.slack.com/...
          description: Scheme and host only; the rest of the URL is never shown
        events:
          type: array
          items:
            $ref: '#/components/schemas/NotificationEventType'
        teamEvents:
          type: boolean
          description: 'Platform destinations: also receive the non-personal events of every team. Always false for team destinations.'
        enabled:
          type: boolean
        disabledReason:
          type: string
          enum:
          - failures
          nullable: true
          description: 'failures: stopped automatically after 20 failed attempts in a row'
        hasSecret:
          type: boolean
        secretHint:
          type: string
          description: Last 4 characters of the signing secret, or empty
        secretRotatedAt:
          type: string
          format: date-time
          nullable: true
        previousSecretExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: While set and in the future, deliveries carry a signature for the previous secret too
        health:
          $ref: '#/components/schemas/NotificationDestinationHealth'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdByName:
          type: string
          nullable: true
    NotificationDestinationCreate:
      type: object
      required:
      - name
      - format
      - url
      - events
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        format:
          $ref: '#/components/schemas/NotificationFormat'
        url:
          type: string
          maxLength: 1000
          description: https, or http for a host in the internal-network allowlist. No user info or fragment; a query is allowed
            (it is sealed and never shown).
        events:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NotificationEventType'
        teamEvents:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true
    NotificationDestinationUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          maxLength: 1000
        events:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NotificationEventType'
        teamEvents:
          type: boolean
        enabled:
          type: boolean
    NotificationDestinationCreated:
      type: object
      required:
      - destination
      properties:
        destination:
          $ref: '#/components/schemas/NotificationDestination'
        secret:
          type: string
          nullable: true
          description: The signing secret (ompwhs_ and 43 characters), shown only now; null for slack
    NotificationSecretRotate:
      type: object
      properties:
        graceHours:
          type: integer
          format: int32
          minimum: 0
          maximum: 72
          default: 24
          description: 'How long the old secret keeps signing too (0: stop now)'
    NotificationDestinationSecret:
      type: object
      required:
      - destination
      - secret
      properties:
        destination:
          $ref: '#/components/schemas/NotificationDestination'
        secret:
          type: string
          description: The new signing secret, shown only now
    NotificationTestResult:
      type: object
      required:
      - ok
      - durationMs
      - message
      properties:
        ok:
          type: boolean
        errorClass:
          allOf:
          - $ref: '#/components/schemas/NotificationErrorClass'
          nullable: true
        httpStatus:
          type: integer
          format: int32
          nullable: true
        durationMs:
          type: integer
          format: int32
        message:
          type: string
          maxLength: 200
          description: A short explanation safe to show; never the destination's response body
    NotificationDelivery:
      type: object
      required:
      - id
      - eventId
      - event
      - state
      - attempts
      - createdAt
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: string
          format: uuid
          description: The id of the event, as in the payload and X-OMP-Event-Id
        event:
          $ref: '#/components/schemas/NotificationEventType'
        state:
          type: string
          enum:
          - pending
          - sent
          - failed
          - skipped
          description: 'skipped: the destination was off or deleted, or the event no longer matched'
        attempts:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        httpStatus:
          type: integer
          format: int32
          nullable: true
        errorClass:
          allOf:
          - $ref: '#/components/schemas/NotificationErrorClass'
          nullable: true
    NotificationEmailStatus:
      type: object
      required:
      - configured
      - authenticated
      - sentLast24h
      - failedLast24h
      properties:
        configured:
          type: boolean
          description: SMTP_HOST is set
        from:
          type: string
          nullable: true
        host:
          type: string
          nullable: true
        port:
          type: integer
          format: int32
          nullable: true
        tls:
          type: string
          enum:
          - starttls
          - tls
          - none
          nullable: true
        authenticated:
          type: boolean
          description: SMTP_USERNAME is set (the username and password are never shown)
        sentLast24h:
          type: integer
          format: int64
        failedLast24h:
          type: integer
          format: int64
    NotificationSettings:
      type: object
      required:
      - email
      - webhooks
      - queue
      properties:
        email:
          $ref: '#/components/schemas/NotificationEmailStatus'
        webhooks:
          type: object
          required:
          - teamDestinations
          - platformDestinations
          - stopped
          properties:
            teamDestinations:
              type: integer
              format: int64
            platformDestinations:
              type: integer
              format: int64
            stopped:
              type: integer
              format: int64
              description: Destinations stopped automatically after repeated failures
        queue:
          type: object
          required:
          - pending
          - failedLast24h
          - intervalSeconds
          properties:
            pending:
              type: integer
              format: int64
            failedLast24h:
              type: integer
              format: int64
            oldestPendingAt:
              type: string
              format: date-time
              nullable: true
            lastRunAt:
              type: string
              format: date-time
              nullable: true
            intervalSeconds:
              type: integer
              format: int32
    NotificationServerRef:
      type: object
      required:
      - id
      - slug
      - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      description: The server an event is about
    ServerUnhealthyData:
      type: object
      required:
      - server
      - since
      - consecutiveFailures
      - reminder
      properties:
        server:
          $ref: '#/components/schemas/NotificationServerRef'
        since:
          type: string
          format: date-time
          description: When the failing status began
        consecutiveFailures:
          type: integer
          format: int32
        errorClass:
          type: string
          description: McpErrorClass of the latest check
        httpStatus:
          type: integer
          format: int32
          nullable: true
        reminder:
          type: boolean
          description: true for the daily reminders
        failingHours:
          type: integer
          format: int32
          description: Whole hours since, on reminders
    ServerRecoveredData:
      type: object
      required:
      - server
      - since
      - recoveredAt
      - downtimeSeconds
      properties:
        server:
          $ref: '#/components/schemas/NotificationServerRef'
        since:
          type: string
          format: date-time
        recoveredAt:
          type: string
          format: date-time
        downtimeSeconds:
          type: integer
          format: int64
    CapabilityChangedData:
      type: object
      required:
      - server
      - changedCount
      - newCount
      - held
      - capabilities
      - moreCount
      properties:
        server:
          $ref: '#/components/schemas/NotificationServerRef'
        changedCount:
          type: integer
          format: int32
        newCount:
          type: integer
          format: int32
        held:
          type: boolean
          description: 'Always true: held back from the catalog until approved'
        capabilities:
          type: array
          maxItems: 10
          items:
            type: object
            required:
            - kind
            - name
            - change
            properties:
              kind:
                type: string
                enum:
                - tool
                - resource
                - resource_template
                - prompt
              name:
                type: string
                maxLength: 100
              change:
                type: string
                enum:
                - changed
                - new
        moreCount:
          type: integer
          format: int32
    PublishRequestedData:
      type: object
      required:
      - server
      - reason
      - requestedBy
      properties:
        server:
          $ref: '#/components/schemas/NotificationServerRef'
        reason:
          type: string
          enum:
          - new
          - url_changed
          - upstream_auth_changed
          - upstream_tls_changed
          - requirement_changed
          - classification_changed
        note:
          type: string
          maxLength: 300
        requestedBy:
          type: object
          required:
          - kind
          - name
          properties:
            kind:
              type: string
              enum:
              - user
              - automation_token
            name:
              type: string
    PublishDecidedData:
      type: object
      required:
      - server
      - decision
      - decidedBy
      properties:
        server:
          $ref: '#/components/schemas/NotificationServerRef'
        decision:
          type: string
          enum:
          - approved
          - rejected
        note:
          type: string
          maxLength: 300
        decidedBy:
          type: object
          required:
          - name
          properties:
            name:
              type: string
    ConnectionNeedsReconsentData:
      type: object
      required:
      - provider
      - reason
      properties:
        provider:
          type: object
          required:
          - slug
          - name
          properties:
            slug:
              type: string
            name:
              type: string
        server:
          allOf:
          - $ref: '#/components/schemas/NotificationServerRef'
          nullable: true
        reason:
          type: string
          enum:
          - refresh_failed
          - upstream_rejected
    UpstreamSigninLapsedData:
      type: object
      required:
      - server
      - since
      properties:
        server:
          $ref: '#/components/schemas/NotificationServerRef'
        since:
          type: string
          format: date-time
        readAsName:
          type: string
          description: The person whose sign-in capabilities were read as
    KeyExpiringData:
      type: object
      required:
      - keyKind
      - name
      - expiresAt
      - daysLeft
      properties:
        keyKind:
          type: string
          enum:
          - personal
          - service_account
          - publisher_token
          - platform_token
          - server_certificate
        name:
          type: string
          description: The key's or token's name (never its prefix or secret); for server_certificate the server's name
        expiresAt:
          type: string
          format: date-time
        daysLeft:
          type: integer
          format: int32
        serviceAccount:
          allOf:
          - type: object
            required:
            - id
            - name
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
          nullable: true
        server:
          allOf:
          - $ref: '#/components/schemas/NotificationServerRef'
          nullable: true
          description: The server, for server_certificate (its mTLS client certificate expires within 14 days; the
            team's owners, admins and editors are told)
    NotificationTestData:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    NotificationPayload:
      type: object
      description: 'The body of a json webhook, at most 8 KiB. Signed: X-OMP-Signature is v1=<hex HMAC-SHA256 of timestamp +
        "." + body>, with the timestamp in X-OMP-Timestamp (Unix seconds); during a secret rotation the header carries two v1=
        values. Never contains secrets, header values, call arguments or results, or e-mail addresses.'
      required:
      - id
      - type
      - version
      - occurredAt
      - instance
      - team
      - url
      - data
      properties:
        id:
          type: string
          format: uuid
          description: The event's id; also the X-OMP-Event-Id header. Receivers de-duplicate on it (delivery is at least once).
        type:
          type: string
          enum:
          - server.unhealthy
          - server.recovered
          - capability.changed
          - publish.requested
          - publish.decided
          - connection.needs_reconsent
          - upstream_signin.lapsed
          - key.expiring
          - test
        version:
          type: integer
          enum:
          - 1
        occurredAt:
          type: string
          format: date-time
        instance:
          type: object
          required:
          - name
          - url
          properties:
            name:
              type: string
            url:
              type: string
              description: APP_URL
        team:
          allOf:
          - $ref: '#/components/schemas/TeamRef'
          nullable: true
        url:
          type: string
          description: A link to the item in the web app (never contains a secret)
        data:
          oneOf:
          - $ref: '#/components/schemas/ServerUnhealthyData'
          - $ref: '#/components/schemas/ServerRecoveredData'
          - $ref: '#/components/schemas/CapabilityChangedData'
          - $ref: '#/components/schemas/PublishRequestedData'
          - $ref: '#/components/schemas/PublishDecidedData'
          - $ref: '#/components/schemas/ConnectionNeedsReconsentData'
          - $ref: '#/components/schemas/UpstreamSigninLapsedData'
          - $ref: '#/components/schemas/KeyExpiringData'
          - $ref: '#/components/schemas/NotificationTestData'
          description: The shape follows type
    AutomationTokenKind:
      type: string
      enum:
      - platform_admin
      - team_publisher
    AutomationTokenScope:
      type: string
      enum:
      - platform:read
      - platform:write
      - servers:read
      - servers:write
      description: 'platform:read: the platform-admin API''s read operations. platform:write: its provisioning operations (never
        token management, roles, reviews or settings that widen trust). servers:read and servers:write: a team''s MCP servers
        (write never deletes, approves capabilities or changes gateways or members). A write scope includes its read scope.
        docs/automation-tokens.md lists the operations.'
    AutomationToken:
      type: object
      description: An automation token's metadata. The secret is never returned after creation.
      required:
      - id
      - kind
      - name
      - prefix
      - scopes
      - status
      - team
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/AutomationTokenKind'
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the token, to recognise it (ompadm_xxxxxxxx, omppub_xxxxxxxx)
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/AutomationTokenScope'
        status:
          type: string
          enum:
          - active
          - expired
          - revoked
        team:
          allOf:
          - $ref: '#/components/schemas/TeamRef'
          nullable: true
          description: The owning team of a publisher token; null for platform tokens
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
          nullable: true
          description: Who made it, as recorded then (null for the system)
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Updated at most once a minute
        revokedAt:
          type: string
          format: date-time
          nullable: true
        blockedReason:
          type: string
          enum:
          - creator_not_platform_admin
          nullable: true
          description: A platform token is refused while its creator isn't an active platform admin
    AutomationTokenCreate:
      type: object
      required:
      - name
      - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: CI publisher
        scopes:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AutomationTokenScope'
          description: Only the scopes of the token's kind (platform:* for platform tokens, servers:* for team tokens); 400
            invalid_scopes otherwise
        expiresInDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          default: 90
          description: Tokens always expire
    AutomationTokenCreated:
      type: object
      required:
      - token
      - secret
      properties:
        token:
          $ref: '#/components/schemas/AutomationToken'
        secret:
          type: string
          description: 'The full token, shown only now. Send it as Authorization: Bearer to /v1/*. Never to /mcp.'
    McpServerProtocol:
      type: object
      description: The MCP protocol version the portal last negotiated with the upstream server (docs/roadmap.md, v0.2 A)
      required:
      - era
      - version
      - negotiatedAt
      properties:
        era:
          type: string
          enum:
          - legacy
          - modern
          description: 'legacy: 2025-11-25 and earlier (initialize). modern: 2026-07-28 and later (stateless).'
        version:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: '2025-11-25'
        negotiatedAt:
          type: string
          format: date-time
