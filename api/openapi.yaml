      description: 'Answers when the team owns the call''s gateway and the gateway''s capture switch captured it, or
        owns the call''s server and the server''s switch captured it, and the caller is one of the team''s owners or
        admins. Platform roles don''t count here; platform staff use adminGetCallPayload. 404 call_not_found (not a
