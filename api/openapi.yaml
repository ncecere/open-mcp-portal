  /v1/connect/requests/{requestId}/confirm:
    parameters:
    - $ref: '#/components/parameters/ConnectRequestIdParam'
    post:
      tags:
      - connections
      operationId: confirmConnectRequest
      summary: Allow the server a consent link was made for to use the person's connected account, without going to the provider
      description: 'Browser session only (403 session_required with an API key). For a link whose reason is
        server_not_allowed: the person is connected, the account''s scopes already cover the link, and only the
        server''s consent is missing. Records the grant for the server and address the link was made for (audited as
        provider_connection.server_allow) and uses the link up; nothing is sent to the provider. A link can allow only
        the server it names. 409 connect_required (not connected, needs reconnecting, or the account lacks the link''s
        scopes: continue to the provider with startMyConnection); 409 not_platform_provider (an MCP server''s own
        sign-in has nothing to allow); 404 connect_request_not_found (unknown, or another person''s); 410
        connect_request_expired (expired or used, or made before the grants existed); 410
        connect_request_server_changed (the server''s address or required account changed since the link was made);
        404 provider_not_found (turned off); 422 provider_not_allowed (the provider is restricted and its access list
        excludes the server).'
      responses:
        '200':
          description: The server is allowed
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ConnectConfirmed'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '410':
          $ref: '#/components/responses/ErrorReply'
  /v1/connect/requests/{requestId}:
