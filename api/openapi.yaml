      - connections
      operationId: revokeAllowedServer
      summary: Take back the allowance of one server; the connection stays
      description: 'Browser session only (403 session_required with an API key). Deletes the grant of one server (ProviderConnection.
        allowedServers); the account stays connected, and the next call of that server asks to allow it again.
        Audited as provider_connection.server_revoke. 404 connection_not_found (unknown, or another person''s); 404
