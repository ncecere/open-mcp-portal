      tags:
      - admin
      - agent-platforms
      - service-accounts
      operationId: adminClearServiceAccountRelay
      summary: Stop a service account relaying for the platform (platform admins; browser session only)
      description: 404 relay_not_found unless the account relays for this platform. Its keys keep working as an
        ordinary service account's; a token sent with them is ignored (and counted). Audited as
        service_account.relay_clear.
