          description: The capability with its new override
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/McpCapability'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/mcp-servers/{serverId}/capabilities/{capabilityId}/present-person:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    - $ref: '#/components/parameters/ServerIdParam'
    - $ref: '#/components/parameters/CapabilityIdParam'
    put:
      tags:
      - mcp-servers
      - agent-platforms
      operationId: setTeamMcpCapabilityPresentPerson
      summary: Require, or stop requiring, a present person for one capability's calls from agents (editors and above)
      description: 'inherit: follow the server''s McpServer.requiresPresentPerson. required: a call on a relay service account
        is refused with a tool error, recorded as denied with error class person_not_present, unless its token
        names a person the platform says is present (so also when the token says the person is not present, names
        nobody, or there is no token). not_required: allowed even when the server requires it. Calls that don''t
        arrive on a relay service account are never affected. If-Match is the server''s revision,
        which this bumps (ETag). Requiring never needs review; relaxing a requirement (a capability that required a
        present person no longer does) sends a published server back to pending under approval_required (audited
        mcp_server.publish_request, reason requirement_changed). Audited as mcp_capability.presence_set. 400
        invalid_mode; 409 team_archived.'
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityPresentPersonOverride'
      responses:
        '200':
          description: The capability with its new override
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
