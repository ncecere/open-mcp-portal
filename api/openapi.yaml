      x-omp-token-scopes:
      - platform:read
      summary: Platform-admin tokens, including revoked and expired ones from the last 30 days (platform admins and auditors)
      description: Newest first. Never the secret. blockedReason creator_not_platform_admin marks a token that is refused
        because the person who made it is no longer an active platform admin.
