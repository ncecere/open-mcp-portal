    get:
      tags:
      - me
      - connections
      operationId: listAllowableServers
      summary: The servers the caller may allow to use this connected account (they require the account's provider)
      description: 'Browser session only (403 session_required with an API key). Servers that require this connection''s
        provider and that the caller may use through a gateway now: their teams'' servers on gateways they can use and
        published servers with approved capabilities on gateways they have access to, the same rule a call is judged by
        (a server nobody can reach through a gateway is not listed, and neither is another team''s private server, nor
        one a restricted provider''s access list excludes).
        Each carries the address it has now and the scopes its capabilities ask of the account; covered says the
        connection is active and already has them (otherwise allowing needs a round trip to the provider:
        startMyConnection with those scopes), and allowed that the server is already allowed at this address for those
        scopes. 404 connection_not_found (unknown, or another person''s); 404 provider_not_found (turned off); 409
        not_platform_provider (an MCP server''s own sign-in has nothing to allow).'
      responses:
        '200':
          description: Servers by name
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AllowableServer'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
  /v1/me/connections/{connectionId}/allow-server:
    parameters:
    - $ref: '#/components/parameters/ConnectionIdParam'
    post:
      tags:
      - me
      - connections
      operationId: allowConnectionServer
      summary: Allow a server to use the connected account, without a consent link
      description: 'Browser session only (403 session_required with an API key; automation tokens and service accounts
        are refused). Records the same grant as confirmConnectRequest (audited as provider_connection.server_allow,
        viaRequest false) for the server''s address now and the scopes its capabilities require; nothing is sent to the
        provider. The request names the address and scopes the person was shown (listAllowableServers). 404
        connection_not_found (unknown, or another person''s); 404 server_not_found (no such server, or one the caller
        may not use through a gateway); 422 server_does_not_require_provider; 422 provider_not_allowed (the provider is
        restricted and its access list excludes the server: nobody can allow it); 409 connect_required (not connected, needs
        reconnecting, or the account lacks the server''s scopes: details.scopes names them, continue to the provider
        with startMyConnection); 409 server_changed (the address differs from the one shown, or the server asks for
        scopes that weren''t shown: reload); 409 not_platform_provider; 404 provider_not_found (turned off); 400
        invalid_allow (no address). 429 slow_down (20 a minute per person, shared with revokeAllowedServer).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllowServerRequest'
