      operationId: adminRevokeAutomationToken
      summary: Revoke a platform-admin token (platform admins, browser session only); takes effect on the next request
      description: 'Revoking a revoked or expired token is a no-op. 404 token_not_found for a team token or an unknown ID.
        Tokens authenticate with Authorization: Bearer on /v1/* only (never /mcp) and are managed here in a browser session
        only: a token that calls this operation gets 403 session_required.'
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/automation-tokens:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - automation-tokens
      operationId: listTeamAutomationTokens
      summary: The team's publisher tokens, including revoked and expired ones from the last 30 days (team owners and admins;
        platform staff read any team)
      description: Newest first. Never the secret. Members and editors get 403.
      responses:
        '200':
