      description: Each listed key is replaced (value null inherits the platform default); keys not listed are kept.
        Only service_account_per_minute and gateway_per_minute can be overridden. 422 invalid_limit with details.key
        and details.reason (not_overridable, above_ceiling, duplicate). Audited as team.limits_update.
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
