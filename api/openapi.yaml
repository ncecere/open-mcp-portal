      operationId: revokeMyServerSecret
      summary: Remove the caller's key for a server
      description: 'Browser session only (403 session_required). Deletes the key; the next call of that server asks for
        one again. Allowed whether or not the caller can still use the server. Audited as person_secret.revoke. 404
        person_secret_not_found. 429 slow_down.'
