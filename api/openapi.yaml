  /v1/teams/{team}/mcp-servers/{serverId}/capabilities/{capabilityId}/requirement:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    - $ref: '#/components/parameters/ServerIdParam'
    - $ref: '#/components/parameters/CapabilityIdParam'
    put:
      tags:
      - mcp-servers
      - auth-providers
      operationId: setTeamMcpCapabilityRequirement
      summary: Override the server's user-authorization requirement for one capability (editors and above)
      description: 'inherit: the server''s requirement applies. none: calls to this capability get no provider token
        and never ask for consent. scopes: the server''s provider with these scopes instead. The token always goes to
        the server, so overrides limit what is asked for and sent, not which code of the server sees it. If-Match is
        the server''s revision, which this bumps (ETag). 400 invalid_mode (scopes sent with inherit or none, or missing
        with scopes); 400 invalid_scope (details.scope); 409 no_server_requirement (mode scopes on a server without
        a requirement); 409 team_archived. Under approval_required a published server goes back to pending when the
        override widens what the capability receives (audited mcp_server.publish_request, reason requirement_changed).
        Audited as mcp_capability.requirement_set. 409 upstream_oauth on a server in oauth mode, where every call
        carries the person''s own token for the server and scopes come from the server (McpServer.oauth.scopes and
        its insufficient_scope challenges).'
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityRequirementOverride'
      responses:
