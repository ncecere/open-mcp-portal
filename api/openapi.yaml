          format: uuid
        subjectKind:
          $ref: '#/components/schemas/GatewayGrantSubjectKind'
        team:
          $ref: '#/components/schemas/GrantTeam'
        user:
          $ref: '#/components/schemas/MemberUser'
        group:
          type: string
          description: The IdP group name, as in the groups claim
        createdAt:
          type: string
          format: date-time
        addedByName:
          type: string
          nullable: true
    GrantTeam:
