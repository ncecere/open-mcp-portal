          $ref: '#/components/schemas/CatalogServer'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCapability'
    GatewayOwnerKind:
      type: string
      enum:
      - team
      - platform
    GatewayCapabilityKind:
      type: string
      enum:
      - tool
      - prompt
      - resource
      - resource_template
      description: Clients see tools and prompts as {serverSlug}__{name}, resources as omp://{serverSlug}/{uri}
        and resource templates as omp://{serverSlug}/{uriTemplate}
    Gateway:
      type: object
      required:
      - id
      - slug
      - name
      - description
      - ownerKind
      - enabled
      - url
      - capabilityCount
      - unavailableCount
      - grantCount
      - revision
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Immutable; the gateway's endpoint is /mcp/{slug}
          example: support-tools
        name:
          type: string
          example: Support tools
        description:
          type: string
        ownerKind:
          $ref: '#/components/schemas/GatewayOwnerKind'
        teamId:
          type: string
          format: uuid
          description: Team gateways only
        teamSlug:
          type: string
        teamName:
          type: string
        enabled:
          type: boolean
          description: Turned off, the endpoint answers 404 to everyone. A team gateway of an archived team also
            answers 404, and its capabilities are unavailable (team_archived), until the team is unarchived
        url:
          type: string
          description: The full MCP endpoint, APP_URL + /mcp/{slug}
          example: https://mcp.example.com/mcp/support-tools
        capabilityCount:
          type: integer
          format: int64
          description: Selected capabilities
        unavailableCount:
          type: integer
          format: int64
          description: Selected capabilities not served right now (see GatewayCapability.unavailableReason)
        grantCount:
          type: integer
          format: int64
          description: Platform gateways' grants (0 for team gateways)
        capturePayloads:
          type: boolean
          description: Record the arguments and results of calls through this gateway (redacted, truncated to 16 KiB per
            part; readable by a team gateway's team owners and admins and by platform staff). Calls are also captured
            when their server records them. Absent from servers before Phase 6.
        rateLimitPerMinute:
          type: integer
          format: int64
          nullable: true
          description: 'The gateway''s own limit on requests per minute from all callers together (null: inherit the
            team override or platform default). Absent from servers before Phase 6.'
        effectiveRateLimitPerMinute:
          type: integer
          format: int64
          nullable: true
          description: 'The limit that applies now: rateLimitPerMinute, else (team gateways) the team''s override, else
            the platform default, capped at the ceiling (null: unlimited). Absent from servers before Phase 6.'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GatewayPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Gateway'
        nextCursor:
          type: string
          nullable: true
    GatewayCreate:
      type: object
      required:
      - slug
      - name
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,46}[a-z0-9])?$
          description: Unique across the platform, immutable
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        enabled:
          type: boolean
          default: true
        capturePayloads:
          type: boolean
          default: false
        rateLimitPerMinute:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          nullable: true
          description: 'Absent or null: inherit. 422 invalid_limit (details.reason above_ceiling) above the ceiling of
            gateway_per_minute.'
    GatewayUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        enabled:
          type: boolean
        capturePayloads:
          type: boolean
          description: Omit to keep. Platform admins can't change it on team gateways (403 team_gateway). Audited in
            gateway.update.
        rateLimitPerMinute:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          nullable: true
          description: 'Omit to keep; null inherits. 422 invalid_limit (details.reason above_ceiling) above the ceiling.
            Platform admins can''t change it on team gateways (403 team_gateway).'
    GatewayUnavailableReason:
      type: string
      enum:
      - server_disabled
      - not_published
      - not_approved
      - changed
      - gone
      - team_archived
      description: 'server_disabled: its server is off. not_published: a catalog server left the catalog. not_approved
        / changed: the current definition isn''t approved. gone: the server no longer lists it. team_archived: the
        team that owns its server, or the team gateway''s own team, is archived (unarchiving restores it).'
    GatewayCapability:
      type: object
      required:
      - capabilityId
      - serverId
      - serverSlug
      - serverName
      - teamSlug
      - kind
      - name
      - exposedName
      - title
      - description
      - available
      - requires
      properties:
        toolClass:
          allOf:
          - $ref: '#/components/schemas/ToolClass'
          nullable: true
        requires:
          allOf:
          - $ref: '#/components/schemas/CapabilityRequirement'
          nullable: true
          description: The account a person must connect to use it (null; none). Service accounts can't call
            capabilities that require one. In MyGatewayDetail, connected says whether the caller's connection covers
            it now
        capabilityId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        serverSlug:
          type: string
        serverName:
          type: string
        teamSlug:
          type: string
          description: The server's team
        kind:
          $ref: '#/components/schemas/GatewayCapabilityKind'
        name:
          type: string
          description: The name the server uses
        exposedName:
          type: string
          description: 'What clients see: {serverSlug}__{name} for tools and prompts, omp://{serverSlug}/{uri}
            for resources and resource templates'
          example: service-status__check_outage
        title:
          type: string
        description:
          type: string
        minRole:
          allOf:
          - $ref: '#/components/schemas/TeamRole'
          nullable: true
          description: Team gateways only; the lowest team role that may use it (null = every member)
        available:
          type: boolean
        unavailableReason:
          $ref: '#/components/schemas/GatewayUnavailableReason'
        serverCapturesPayloads:
          type: boolean
          description: The capability's server records call arguments and results, whatever the gateway's setting.
            Absent from servers before Phase 6.
    GatewayCapabilities:
      type: object
      required:
      - revision
      - items
      properties:
        revision:
          allOf:
          - $ref: '#/components/schemas/Revision'
          description: The gateway's revision
        items:
          type: array
          items:
            $ref: '#/components/schemas/GatewayCapability'
    GatewayCapabilitySelection:
      type: object
      required:
      - capabilityId
      properties:
        capabilityId:
          type: string
          format: uuid
        minRole:
          $ref: '#/components/schemas/TeamRole'
    GatewayCapabilitiesUpdate:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/GatewayCapabilitySelection'
    GatewayOption:
      type: object
      required:
      - capabilityId
      - serverId
      - serverSlug
      - serverName
      - teamSlug
      - teamName
      - source
      - kind
      - name
      - exposedName
      - title
      - description
      - requires
      properties:
        requires:
          allOf:
          - $ref: '#/components/schemas/CapabilityRequirement'
          nullable: true
          description: The account a person must connect to use it (null; none)
        capabilityId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        serverSlug:
          type: string
        serverName:
          type: string
        teamSlug:
          type: string
        teamName:
          type: string
        toolClass:
          allOf:
          - $ref: '#/components/schemas/ToolClass'
          nullable: true
        source:
          type: string
          enum:
          - team
          - catalog
          description: 'team: the gateway team''s own server; catalog: a published server'
        kind:
          $ref: '#/components/schemas/GatewayCapabilityKind'
        name:
          type: string
          description: The name the server uses (a resource's URI, a template's URI template)
        exposedName:
          type: string
          description: 'What clients see: {serverSlug}__{name}, or omp://{serverSlug}/{uri} for resources and templates'
        title:
          type: string
        description:
          type: string
        serverCapturesPayloads:
          type: boolean
          description: The server records call arguments and results. Absent from servers before Phase 6.
    GatewayOptionPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GatewayOption'
        nextCursor:
          type: string
          nullable: true
    GatewayGrantSubjectKind:
      type: string
      enum:
      - team
      - user
      - group
    ToolScope:
