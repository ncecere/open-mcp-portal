    delete:
      tags:
      - me
      - connections
      operationId: revokeMyConnection
      summary: Disconnect one of the caller's accounts; its tokens are erased at once
      description: Where the provider has a revocation endpoint the portal also revokes the tokens there (best effort,
        recorded as providerRevoked in the audit metadata). Calls that need the provider ask for consent again.
        Audited as provider_connection.revoke (reason user). The connection's allowed servers (ProviderConnection.
        allowedServers) go with it, so reconnecting asks again for each server.
      responses:
