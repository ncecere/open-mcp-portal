          description: The server's team records call arguments and results (McpServer.capturePayloads). Absent from
            servers before Phase 6.
        authMode:
          allOf:
          - $ref: '#/components/schemas/McpServerAuthMode'
          description: oauth means each person signs in to the server's own service before calling it. Absent from
            servers before Phase 7
    CatalogServerPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogServer'
        nextCursor:
          type: string
          nullable: true
    CatalogCapability:
      type: object
      required:
      - id
      - kind
      - name
      - title
      - description
      - definition
      - requires
      properties:
        requires:
          allOf:
          - $ref: '#/components/schemas/CapabilityRequirement'
          nullable: true
          description: The account a person must connect to use it (null; none)
        toolClass:
          allOf:
          - $ref: '#/components/schemas/ToolClass'
          nullable: true
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/CapabilityKind'
        name:
          type: string
        title:
          type: string
        description:
          type: string
        definition:
          type: object
          additionalProperties: true
    CatalogServerDetail:
