      - service-accounts
      operationId: adminSetServiceAccountRelay
      summary: Mark a team service account as a relay for the platform (platform admins; browser session only)
      description: Only a relay account's calls may carry the platform's identity token; the person it names is
        authorised as that person limited to what the account itself could reach (docs/agent-platforms.md). Only
        platform admins can mark an account; a team's owners and admins can't. Moves the account from another
        platform it relayed for. 409 platform_disabled (turn the platform on first) or team_archived. Bumps the
        account's revision. Audited as service_account.relay_set.
      responses:
        '200':
          description: The relay account
          content:
            application/json:
              schema:
                type: object
                required:
