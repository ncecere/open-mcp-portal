openapi: 3.0.3
info:
  title: Open MCP Portal API
  version: 0.3.3
  description: 'Management API. Browser sessions authenticate with a cookie; writes need the session''s `X-CSRF-Token`
    (from `GET /v1/me`) and a same-origin `Origin`. Success responses are `{"data": ...}` and errors `{"error":
    {"code": "...", "message": "..."}}`.


    Every route served by the application must be listed here; a test enforces it. MCP endpoints (`/mcp/{slug}`),
    OAuth protocol endpoints and `/.well-known/*` are documented in docs/.

    Automation tokens (docs/automation-tokens.md): `Authorization: Bearer ompadm_...` (platform-admin token) or
    `omppub_...` (team publisher token) authenticates `/v1/*` only, with no cookie, CSRF token or Origin; MCP
    credentials (`omp_`, `omp_sa_`, `ompat_`) never authorize `/v1` and automation tokens never authorize `/mcp`.
    An operation accepts tokens only when it has the extension `x-omp-token-scopes` (a list; a token needs at
    least one of the listed scopes, and a `:write` scope includes its `:read`). Every other operation answers a
    token with `403 token_not_allowed`; creating and revoking tokens answers `403 session_required`. A missing,
    unknown, expired or revoked token, or an MCP credential, is `401 invalid_token`. A team token reaches only
    its own team: another team is `404`, like a non-member. A test enforces that exactly the annotated operations
    accept tokens.

    '
tags:
- name: operations
- name: auth
- name: me
- name: teams
- name: admin
- name: mcp-servers
  description: Team-owned MCP servers, discovery, health and publishing to the company catalog
- name: catalog
  description: Published MCP servers any signed-in person can browse
- name: gateways
  description: Curated sets of MCP capabilities served at /mcp/{slug}, their access and their call records
- name: api-keys
  description: Personal API keys for MCP clients and scripts
- name: oauth
  description: OAuth sign-in for MCP clients (docs/phase4-client-auth.md) — the consent page, connected apps and
    trusted clients. The protocol endpoints (/oauth/*, /.well-known/oauth-*) are outside this contract, like /mcp.
- name: service-accounts
  description: Team-owned identities for headless agents, CI and scripts
- name: auth-providers
  description: OAuth apps of third-party services (GitHub, Google, ...) that platform admins configure so tools can
    act with a person's own account (docs/phase5-delegated-credentials.md)
- name: connections
  description: A person's connected third-party accounts (tokens the portal holds for them) and the consent links
    that create them. The browser routes /connect/{provider} (web app) and /connect/callback are outside this
    contract, like /oauth/*.
- name: limits
  description: Rate limits on /mcp/{slug} (docs/phase6-operations.md); platform settings and team overrides are under
    admin
- name: retention
  description: How long call records, captured payloads, the audit log and usage rollups are kept
- name: usage
  description: Hourly usage rollups of calls through gateways
- name: notifications
  description: In-app inbox, preferences, webhook destinations and email status (docs/notifications.md)
- name: automation-tokens
  description: Tokens for CI and scripts that call /v1 (docs/automation-tokens.md); never valid for /mcp
- name: agent-platforms
  description: External agent platforms the portal trusts to name the person behind a relayed agent call, and the
    service accounts that relay for them (docs/agent-platforms.md). Session-only; automation tokens never change or read them
paths:
  /healthz:
    get:
      tags:
      - operations
      operationId: getHealthz
      summary: Liveness probe
      responses:
        '200':
          $ref: '#/components/responses/HealthReply'
  /readyz:
    get:
      tags:
      - operations
      operationId: getReadyz
      summary: Readiness probe (dependencies reachable and not draining)
      responses:
        '200':
          $ref: '#/components/responses/HealthReply'
        '503':
          $ref: '#/components/responses/HealthReply'
  /auth/login:
    get:
      tags:
      - auth
      operationId: startLogin
      summary: Start single sign-on (redirects to the identity provider)
      parameters:
      - name: next
        in: query
        required: false
        description: Same-origin path to return to after sign-in.
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the identity provider
        '404':
          $ref: '#/components/responses/ErrorReply'
        '429':
          $ref: '#/components/responses/ErrorReply'
        '503':
          $ref: '#/components/responses/ErrorReply'
  /auth/callback:
    get:
      tags:
      - auth
      operationId: completeLogin
      summary: OIDC redirect target
      responses:
        '303':
          description: Signed in; redirect into the app
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
  /auth/dev:
    post:
      tags:
      - auth
      operationId: devLogin
      summary: Development sign-in (only when DEV_AUTH=true on a loopback APP_URL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      summary: End the current browser session
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
  /v1/auth/config:
    get:
      tags:
      - auth
      operationId: getAuthConfig
      summary: Sign-in methods and instance identity for the web UI
      responses:
        '200':
          description: Sign-in configuration
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthConfig'
  /v1/me:
    get:
      tags:
      - me
      operationId: getMe
      summary: The signed-in user, CSRF token and capabilities
      parameters:
      - name: optional
        in: query
        required: false
        description: With true, a request without a session cookie gets data null (200) instead of a 401, for pages
          that work signed out. An expired session is still a 401 (and clears the cookie).
        schema:
          type: boolean
      responses:
        '200':
          description: Current user (null only with optional=true and no session cookie)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    nullable: true
                    allOf:
                    - $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams:
    get:
      tags:
      - teams
      operationId: listMyTeams
      summary: Teams the caller belongs to
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyTeam'
        '401':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - teams
      operationId: getTeam
      summary: A team the caller belongs to (platform admins and auditors see any team)
      responses:
        '200':
          description: Team
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TeamView'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/members:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - teams
      operationId: listMembers
      summary: Team members
      responses:
        '200':
          description: Members, owners first
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '404':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - teams
      operationId: addMember
      summary: Add a member by email, or invite them if they have never signed in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAdd'
      responses:
        '201':
          description: Added or invited
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MemberAddResult'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/members/{userId}:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    - $ref: '#/components/parameters/UserIdParam'
    patch:
      tags:
      - teams
      operationId: updateMember
      summary: Change a member's role
      description: 409 last_owner for the team's only owner.
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
      responses:
        '200':
          description: Updated member
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
    delete:
      tags:
      - teams
      operationId: removeMember
      summary: Remove a member, or leave the team (your own user ID)
      description: 409 last_owner for the team's only owner.
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/invites:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - teams
      operationId: listInvites
      summary: Open email invites
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/invites/{inviteId}:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    - name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      tags:
      - teams
      operationId: revokeInvite
      summary: Revoke an open invite
      description: Team owners and admins (within their role's reach), and platform admins for any open invite,
        such as an owner invite sent from Admin -> Teams.
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/audit:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - teams
      operationId: listTeamAudit
      summary: The team's audit log (owners, admins and editors)
      parameters:
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/AuditActionParam'
      - $ref: '#/components/parameters/AuditExcludeActionParam'
      - $ref: '#/components/parameters/AuditActorParam'
      - $ref: '#/components/parameters/AuditActorKindParam'
      - $ref: '#/components/parameters/AuditTargetTypeParam'
      - $ref: '#/components/parameters/AuditFromParam'
      - $ref: '#/components/parameters/AuditToParam'
      responses:
        '200':
          $ref: '#/components/responses/AuditPageReply'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/audit/{entryId}:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    - name: entryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - teams
      operationId: getTeamAuditEntry
      summary: One entry of the team's audit log, for a linked entry (owners, admins and editors)
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuditEntry'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/users:
    get:
      tags:
      - admin
      operationId: adminListUsers
      x-omp-token-scopes:
      - platform:read
      summary: All users (platform admins and auditors), with how many teams each belongs to
      parameters:
      - $ref: '#/components/parameters/SearchParam'
      - name: role
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/PlatformRole'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UserStatus'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of users ordered by email
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserPage'
        '403':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/users/{userId}:
    parameters:
    - $ref: '#/components/parameters/UserIdParam'
    get:
      tags:
      - admin
      operationId: adminGetUser
      x-omp-token-scopes:
      - platform:read
      summary: A user and their team memberships
      responses:
        '200':
          description: User
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserDetail'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    patch:
      tags:
      - admin
      operationId: adminUpdateUser
      summary: Change a user's platform role or suspend/reactivate them
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated user
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/teams:
    get:
      tags:
      - admin
      operationId: adminListTeams
      x-omp-token-scopes:
      - platform:read
      summary: All teams (platform admins and auditors)
      parameters:
      - $ref: '#/components/parameters/SearchParam'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TeamStatus'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of teams ordered by slug
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TeamPage'
        '403':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - admin
      operationId: adminCreateTeam
      x-omp-token-scopes:
      - platform:write
      summary: Create a team and assign its first owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TeamCreated'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/teams/{team}:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - admin
      operationId: adminGetTeam
      x-omp-token-scopes:
      - platform:read
      summary: A team with membership counts
      responses:
        '200':
          description: Team
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TeamSummary'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    patch:
      tags:
      - admin
      operationId: adminUpdateTeam
      x-omp-token-scopes:
      - platform:write
      summary: Change team details, or archive/unarchive it
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdate'
      responses:
        '200':
          description: Updated team
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TeamSummary'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/teams/{team}/owners:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    post:
      tags:
      - admin
      operationId: adminAssignOwner
      summary: Make someone an owner of a team (promotes, adds or invites)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerAssign'
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MemberAddResult'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/audit:
    get:
      tags:
      - admin
      operationId: adminListAudit
      x-omp-token-scopes:
      - platform:read
      summary: The platform-wide audit log (platform admins and auditors)
      parameters:
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/AuditActionParam'
      - $ref: '#/components/parameters/AuditExcludeActionParam'
      - $ref: '#/components/parameters/AuditActorParam'
      - $ref: '#/components/parameters/AuditActorKindParam'
      - $ref: '#/components/parameters/AuditTargetTypeParam'
      - $ref: '#/components/parameters/AuditFromParam'
      - $ref: '#/components/parameters/AuditToParam'
      responses:
        '200':
          $ref: '#/components/responses/AuditPageReply'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/audit/{entryId}:
    parameters:
    - name: entryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      tags:
      - admin
      operationId: adminGetAuditEntry
      x-omp-token-scopes:
      - platform:read
      summary: One entry of the platform-wide audit log, for a linked entry (platform admins and auditors)
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuditEntry'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/mcp-servers:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    get:
      tags:
      - mcp-servers
      operationId: listTeamMcpServers
      x-omp-token-scopes:
      - servers:read
      summary: The team's MCP servers (members and above; platform staff read any team)
      parameters:
      - $ref: '#/components/parameters/SearchParam'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: A page of servers ordered by name
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/McpServerPage'
        '404':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - mcp-servers
      operationId: createTeamMcpServer
      x-omp-token-scopes:
      - servers:write
      summary: Register a remote MCP server (editors and above); reads its capabilities at once
      description: >-
        409 slug_taken when another server uses the slug. 422 url_not_allowed when the URL is refused
        (details.reason invalid, too_long, userinfo, query, fragment, scheme, private_address or blocked_address;
        private_address can be allowed by a platform admin in Internal networks). The server is created even when
        discovery fails; refresh then says why. requirement (optional) names an enabled auth provider (422
        provider_not_found otherwise) that is open to the team (422 provider_not_allowed when the provider is restricted and
        lists neither the team nor, for a server that exists, the server) and its scopes (400 invalid_scope, details.scope). 400 invalid_auth_header also
        for the reserved MCP-Gateway-Identity, MCP-Gateway-Provider and MCP-Gateway-Provider-Token.

        credentials (decision 70) is the server's own credential as up to eight parts (header, bearer, basic, query),
        instead of authHeaderName and authValue (400 invalid_auth_header when both are sent). 400 too_many_credentials,
        invalid_credential_kind, invalid_auth_header (a header part's name), invalid_auth_query (a query part's name:
        1-64 of letters, digits, dot, hyphen and underscore, never mcp-*), invalid_auth_value and invalid_credential
        (a duplicate kind and name, or a name on a bearer or basic part), each with details.field credentials[i]. 422
        auth_conflict when two parts set Authorization (a header named Authorization, a bearer, a basic part;
        details.reason authorization_twice) or one does on a server in oauth mode (static_authorization). The values
        are sealed and never returned; the saved URL is still refused when it has a query (a query part is added to
        each request to the server, never to the URL).

        tls (decision 74) is the server''s CA bundle and mTLS client certificate with its key (McpServerTlsInput); 422
        invalid_tls with details.field and details.reason when it is refused. An automation token can''t send it (403
        token_not_allowed, details.field tls).

        authMode oauth (docs/phase7-upstream-oauth.md) needs oauth. The portal runs the sign-in discovery again itself
        (it never trusts endpoints sent by the browser) and, for registration dcr (or auto resolving to it), registers
        its client before saving: 422 oauth_discovery_failed (details.problems as in DetectAuthResult) or 502
        oauth_registration_failed, and nothing is saved. 422 auth_conflict when oauth is combined with a static
        Authorization header or a requirement (details.reason static_authorization or requirement). 422
        registration_unavailable (the chosen or auto registration isn't offered; details.options). 422
        client_required (manual without clientId, or without clientSecret unless tokenAuthMethod none). 422
        provider_mismatch (platform_provider whose authorization and token endpoints differ from the discovered
        ones, or turned off). In oauth mode the first capability discovery is skipped (refresh and refreshError
        null, setupRequired true): someone signs in with authorizeTeamMcpServerSetup first. Audited as
        mcp_server.create and mcp_server.auth_update (never a secret).

        authMode machine_oauth (decision 73, docs/machine-oauth.md) needs machineOAuth: tokenUrl, clientId and
        clientSecret (400 invalid_machine_oauth; 422 client_secret_required without the secret), and optionally scopes,
        tokenAuthMethod, audience and resource. The portal gets a token with the client credentials grant and sends it
        as Authorization: Bearer on every request to the server (discovery, tests, health checks and calls, from
        everyone alike); the first discovery runs at once with it. 422 auth_conflict (details.reason
        static_authorization or requirement) as for oauth. 422 url_not_allowed (details.field machineOAuth.tokenUrl)
        when the token endpoint is refused by the address rules. Audited as mcp_server.create and
        mcp_server.auth_update (token endpoint, scopes, clientSecretChanged; never a secret or a token). An
        automation token can't create a server in this mode (403 token_not_allowed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpServerCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/McpServerCreated'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '422':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/mcp-servers/detect-auth:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    post:
      tags:
      - mcp-servers
      operationId: detectTeamMcpServerAuth
      x-omp-token-scopes:
      - servers:write
      summary: Probe a URL and report how the MCP server wants clients to sign in (editors and above); changes nothing
      description: >-
        Sends one unauthenticated MCP initialize request to url (no identity token, no header) and follows the MCP
        authorization spec (2025-11-25) as a client would; the 401 challenge's resource_metadata (else the
        well-known protected-resource URIs; path form, then root), the resource metadata's authorization server,
        then its metadata (RFC 8414 path insertion, OpenID Connect path insertion, OpenID Connect path appending;
        the two root forms for an issuer without a path). Every request goes through the address guard and the
        internal-network allowlist (no proxy, no redirects, 5 s each, responses of at most 64 KiB, at most 8
        requests). Nothing is stored or audited. Problems found (resource or issuer mismatch, no PKCE S256, ...)
        are reported in the result with status 200, not as errors. machineOAuth says whether the authorization server
        lists client_credentials in grant_types_supported, with its token endpoint (for authMode machine_oauth). 422
        url_not_allowed as for create. 409 team_archived. 429 slow_down (10 a minute per person).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectAuthRequest'
      responses:
        '200':
          description: What was found and what is still needed
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DetectAuthResult'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '422':
          $ref: '#/components/responses/ErrorReply'
        '429':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/mcp-servers/identity-default:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    post:
      tags:
      - mcp-servers
      operationId: getTeamMcpServerIdentityDefault
      summary: The default of "Send identity token" for a server with no authentication at a URL (editors and above); changes nothing
      description: >-
        Classifies the host of url as the registry does when a server is created without an explicit sendIdentity
        (decision 64): a public host, an internal host (named by the internal-network allowlist, or a private
        address), or a name that could not be resolved in time (treated as public). Resolves the host name (at most 3
        s) and connects to nothing. Only for authMode none: servers with a static header or in oauth mode default to
        sending the token. Session only (the add form's helper; automation tokens can't call it). Nothing is stored or audited. 422
        url_not_allowed as for create. 409 team_archived. 429 slow_down (30 a minute per person).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectAuthRequest'
      responses:
        '200':
          description: The default and why
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/IdentityDefault'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '422':
          $ref: '#/components/responses/ErrorReply'
        '429':
          $ref: '#/components/responses/ErrorReply'
  /v1/teams/{team}/mcp-servers/{serverId}:
    parameters:
    - $ref: '#/components/parameters/TeamParam'
    - $ref: '#/components/parameters/ServerIdParam'
    get:
      tags:
      - mcp-servers
      operationId: getTeamMcpServer
      x-omp-token-scopes:
      - servers:read
      summary: One of the team's servers
      responses:
        '200':
          description: Server
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/McpServer'
        '404':
          $ref: '#/components/responses/ErrorReply'
    patch:
      tags:
      - mcp-servers
      operationId: updateTeamMcpServer
      x-omp-token-scopes:
      - servers:write
      summary: Change a server's settings (editors and above); the slug never changes
      description: 'requirement: omit to keep, null to remove (capability overrides with mode scopes go back to inherit;
        so do they when the provider changes). A newly chosen provider must be enabled (422 provider_not_found) and open to the
        server (422 provider_not_allowed: restricted, and neither the server''s team nor the server is on its access
        list); a turned-off one, or one that stopped being open to the server, can be kept (its calls are refused until
        the list is fixed). 400 invalid_scope (details.scope). Under approval_required, a published server
        goes back to pending when its URL changes or its requirement widens what any capability receives (a provider
        where there was none, another provider, or a scope not in effect before), audited as mcp_server.publish_request
        with reason url_changed or requirement_changed. Removing or narrowing a requirement never needs review.


        authMode and oauth (docs/phase7-upstream-oauth.md): omit to keep. Fields omitted inside oauth keep their
        stored values; clientSecret is replace-only. Errors as for create. Switching to oauth, choosing another
        authorization server, or adding a scope not asked for before sends a published server back to review under
        approval_required (mcp_server.publish_request, reason upstream_auth_changed). Leaving oauth, a URL change,
        another authorization server or another client ID erases the tokens of every connection to the server
        (needs_reconsent; leaving oauth deletes them, revoked where possible). Audited as mcp_server.auth_update
        (before/after, clientIdChanged, clientSecretChanged, connectionsReset; never a secret).

        machineOAuth (decision 73): see create. Under approval_required a published server goes back to pending
        (reason upstream_auth_changed) when it switches to machine_oauth, or its token endpoint, client ID, audience or
        resource changes, or a scope is added; a new secret alone does not. Any change drops the token the portal had
        for the server. Audited as mcp_server.auth_update (tokenUrlChanged, clientIdChanged, clientSecretChanged; never
        a secret or a token). A publisher automation token can''t send machineOAuth, or switch a server to this mode
        (403 token_not_allowed, details.field).


        A URL with another origin (scheme, host or port; case, a trailing slash and the path don''t count) never keeps the
        stored static header value, which nobody but its author can read: 422 auth_value_required (details.field authValue)
        unless the same request sends a new authValue, removes the header (authHeaderName "") or sets authMode none.
        The same holds for every part of credentials (a header, a bearer, a basic user and password, a query value): a
        request that moves the URL to another origin must send credentials with every part''s value entered again (no
        keep), or an empty list, or authMode none; otherwise 422 auth_value_required with details.field credentials[i]
        and details.kind and details.name of the part (the first stored part when the request doesn''t send credentials).
        Nothing changes and nothing is sent to the new host. In oauth mode another origin also erases every connection''s
        tokens and sends the server back to the setup sign-in (as above). The audit entry names oldOrigin and newOrigin.


        tls (decision 74) sets the server''s CA bundle (which replaces the system roots for this server only) and its mTLS
        client certificate and key: see McpServerTlsInput for the validation (422 invalid_tls) and the origin rule (422
        tls_key_required: the stored key and CA never follow a URL to another origin). A changed CA is a review trigger
        under approval_required (mcp_server.publish_request, reason upstream_tls_changed); a new client certificate is
        not. An automation token can''t send tls (403 token_not_allowed, details.field tls), and on a server that holds a
        client key it can''t change the URL.'
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpServerUpdate'
      responses:
        '200':
          description: Updated server
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/McpServer'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '422':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
    delete:
      tags:
      - mcp-servers
      operationId: deleteTeamMcpServer
      summary: Delete a server and its capabilities (team owners and admins)
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
