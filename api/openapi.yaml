    - $ref: '#/components/parameters/AutomationTokenIdParam'
    delete:
      tags:
      - automation-tokens
      operationId: revokeTeamAutomationToken
      summary: Revoke a team token (team owners and admins, browser session only); takes effect on the next request
      description: 'Revoking a revoked or expired token is a no-op. 404 token_not_found for another team''s token. Tokens
        authenticate with Authorization: Bearer on /v1/* only (never /mcp) and are managed here in a browser session only:
        a token that calls this operation gets 403 session_required.'
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
components:
  securitySchemes:
    AutomationToken:
      type: http
      scheme: bearer
      description: An automation token (ompadm_ or omppub_), accepted only by operations with x-omp-token-scopes, on /v1/* only. Not used as an operation-level security requirement so generated clients stay as they are.
  headers:
    ETag:
      description: Quoted revision, for If-Match on the next update
      schema:
        type: string
  parameters:
    AuditActionParam:
      name: action
      in: query
      required: false
      description: An exact action (team.member_add), or a prefix ending in a dot (team.) for every action in that
        group.
      schema:
        type: string
        maxLength: 100
        pattern: ^[a-z][a-z_]*\.[a-z_]*$
        example: team.
    AuditActorKindParam:
      name: actorKind
      in: query
      required: false
      description: 'Only entries by the system (system) or by automation tokens (automation_token)'
      schema:
        type: string
        enum:
        - system
        - automation_token
    AuditActorParam:
      name: actorUserId
      in: query
      required: false
      description: Only entries by this person (including their API keys)
      schema:
        type: string
        format: uuid
    AuditExcludeActionParam:
      name: excludeAction
      in: query
      required: false
      description: 'Action groups (prefixes ending in a dot, comma-separated) to leave out: auth. hides sign-ins
        and sign-outs.'
      schema:
        type: string
        maxLength: 100
        pattern: ^[a-z][a-z_]*\.(,[a-z][a-z_]*\.)*$
        example: auth.
    AuditFromParam:
      name: from
      in: query
      required: false
      description: Entries at or after this time
      schema:
        type: string
        format: date-time
    AuditTargetTypeParam:
      name: targetType
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-z_]+$
        example: team
    AuditToParam:
      name: to
      in: query
      required: false
      description: Entries before this time (exclusive)
      schema:
        type: string
        format: date-time
    CursorParam:
      name: cursor
      in: query
      required: false
      description: nextCursor from the previous page
      schema:
        type: string
    IfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: The resource's revision, as returned in ETag (for example "3"). Missing returns 428; stale returns
        412.
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    SearchParam:
      name: q
      in: query
      required: false
      description: Case-insensitive substring match
      schema:
        type: string
        maxLength: 200
    TeamParam:
      name: team
      in: path
      required: true
      description: Team slug or ID
      schema:
        type: string
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServerIdParam:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapabilityIdParam:
      name: capabilityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CapabilityKindParam:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CapabilityKind'
    GatewayOptionKindParam:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/GatewayCapabilityKind'
    GatewayOptionServerParam:
      name: server
      in: query
      required: false
      description: Only this MCP server's capabilities (server ID)
      schema:
        type: string
        format: uuid
    GatewayOptionLimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    GatewayIdParam:
      name: gatewayId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CallGatewayParam:
      name: gateway
      in: query
      required: false
      description: Gateway ID
      schema:
        type: string
        format: uuid
    CallServerParam:
      name: server
      in: query
      required: false
      description: MCP server ID
      schema:
        type: string
        format: uuid
    CallOutcomeParam:
      name: outcome
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/McpCallOutcome'
    CallIdentitySentParam:
      name: identitySent
      in: query
      required: false
      description: 'true: only calls where the identity token was sent to the server. false: only calls where it was not
        sent (the server''s Send identity token switch was off). Calls that were not forwarded, and calls recorded
        before this field existed, have no value and match neither.'
      schema:
        type: boolean
    CallUserParam:
      name: user
      in: query
      required: false
      description: Only calls made by this person (any credential)
      schema:
        type: string
        format: uuid
    OAuthGrantIdParam:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentPlatformIdParam:
      name: platformId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceAccountIdParam:
      name: serviceAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CallServiceAccountParam:
      name: serviceAccount
      in: query
      required: false
      description: Only calls made by this service account
      schema:
        type: string
        format: uuid
    ProviderIdParam:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectionIdParam:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConnectRequestIdParam:
      name: requestId
      in: path
      required: true
      description: The opaque ID from a consent link (the request query parameter of /connect/{provider})
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
    CallIdParam:
      name: callId
      in: path
      required: true
      description: McpCall.id
      schema:
        type: integer
        format: int64
        minimum: 1
    UsageFromParam:
      name: from
      in: query
      required: false
      description: Start (inclusive), on the hour; default 7 days before to
      schema:
        type: string
        format: date-time
    UsageToParam:
      name: to
      in: query
      required: false
      description: End (exclusive), on the hour; default the start of the next hour
      schema:
        type: string
        format: date-time
    UsageGroupByParam:
      name: groupBy
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UsageGroupBy'
    UsageCapabilityParam:
      name: capability
      in: query
      required: false
      description: Only calls of this capability (capability ID)
      schema:
        type: string
        format: uuid
    UsagePrincipalKindParam:
      name: principalKind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UsagePrincipalKind'
    UsageMethodParam:
      name: method
      in: query
      required: false
      description: Only this MCP method (default every recorded method, lists included)
      schema:
        type: string
        enum:
        - tools/list
        - tools/call
        - prompts/list
        - prompts/get
        - resources/list
        - resources/templates/list
        - resources/read
    UsageSeriesParam:
      name: series
      in: query
      required: false
      description: With a non-time groupBy, add per-day buckets (UsageRow.series) to each row
      schema:
        type: boolean
        default: false
    NotificationIdParam:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    NotificationDestinationIdParam:
      name: destinationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AutomationTokenIdParam:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    SessionListReply:
      description: Active browser sessions, newest first
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/BrowserSession'
    AuditPageReply:
      description: A page of audit entries, newest first
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/AuditPage'
    ErrorReply:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HealthReply:
      description: Health status
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Health'
    OkReply:
      description: Success
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/Ok'
    GatewayOptionPageReply:
      description: A page of options ordered by server name, then name
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/GatewayOptionPage'
    McpCallPageReply:
      description: A page of calls, newest first
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/McpCallPage'
    LimitSettingsReply:
      description: Rate limit settings
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/LimitSettings'
    TeamLimitsReply:
      description: A team's rate limits (ETag is the team's revision)
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/TeamLimits'
    CaptureSettingsReply:
      description: Payload capture settings
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/CaptureSettings'
    RetentionSettingsReply:
      description: Retention settings
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/RetentionSettings'
    TeamRetentionReply:
      description: A team's retention periods (ETag is the team's revision)
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/TeamRetention'
    McpCallReply:
      description: A call record
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/McpCall'
    CallPayloadReply:
      description: A captured payload (redacted and truncated when it was captured)
      headers:
        Cache-Control:
          description: Always no-store
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/CallPayload'
    UsageReportReply:
      description: Usage over a time range
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                $ref: '#/components/schemas/UsageReport'
  schemas:
    BrowserSession:
      type: object
      required: [id, createdAt, lastSeenAt, expiresAt, userAgent, clientIp, current]
      properties:
        id: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time, description: Activity recorded at most once a minute}
        expiresAt: {type: string, format: date-time, description: Absolute expiry; an idle limit may end it earlier}
        userAgent: {type: string}
        clientIp: {type: string}
        current: {type: boolean}
    RevokeSessionsInput:
      type: object
      properties:
        keepCurrent: {type: boolean, default: false}
    AuditActor:
      type: object
      description: Who made the change, resolved when the log is read
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - user
          - api_key
          - system
          - automation_token
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        apiKeyName:
          type: string
          description: The API key used (api_key actors)
        automationTokenId:
          type: string
          format: uuid
          description: The automation token (automation_token actors; no userId)
        automationTokenName:
          type: string
          description: The token's name as recorded when it acted
        automationTokenKind:
          type: string
          enum:
          - platform_admin
          - team_publisher
    AuditEntry:
      type: object
      required:
      - id
      - occurredAt
      - actorKind
      - actor
      - action
      - targetType
      - targetId
      - targetLabel
      - targetExists
      - metadata
      - requestId
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        actorKind:
          type: string
          enum:
          - user
          - api_key
          - system
          - automation_token
        actorUserId:
          type: string
          format: uuid
          nullable: true
        teamId:
          type: string
          format: uuid
          nullable: true
        teamName:
          type: string
          nullable: true
          description: The team's name for a team's entry (null for platform entries, or when the team was deleted)
        teamSlug:
          type: string
          nullable: true
          description: The team's slug, with teamName
        action:
          type: string
          example: team.member_add
        actor:
          $ref: '#/components/schemas/AuditActor'
        targetType:
          type: string
        targetId:
          type: string
        targetLabel:
          type: string
          nullable: true
          description: The target's current name, resolved when the log is read. For a deleted target, the last
            name recorded in the audit log; null when none is known.
        targetExists:
          type: boolean
          description: Whether the target still exists (deleted and soft-deleted targets are false)
        before:
          description: Configuration before the change
          nullable: true
        after:
          description: Configuration after the change
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        requestId:
          type: string
        via:
          allOf:
          - $ref: '#/components/schemas/AuditVia'
          nullable: true
          description: How the person acted. Null for the systems entries.
        clientIp:
          type: string
          nullable: true
          description: The caller's address as recorded, in the platform log only (null in a team's log, or when
            none was recorded).
    AuditPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        nextCursor:
          type: string
          nullable: true
    AuditVia:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - session
          - api_key
          - oauth
          description: 'session: signed in to the web app; api_key: with an API key; oauth: through a connected
            MCP client.'
        name:
          type: string
          description: The API key's or the connected app's name, when known
    AuthConfig:
      type: object
      required:
      - oidcEnabled
      - devAuthEnabled
      - loginUrl
      - devAccounts
      - instance
      properties:
        instance:
          $ref: '#/components/schemas/InstanceInfo'
        oidcEnabled:
          type: boolean
        devAuthEnabled:
          type: boolean
        loginUrl:
          type: string
        devAccounts:
          type: array
          items:
            $ref: '#/components/schemas/DevAccount'
        teamRequestUrl:
          type: string
          nullable: true
          description: Where people request a new team (only platform admins create teams)
    Capabilities:
      type: object
      required:
      - platformAdmin
      - platformAuditor
      properties:
        platformAdmin:
          type: boolean
        platformAuditor:
          type: boolean
    DevAccount:
      type: object
      required:
      - id
      - name
      - email
      - platformRole
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        platformRole:
          $ref: '#/components/schemas/PlatformRole'
    DevLoginRequest:
      type: object
      required:
      - account
      properties:
        account:
          type: string
          example: admin
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Structured context for some errors.
    Health:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ok
          - draining
          - unavailable
        checks:
          type: object
          additionalProperties:
            type: string
    InstanceInfo:
      type: object
      description: How this deployment presents itself (INSTANCE_NAME, ORG_NAME, UI_THEME, UI_LOGO_URL, SUPPORT_URL).
      required:
      - name
      - orgName
      - theme
      - logoUrl
      - supportUrl
      properties:
        name:
          type: string
          example: Open MCP Portal
          description: Product name shown in the UI and page titles
        orgName:
          type: string
          example: Example Corp
          description: Organisation name (empty when not configured)
        theme:
          type: string
          enum:
          - neutral
          description: UI theme, applied as data-brand on the html element
        logoUrl:
          type: string
          nullable: true
          example: https://www.example.edu/logo.svg
          description: https URL or same-origin path of the logo
        supportUrl:
          type: string
          nullable: true
          example: https://help.example.edu/ai
          description: 'Where the Help link points: an http(s) URL or a mailto: address'
    Invite:
      type: object
      required:
      - id
      - email
      - role
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: '#/components/schemas/TeamRole'
        invitedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Me:
      type: object
      required:
      - user
      - csrfToken
      - capabilities
      - teams
      - groups
      properties:
        teams:
          type: array
          items:
            $ref: '#/components/schemas/MyTeam'
        groups:
          type: array
          description: The caller's IdP groups as of their last sign-in (from OIDC_GROUPS_CLAIM; may be empty).
            Platform gateways can be granted to them.
          items:
            type: string
        user:
          $ref: '#/components/schemas/User'
        csrfToken:
          type: string
        capabilities:
          $ref: '#/components/schemas/Capabilities'
    Member:
      type: object
      required:
      - user
      - role
      - revision
      - createdAt
      properties:
        user:
          $ref: '#/components/schemas/MemberUser'
        role:
          $ref: '#/components/schemas/TeamRole'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
    MemberAdd:
      type: object
      required:
      - email
      - role
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/TeamRole'
    MemberAddResult:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - added
          - invited
        member:
          $ref: '#/components/schemas/Member'
        invite:
          $ref: '#/components/schemas/Invite'
    MemberUpdate:
      type: object
      required:
      - role
      properties:
        role:
          $ref: '#/components/schemas/TeamRole'
    MemberUser:
      type: object
      required:
      - id
      - email
      - displayName
      - status
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
    MyTeam:
      type: object
      required:
      - id
      - slug
      - name
      - status
      - role
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/TeamStatus'
        role:
          $ref: '#/components/schemas/TeamRole'
    Ok:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    OwnerAssign:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    PlatformRole:
      type: string
      enum:
      - none
      - platform_admin
      - platform_auditor
    Revision:
      type: integer
      format: int64
      description: Increases on every change. Send it back in If-Match.
    Team:
      type: object
      required:
      - id
      - slug
      - name
      - description
      - status
      - revision
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TeamStatus'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
    TeamCreate:
      type: object
      required:
      - slug
      - name
      - ownerEmail
      properties:
        slug:
          type: string
          example: platform-tools
        name:
          type: string
          example: Platform Tools
        description:
          type: string
        ownerEmail:
          type: string
          format: email
    TeamCreated:
      type: object
      required:
      - team
      - owner
      properties:
        team:
          $ref: '#/components/schemas/TeamSummary'
        owner:
          $ref: '#/components/schemas/MemberAddResult'
    TeamPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamSummary'
        nextCursor:
          type: string
          nullable: true
    TeamRole:
      type: string
      enum:
      - owner
      - admin
      - editor
      - member
    TeamStatus:
      type: string
      enum:
      - active
      - archived
    TeamSummary:
      type: object
      required:
      - team
      - memberCount
      - ownerCount
      - ownerInvites
      properties:
        team:
          $ref: '#/components/schemas/Team'
        memberCount:
          type: integer
          format: int64
        ownerCount:
          type: integer
          format: int64
        ownerInvites:
          type: integer
          format: int64
          description: Open owner invites (an owner invited by email who hasn't signed in yet)
    TeamUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TeamStatus'
    TeamView:
      type: object
      required:
      - team
      properties:
        team:
          $ref: '#/components/schemas/Team'
        role:
          description: The caller's role; absent when viewing as a platform admin or auditor
          allOf:
          - $ref: '#/components/schemas/TeamRole'
    User:
      type: object
      required:
      - id
      - email
      - displayName
      - platformRole
      - status
      - revision
      - createdAt
      properties:
        revision:
          $ref: '#/components/schemas/Revision'
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        platformRole:
          $ref: '#/components/schemas/PlatformRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        teamCount:
          type: integer
          format: int64
          description: Teams the user belongs to (admin user list only)
    UserDetail:
      type: object
      required:
      - user
      - teams
      properties:
        user:
          $ref: '#/components/schemas/User'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/MyTeam'
    UserPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        nextCursor:
          type: string
          nullable: true
    UserStatus:
      type: string
      enum:
      - active
      - suspended
    UserUpdate:
      type: object
      properties:
        platformRole:
          $ref: '#/components/schemas/PlatformRole'
        status:
          $ref: '#/components/schemas/UserStatus'
    PublishPolicy:
      type: string
      enum:
      - approval_required
      - self_publish
      description: 'approval_required: a platform admin approves each server, and each changed capability, before
        it reaches the catalog. self_publish: the team''s owners and admins do.'
    PublishState:
      type: string
      enum:
      - private
      - pending
      - published
      - rejected
    CapabilityKind:
      type: string
      enum:
      - tool
      - resource
      - resource_template
      - prompt
    McpErrorClass:
      type: string
      enum:
      - unavailable
      - auth
      - not_found
      - rate_limited
      - bad_request
      - bad_response
      - config
      - timeout
      - too_large
      - not_allowed
      - tls
      description: 'not_allowed: the URL or an address it resolves to is refused (blocked, or internal and not allowlisted),
        or the server redirected. tls: the TLS handshake failed (the server''s certificate isn''t trusted or isn''t valid
        for the host name, or the server refused the portal''s client certificate); the message says which and what to
        do. See McpServerTls.'
    CapabilityCounts:
      type: object
      required:
      - tools
      - resources
      - resourceTemplates
      - prompts
      properties:
        tools:
          type: integer
          format: int64
        resources:
          type: integer
          format: int64
        resourceTemplates:
          type: integer
          format: int64
        prompts:
          type: integer
          format: int64
    ServerHealth:
      type: object
      description: The latest health check. unknown before the first one.
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - healthy
          - failing
          - unknown
        checkedAt:
          type: string
          format: date-time
        statusSince:
          type: string
          format: date-time
          description: When the current status began
        latencyMs:
          type: integer
          format: int32
        errorClass:
          $ref: '#/components/schemas/McpErrorClass'
        message:
          type: string
        signInRequired:
          type: boolean
          description: The latest check was an oauth server's unauthenticated probe that got the expected sign-in
            challenge (status healthy, shown as "requires sign-in")
        warnings:
          type: array
          description: Things that aren't failures yet, such as a client certificate that expires within 14 days (or
            has expired)
          items:
            $ref: '#/components/schemas/ServerWarning'
    McpServer:
      type: object
      description: A remote MCP server a team registered. The auth header value is never returned.
      required:
      - id
      - teamId
      - teamSlug
      - teamName
      - slug
      - name
      - description
      - url
      - transport
      - hasAuth
      - authValueHint
      - timeoutSeconds
      - enabled
      - publishState
      - effectivePublishPolicy
      - counts
      - pendingChanges
      - health
      - revision
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        teamSlug:
          type: string
        teamName:
          type: string
        slug:
          type: string
          description: Immutable; prefixes the server's tool names in gateways (slug__tool)
          example: service-status
        name:
          type: string
          example: Service status
        description:
          type: string
        url:
          type: string
          example: https://status.example.com/mcp
        transport:
          type: string
          enum:
          - streamable_http
        authHeaderName:
          type: string
          description: 'The static header sent with every request, for a server whose credential is still its single
            header (absent: none, or the credential is the list credentials)'
        hasAuth:
          type: boolean
          description: Whether the server has any credential part (the single header or credentials)
        authValueHint:
          type: string
          description: Last 4 characters of the single header's value, or empty
        credentials:
          type: array
          description: The parts of the server's own credential, in order, with no values. The single header of a
            server that has not been saved with the list shows here as one header part
          items:
            $ref: '#/components/schemas/McpServerCredential'
        tls:
          allOf:
          - $ref: '#/components/schemas/McpServerTls'
          nullable: true
          description: The server's TLS settings (decision 74); null when it has none
        timeoutSeconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 120
        enabled:
          type: boolean
        publishState:
          $ref: '#/components/schemas/PublishState'
        effectivePublishPolicy:
          $ref: '#/components/schemas/PublishPolicy'
        publishRequestedAt:
          type: string
          format: date-time
          nullable: true
        publishRequestNote:
          type: string
          nullable: true
        publishReviewedAt:
          type: string
          format: date-time
          nullable: true
        publishReviewedByName:
          type: string
          nullable: true
        publishReviewNote:
          type: string
          nullable: true
        counts:
          $ref: '#/components/schemas/CapabilityCounts'
        pendingChanges:
          type: integer
          format: int64
          description: Capabilities of a published server whose definition changed since approval (hidden from the
            catalog until approved)
        health:
          $ref: '#/components/schemas/ServerHealth'
        refreshedAt:
          type: string
          format: date-time
          nullable: true
          description: When capabilities were last read (null; never)
        lastRefreshError:
          type: string
          nullable: true
        requirement:
          allOf:
          - $ref: '#/components/schemas/McpServerRequirement'
          nullable: true
          description: The auth provider and scopes whose user token the portal sends with calls to this server's
            capabilities (null; none). Capabilities can override it (McpCapability.requirementOverride).
        capturePayloads:
          type: boolean
          description: Record the arguments and results of calls to this server's capabilities through any gateway
            (redacted, truncated to 16 KiB per part; readable by the team's owners and admins and platform staff; kept
            for the captured_payloads retention period). Absent from servers before Phase 6.
        authMode:
          $ref: '#/components/schemas/McpServerAuthMode'
        oauth:
          allOf:
          - $ref: '#/components/schemas/McpServerOAuth'
          nullable: true
          description: The sign-in configuration when authMode is oauth, else null. Absent (like authMode) from servers
            before Phase 7
        personSecret:
          allOf:
          - $ref: '#/components/schemas/PersonSecretSettings'
          nullable: true
          description: How each person's own secret is sent, and how many people have entered one, when authMode is
            person_secret; else null. Absent from servers before v0.3.2
        machineOAuth:
          allOf:
          - $ref: '#/components/schemas/McpServerMachineOAuth'
          nullable: true
          description: The portal's own OAuth client for this server when authMode is machine_oauth, else null. The
            client secret is never returned. Absent from servers before v0.3.2
        requiresPresentPerson:
          type: boolean
          description: 'Refuse calls on a relay service account unless they are for a person the platform says is
            present (person_present true), for every capability without its own override (McpCapability.presentPerson):
            scheduled or background work, a token that names nobody and a relay key with no token are refused too.
            Default false. Calls that don''t arrive on a relay service account are never affected. Absent from
            servers before v0.3 (false)'
        sendIdentity:
          type: boolean
          description: 'Send the identity token (decision 45). true (the default) keeps decision 7: every forwarded
            call carries the signed identity JWT (Authorization: Bearer, or MCP-Gateway-Identity when the server has a
            static Authorization header or is in oauth mode). false: the JWT is not sent to this server at all (no
            header), recommended for servers run outside the company such as GitHub''s hosted MCP server, so names,
            emails and teams are not sent to a third party. Absent from servers before Phase 7 (true). New servers with
            authMode none on a public host default to false (decision 64); servers saved earlier keep their value'
        protocol:
          allOf:
          - $ref: '#/components/schemas/McpServerProtocol'
          nullable: true
          description: The MCP protocol version the portal last negotiated with the upstream server (set by refresh, health checks and test); read-only. Null until the first successful exchange.
        reviewDigest:
          type: string
          readOnly: true
          description: 'SHA-256 (hex) over the server''s URL, auth mode and requirement (for machine_oauth also its token
            endpoint, client ID, token authentication method, scopes, audience and resource, never the secret) and over
            every listed capability''s kind, name and fingerprint, sorted. It changes when any of them does (a refresh, a new URL ...). Send it back
            as expectedDigest when reviewing (adminReviewMcpServer) or publishing, so what is approved is what was read'
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    McpServerPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/McpServer'
        nextCursor:
          type: string
          nullable: true
    McpServerCredential:
      type: object
      description: One part of a server's own credential. Values are sealed and never returned
      required:
      - kind
      - hint
      properties:
        kind:
          type: string
          enum:
          - header
          - bearer
          - basic
          - query
          description: header sends name as a header; bearer sends Authorization Bearer; basic sends Authorization
            Basic (user and password); query adds name as a query parameter to each request to the server
        name:
          type: string
          description: The header or query parameter name (absent for bearer and basic)
        hint:
          type: string
          description: Last 4 characters of the value (of the password for basic), or empty when it has fewer than 8
    McpServerCredentialInput:
      type: object
      description: One part of a server's own credential in a request
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - header
          - bearer
          - basic
          - query
        name:
          type: string
          description: The header name (header) or the query parameter name (query); omit for bearer and basic
        value:
          type: string
          maxLength: 4096
          description: The header value, token, Basic user name or query value. Stored encrypted, never returned
        secondary:
          type: string
          maxLength: 4096
          description: The Basic password (basic only). Stored encrypted, never returned
        keep:
          type: boolean
          description: Keep the stored part of this kind and name with its values (update only; sends no value; not
            allowed when the URL moves to another origin)
    McpServerTlsInput:
      type: object
      description: >-
        A server's TLS settings in a request (decision 74): a CA bundle that replaces the system roots for this server
        only (a stolen public CA can't impersonate an internal server, and the private CA vouches for nothing else), and
        a client certificate with its private key for mTLS. Host name verification and TLS 1.2 as the minimum always
        apply; there is no setting that turns verification off. The private key is sealed with ENCRYPTION_KEY and never
        returned, logged or audited. A new or changed CA (or removing it) sends a published server back to pending under
        approval_required (reason upstream_tls_changed); a new client certificate does not. Input is validated when
        saved (422 invalid_tls, details.field tls.caPem, tls.clientCertPem or tls.clientKeyPem and details.reason:
        empty, too_large, not_pem, too_many_certificates, private_key_in_certificate_field, not_a_certificate,
        invalid_certificate, expired, not_yet_valid, not_for_client_authentication, weak_key, weak_signature,
        encrypted_key, not_a_private_key, invalid_key, key_mismatch, key_without_certificate, key_required,
        clear_with_other_fields). Moving the URL to another origin never carries the stored key or CA along: 422
        tls_key_required unless the same request replaces the client certificate and key, removes them
        (clientCertPem "") or clears the settings (a stored CA alone is dropped and audited). A platform admin or
        publisher automation token can't send it (403 token_not_allowed, details.field tls). Omitted fields keep what
        is stored.
      properties:
        caPem:
          type: string
          maxLength: 65536
          description: 'PEM certificates only (at most 10 and 64 KiB; a private key block is refused). The CA that signed
            the server''s certificate, with any intermediates. "" removes the CA (the system roots apply again).'
        clientCertPem:
          type: string
          maxLength: 65536
          description: 'The client certificate chain, leaf first (at most 10 certificates). Not expired, for client
            authentication, RSA 2048 bits or more, ECDSA P-256/P-384/P-521 or Ed25519. Without clientKeyPem it must belong
            to the stored key (a renewal). "" (with no key) removes the client certificate and its key.'
        clientKeyPem:
          type: string
          writeOnly: true
          maxLength: 16384
          description: One unencrypted PKCS#8, PKCS#1 or SEC1 PEM private key (a passphrase-protected key is refused)
            that belongs to the first certificate. Sealed with ENCRYPTION_KEY, never returned.
        clear:
          type: boolean
          description: Remove the CA, the client certificate and its key. Not with other fields.
    TlsCertificate:
      type: object
      description: Public facts about one certificate
      required:
      - subject
      - issuer
      - sha256
      - notBefore
      - notAfter
      properties:
        subject:
          type: string
        issuer:
          type: string
        sha256:
          type: string
          description: Fingerprint of the DER encoding, hex
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
        names:
          type: array
          description: DNS names and addresses the certificate lists (client certificate only)
          items:
            type: string
    McpServerTlsCa:
      type: object
      required:
      - sha256
      - certificates
      properties:
        sha256:
          type: string
          description: Fingerprint of the set of certificates (their order doesn't matter); what a review covers
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/TlsCertificate'
    McpServerTlsClient:
      type: object
      required:
      - certificate
      - chainLength
      - hasKey
      - status
      - daysLeft
      properties:
        certificate:
          $ref: '#/components/schemas/TlsCertificate'
        chainLength:
          type: integer
          format: int32
          description: Certificates in the chain, the first included
        hasKey:
          type: boolean
          description: The private key is stored (sealed). It is never returned.
        status:
          type: string
          enum:
          - valid
          - expiring
          - expired
          description: expiring is within 14 days of notAfter
        daysLeft:
          type: integer
          format: int32
          description: Whole days until notAfter (zero or negative once expired)
    McpServerTls:
      type: object
      description: A server's TLS settings as facts about the certificates; never the key. Absent from a server that
        has none (system roots, no client certificate).
      properties:
        ca:
          allOf:
          - $ref: '#/components/schemas/McpServerTlsCa'
          nullable: true
          description: The CA bundle that replaces the system roots for this server
        client:
          allOf:
          - $ref: '#/components/schemas/McpServerTlsClient'
          nullable: true
    ServerWarning:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - tls_certificate_expiring
          - tls_certificate_expired
        message:
          type: string
        at:
          type: string
          format: date-time
          description: When it expires (or expired)
    McpServerCreate:
      type: object
      required:
      - slug
      - name
      - url
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,46}[a-z0-9])?$
          description: Unique across the platform, immutable
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        url:
          type: string
          maxLength: 500
          description: The Streamable HTTP endpoint, https only (plain http for loopback in development)
        authHeaderName:
          type: string
          description: A header such as Authorization or X-API-Key; send it with authValue, or neither
        authValue:
          type: string
          description: Stored encrypted, never returned
        credentials:
          type: array
          maxItems: 8
          description: The server's own credential as parts, instead of authHeaderName and authValue (decision 70)
          items:
            $ref: '#/components/schemas/McpServerCredentialInput'
        tls:
          allOf:
          - $ref: '#/components/schemas/McpServerTlsInput'
          description: The server's CA bundle and client certificate (decision 74). The server is created even when
            discovery then fails; refreshError says why (class tls for a handshake problem)
        timeoutSeconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 120
          default: 30
        enabled:
          type: boolean
          default: true
        requirement:
          allOf:
          - $ref: '#/components/schemas/McpServerRequirementInput'
          nullable: true
          description: Absent or null; no user authorization
        capturePayloads:
          type: boolean
          default: false
          description: Only team owners and admins may set it to true (403 capture_role)
        authMode:
          allOf:
          - $ref: '#/components/schemas/McpServerAuthMode'
          description: 'Default: static_header when authHeaderName is sent, else none. oauth needs oauth. machine_oauth
            needs machineOAuth'
        oauth:
          $ref: '#/components/schemas/McpServerOAuthInput'
        personSecret:
          allOf:
          - $ref: '#/components/schemas/PersonSecretInput'
          description: Required with authMode person_secret (400 invalid_person_secret otherwise); ignored for other
            modes. How each person's own secret is sent. Nobody has entered a key yet, so capabilities are not read
            (McpServerCreated.setupRequired); an editor enters theirs under Account > My connections, choosing to read
            the server with it
        machineOAuth:
          allOf:
          - $ref: '#/components/schemas/McpServerMachineOAuthInput'
          description: Required with authMode machine_oauth (tokenUrl, clientId and clientSecret); refused (400
            invalid_machine_oauth) with any other mode, because it carries a secret
        sendIdentity:
          type: boolean
          description: Send the signed identity token with forwarded calls (McpServer.sendIdentity). Omit for the default
            (decision 64) true, except authMode none on a public host (or one that can't be resolved), where it is false;
            POST .../mcp-servers/identity-default tells which. An explicit value is always kept
    McpServerUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        url:
          type: string
          maxLength: 500
        authHeaderName:
          type: string
          description: Omit to keep; an empty string removes the header and its value
        authValue:
          type: string
          description: Omit to keep the stored value
        credentials:
          type: array
          maxItems: 8
          description: >-
            Omit to keep. The server's whole list of parts. Each one keeps its stored values (keep) or has
            new ones, and a part left out is removed; an empty list removes the credential. It replaces the single header
            (the legacy columns are cleared when it is stored). Not together with authHeaderName or authValue (400
            invalid_auth_header), which can't change a server whose credential is a list (422 credentials_in_use).
            Adding, changing or removing parts is not a review trigger (nothing new is sent to a new origin), but the
            review digest covers the kinds and names, so a reviewer's earlier look is stale. Audited in mcp_server.update
            (kind and name of each part, authValueChanged; never a value). A publisher automation token can't send it
            for a server that has a credential (403 token_not_allowed)
          items:
            $ref: '#/components/schemas/McpServerCredentialInput'
        tls:
          allOf:
          - $ref: '#/components/schemas/McpServerTlsInput'
          description: Omit to keep. Changing the CA or the client certificate forgets the stored health and reads the
            capabilities again (like a URL change); a changed CA is a review trigger under approval_required (reason
            upstream_tls_changed). Audited in mcp_server.update (fingerprints and what changed; never a key, a
            ciphertext or a PEM)
        timeoutSeconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 120
        enabled:
          type: boolean
        requirement:
          allOf:
          - $ref: '#/components/schemas/McpServerRequirementInput'
          nullable: true
          description: Omit to keep; null removes it. A widening change sends a published server back to review under
            approval_required
        capturePayloads:
          type: boolean
          description: Omit to keep. Only team owners and admins may change it (403 capture_role; sending the current
            value is allowed). Not a review trigger. Audited in mcp_server.update.
        authMode:
          allOf:
          - $ref: '#/components/schemas/McpServerAuthMode'
          description: Omit to keep. none removes the static header and the oauth configuration; leaving oauth deletes
            the server's connections; leaving machine_oauth deletes its client and secret
        oauth:
          allOf:
          - $ref: '#/components/schemas/McpServerOAuthInput'
          description: Only with authMode oauth (sent now or stored). Omitted fields keep their stored values
        personSecret:
          allOf:
          - $ref: '#/components/schemas/PersonSecretInput'
          description: 'Only with authMode person_secret (sent now or stored; required when switching to it). Omit to
            keep. A URL on another origin, another mode or another placement deletes every person''s secret for the server
            (audited as mcp_server.person_secrets_reset); a path-only edit, or another name, prefix, label or help,
            keeps them. A new mode, placement, name or prefix sends a published server back to review under
            approval_required. A publisher automation token can''t send it, nor switch a server to this mode (403
            token_not_allowed)'
        machineOAuth:
          allOf:
          - $ref: '#/components/schemas/McpServerMachineOAuthInput'
          description: Only with authMode machine_oauth (sent now or stored; 400 invalid_machine_oauth otherwise).
            Omitted fields keep their stored values; the first time (switching to the mode) tokenUrl, clientId and
            clientSecret are required. A new tokenUrl, a new clientId or a URL with another origin needs clientSecret
            in the same request (422 client_secret_required, details.reason token_url_changed, client_id_changed or
            origin_changed; nothing is stored and nothing is sent to the new endpoint)
        sendIdentity:
          type: boolean
          description: Omit to keep. Not a review trigger (turning it off sends less). Audited in mcp_server.update
        requiresPresentPerson:
          type: boolean
          description: Omit to keep. Turning it on never needs review; turning it off, when it made some capability
            require a present person, sends a published server back to pending under approval_required (reason
            requirement_changed), like widening a requirement. Audited in mcp_server.update
    McpServerCreated:
      type: object
      required:
      - server
      properties:
        server:
          $ref: '#/components/schemas/McpServer'
        refresh:
          allOf:
          - $ref: '#/components/schemas/McpRefreshResult'
          nullable: true
          description: The first discovery, when it worked
        refreshError:
          allOf:
          - $ref: '#/components/schemas/McpTestResult'
          nullable: true
          description: Why the first discovery failed
        setupRequired:
          type: boolean
          description: true for a server created in oauth mode; nobody has signed in yet, so capabilities weren't read.
            Call authorizeTeamMcpServerSetup next
    ToolClass:
      type: string
      enum: [read, write, destructive]
    CapabilityClassInput:
      type: object
      required: [toolClass]
      properties:
        toolClass:
          allOf:
          - $ref: '#/components/schemas/ToolClass'
          nullable: true
        viaSuggestion:
          type: boolean
    CapabilityClassesInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [capabilityId, toolClass]
            properties:
              capabilityId:
                type: string
                format: uuid
              toolClass:
                allOf:
                - $ref: '#/components/schemas/ToolClass'
                nullable: true
              viaSuggestion:
                type: boolean
    McpCapability:
      type: object
      description: 'A tool, resource, resource template or prompt as the server listed it. Descriptions and schemas
        are untrusted text a model will read: review them before approving.'
      required:
      - id
      - serverId
      - kind
      - name
      - title
      - description
      - definition
      - fingerprint
      - approved
      - changed
      - firstSeenAt
      - lastSeenAt
      - requirementOverride
      - requires
      - toolClass
      - suggestedClass
      - classDrift
      properties:
        toolClass:
          allOf:
          - $ref: '#/components/schemas/ToolClass'
          nullable: true
        suggestedClass:
          allOf:
          - $ref: '#/components/schemas/ToolClass'
          nullable: true
          description: Untrusted annotation suggestion; null for non-tools
        classDrift:
          type: boolean
          description: A classified tool differs from its annotation suggestion
        id:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/CapabilityKind'
        name:
          type: string
          description: Tool or prompt name, resource URI, or resource template URI template
        title:
          type: string
        description:
          type: string
        definition:
          type: object
          additionalProperties: true
          description: The full definition as listed (input/output schema, annotations, arguments, mime type ...)
        fingerprint:
          type: string
          description: SHA-256 of the canonical definition
        approved:
          type: boolean
          description: The current definition is approved for the catalog
        changed:
          type: boolean
          description: Approved once, but the definition changed since (published servers); hidden from the catalog
        approvedAt:
          type: string
          format: date-time
          nullable: true
        approvedByName:
          type: string
          nullable: true
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        goneAt:
          type: string
          format: date-time
          nullable: true
          description: When a refresh no longer found it (null while listed)
        requirementOverride:
          $ref: '#/components/schemas/CapabilityRequirementOverride'
        requires:
          allOf:
          - $ref: '#/components/schemas/CapabilityRequirement'
          nullable: true
          description: The effective requirement (the server's, or the override); null when calls get no provider
            token
        presentPerson:
          $ref: '#/components/schemas/CapabilityPresentPerson'
    McpRefreshResult:
      type: object
      required:
      - listed
      - added
      - changed
      - gone
      - capabilities
      properties:
        listed:
          type: integer
        added:
          type: integer
        changed:
          type: integer
          description: Capabilities whose definition changed
        gone:
          type: integer
          description: Capabilities no longer listed
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/McpCapability'
    McpTestResult:
      type: object
      required:
      - ok
      - latencyMs
      properties:
        ok:
          type: boolean
        latencyMs:
          type: integer
          format: int64
        counts:
          $ref: '#/components/schemas/CapabilityCounts'
        serverName:
          type: string
          description: serverInfo.name the server reported
        serverVersion:
          type: string
        protocolVersion:
          type: string
        errorClass:
          $ref: '#/components/schemas/McpErrorClass'
        httpStatus:
          type: integer
          format: int32
        message:
          type: string
          description: A short message (never a header value or a raw body)
        readAs:
          type: string
          nullable: true
          description: oauth servers; the display name of the person whose sign-in (the setup connection) was used
        setupRequired:
          type: boolean
          description: oauth servers; there is no usable setup connection, so the test couldn't sign in
    McpHealthCheck:
      type: object
      required:
      - checkedAt
      - ok
      - latencyMs
      - trigger
      properties:
        checkedAt:
          type: string
          format: date-time
        ok:
          type: boolean
        latencyMs:
          type: integer
          format: int32
        trigger:
          type: string
          enum:
          - manual
          - scheduled
        errorClass:
          $ref: '#/components/schemas/McpErrorClass'
        httpStatus:
          type: integer
          format: int32
        message:
          type: string
        signInRequired:
          type: boolean
          description: A scheduled check of an oauth server, which uses nobody's token; the server answered the
            expected 401 sign-in challenge for its resource, so it is reachable (ok true). It says nothing about
            whether calls work
    McpPublishRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
          description: For the reviewer
        expectedDigest:
          type: string
          description: The server's reviewDigest as the publisher saw it. Optional; when given and no longer current,
            409 changed_since_review
    McpPublishReview:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
        note:
          type: string
          maxLength: 2000
          description: Shown to the team
        expectedDigest:
          type: string
          description: The server's reviewDigest as the admin read it. Required for approve (400 expected_digest_required),
            not needed for reject; 409 changed_since_review when it is no longer current
    McpCapabilityApproval:
      type: object
      required:
      - expectedFingerprint
      properties:
        expectedFingerprint:
          type: string
          description: The capability's fingerprint as the approver saw it; 409 changed_since_review when the capability
            has another definition now
    PublishingSettings:
      type: object
      required:
      - defaultPolicy
      - revision
      - updatedAt
      properties:
        defaultPolicy:
          $ref: '#/components/schemas/PublishPolicy'
        revision:
          $ref: '#/components/schemas/Revision'
        updatedAt:
          type: string
          format: date-time
    PublishingSettingsUpdate:
      type: object
      required:
      - defaultPolicy
      properties:
        defaultPolicy:
          $ref: '#/components/schemas/PublishPolicy'
    NetworkEntry:
      type: object
      description: One allowlist entry. A cidr entry allows private addresses inside it (literal or resolved); a
        host entry allows the private addresses a matching host resolves to. allowHttp also allows plain http for
        URLs whose host matches (a host entry, or a literal address inside a cidr entry).
      required:
      - kind
      - value
      - allowHttp
      properties:
        kind:
          type: string
          enum:
          - cidr
          - host
        value:
          type: string
          maxLength: 260
          description: 'cidr: an IPv4 or IPv6 prefix such as 10.20.0.0/16 (a bare address means /32 or /128). host:
            an exact ASCII host name such as mcp.corp.example.com, or *.corp.example.com for its subdomains only
            (not corp.example.com itself).'
        allowHttp:
          type: boolean
        note:
          type: string
          maxLength: 200
    NetworkSettings:
      type: object
      required:
      - entries
      - deploymentEntries
      - revision
      - updatedAt
      properties:
        entries:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/NetworkEntry'
        deploymentEntries:
          type: array
          description: From UPSTREAM_ALLOWED_NETWORKS; read-only
          items:
            $ref: '#/components/schemas/NetworkEntry'
        revision:
          $ref: '#/components/schemas/Revision'
        updatedAt:
          type: string
          format: date-time
    NetworkSettingsUpdate:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/NetworkEntry'
    NetworkCheckRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          maxLength: 2000
    NetworkCheckReason:
      type: string
      description: 'Allowed: public, cidr_entry, host_entry, development. Refused: blocked_address, private_address,
        dns_failed, or a URL problem (invalid, too_long, userinfo, query, fragment, scheme).'
      enum:
      - public
      - cidr_entry
      - host_entry
      - development
      - blocked_address
      - private_address
      - dns_failed
      - invalid
      - too_long
      - userinfo
      - query
      - fragment
      - scheme
    NetworkCheckAddress:
      type: object
      required:
      - address
      - allowed
      - reason
      properties:
        address:
          type: string
        allowed:
          type: boolean
        reason:
          type: string
          enum:
          - public
          - cidr_entry
          - host_entry
          - development
          - blocked_address
          - private_address
    NetworkCheckResult:
      type: object
      required:
      - allowed
      - reason
      - message
      properties:
        allowed:
          type: boolean
        reason:
          $ref: '#/components/schemas/NetworkCheckReason'
        message:
          type: string
        matchedEntry:
          $ref: '#/components/schemas/NetworkEntry'
        resolvedAddresses:
          type: array
          items:
            $ref: '#/components/schemas/NetworkCheckAddress'
    AgentPlatform:
      type: object
      description: An external agent platform the portal trusts to name the person behind a relayed agent call
        (decisions 65 and 66). It holds no secrets, because the keys are public.
      required:
      - id
      - name
      - issuer
      - jwksUrl
      - audience
      - enabled
      - relayCount
      - keyIds
      - revision
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        issuer:
          type: string
          description: The iss of the platform's tokens, exactly as it writes it (its APP_URL)
        jwksUrl:
          type: string
        audience:
          type: string
          description: The aud a token must contain (this portal's APP_URL by default; the platform sets it as the
            server's identityAudience)
        enabled:
          type: boolean
        relayCount:
          type: integer
          format: int64
          description: Service accounts marked as relays for the platform
        lastFetch:
          allOf:
          - $ref: '#/components/schemas/AgentPlatformFetch'
          nullable: true
          description: The latest JWKS fetch by any replica (a verification or a Test); null before the first
        keyIds:
          type: array
          items:
            type: string
          description: The key IDs the last successful fetch published (empty after a failed one)
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentPlatformFetch:
      type: object
      required:
      - at
      - ok
      properties:
        at:
          type: string
          format: date-time
        ok:
          type: boolean
        error:
          type: string
          nullable: true
          description: not_allowed, redirect, timeout, unreachable, http_status, content_type, too_large,
            invalid_json or no_usable_keys
    AgentPlatformCreate:
      type: object
      required:
      - name
      - issuer
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        issuer:
          type: string
          maxLength: 500
          description: An absolute https URL without query or fragment, compared exactly with the token's iss
        jwksUrl:
          type: string
          maxLength: 500
          description: Default <issuer>/.well-known/mcp-identity-jwks.json
        audience:
          type: string
          maxLength: 500
          description: Default this portal's APP_URL
        enabled:
          type: boolean
          default: true
    AgentPlatformUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        issuer:
          type: string
          maxLength: 500
        jwksUrl:
          type: string
          maxLength: 500
          description: An empty string goes back to the default for the issuer
        audience:
          type: string
          maxLength: 500
          description: An empty string goes back to this portal's APP_URL
        enabled:
          type: boolean
    AgentPlatformTestResult:
      type: object
      required:
      - ok
      - keyIds
      - checkedAt
      - latencyMs
      properties:
        ok:
          type: boolean
        error:
          type: string
          nullable: true
          description: AgentPlatformFetch.error
        httpStatus:
          type: integer
          nullable: true
          description: The platform's answer when error is http_status
        keyIds:
          type: array
          items:
            type: string
        checkedAt:
          type: string
          format: date-time
        latencyMs:
          type: integer
          format: int64
        cacheSeconds:
          type: integer
          format: int64
          nullable: true
          description: How long a replica caches a good answer (Cache-Control max-age within 10 seconds to 5 minutes)
    AgentPlatformRelay:
      type: object
      required:
      - serviceAccountId
      - name
      - teamId
      - teamSlug
      - teamName
      - role
      - enabled
      properties:
        serviceAccountId:
          type: string
          format: uuid
        name:
          type: string
        teamId:
          type: string
          format: uuid
        teamSlug:
          type: string
        teamName:
          type: string
        role:
          $ref: '#/components/schemas/ServiceAccountRole'
        enabled:
          type: boolean
        markedAt:
          type: string
          format: date-time
          nullable: true
    CapabilityPresentPersonOverride:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - inherit
          - required
          - not_required
    CapabilityPresentPerson:
      type: object
      required:
      - mode
      - effective
      properties:
        mode:
          type: string
          enum:
          - inherit
          - required
          - not_required
        effective:
          type: boolean
          description: Relayed calls of this capability need the person present (the override, else the server's switch)
    AgentCall:
      type: object
      description: The agent behind a call relayed by a trusted agent platform. The principal of such a call is the
        relay service account; person (when the token named one) is who the agent acted for.
      required:
      - platformName
      - agentId
      properties:
        platformId:
          type: string
          format: uuid
          nullable: true
        platformName:
          type: string
        agentId:
          type: string
        agentName:
          type: string
          nullable: true
        personPresent:
          type: boolean
          nullable: true
          description: The platform's statement that the person was in the conversation; absent when the token named
            no person
        person:
          allOf:
          - $ref: '#/components/schemas/AgentCallPerson'
          nullable: true
    AgentCallPerson:
      type: object
      required:
      - displayName
      properties:
        userId:
          type: string
          format: uuid
          nullable: true
        email:
          type: string
          nullable: true
        displayName:
          type: string
    TeamPublishing:
      type: object
      required:
      - override
      - effective
      - defaultPolicy
      - revision
      properties:
        override:
          allOf:
          - $ref: '#/components/schemas/PublishPolicy'
          nullable: true
          description: null when the team follows the platform default
        effective:
          $ref: '#/components/schemas/PublishPolicy'
        defaultPolicy:
          $ref: '#/components/schemas/PublishPolicy'
        revision:
          allOf:
          - $ref: '#/components/schemas/Revision'
          description: The team's revision (If-Match for the admin update)
    TeamPublishingUpdate:
      type: object
      required:
      - override
      properties:
        override:
          allOf:
          - $ref: '#/components/schemas/PublishPolicy'
          nullable: true
    CatalogServer:
      type: object
      required:
      - id
      - slug
      - name
      - description
      - teamSlug
      - teamName
      - counts
      - health
      - publishedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        teamSlug:
          type: string
          description: The owning team
        teamName:
          type: string
        counts:
          allOf:
          - $ref: '#/components/schemas/CapabilityCounts'
          description: Approved, listed capabilities only
        health:
          $ref: '#/components/schemas/ServerHealth'
        publishedAt:
