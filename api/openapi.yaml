    post:
      tags:
      - automation-tokens
      operationId: adminCreateAutomationToken
      summary: Create a platform-admin token (platform admins, browser session only); the secret is shown once
      description: 'Prefix ompadm_. Scopes platform:read and/or platform:write (write includes read). expiresInDays 1-365,
        default 90: tokens always expire. 400 invalid_name, invalid_scopes, invalid_expiry. 409 too_many_tokens (at most 20
        active platform tokens). Tokens authenticate with Authorization: Bearer on /v1/* only (never /mcp) and are managed
        here in a browser session only: a token that calls this operation gets 403 session_required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationTokenCreate'
      responses:
        '201':
          description: Created; the secret is shown only now
