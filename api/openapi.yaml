      operationId: createTeamAutomationToken
      summary: Create a team publisher token (team owners and admins, browser session only); the secret is shown once
      description: 'Prefix omppub_. Owned by the team: it keeps working when its creator leaves. Scopes servers:read and/or
        servers:write (write includes read), limited to this team''s MCP servers. expiresInDays 1-365, default 90. 400 invalid_name,
        invalid_scopes, invalid_expiry. 409 too_many_tokens (at most 20 active per team), team_archived. Platform roles get
        403 through team routes. Tokens authenticate with Authorization: Bearer on /v1/* only (never /mcp) and are managed
        here in a browser session only: a token that calls this operation gets 403 session_required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutomationTokenCreate'
      responses:
        '201':
          description: Created; the secret is shown only now
