        toolScope:
          $ref: '#/components/schemas/ToolScope'
        subjectKind:
          $ref: '#/components/schemas/GatewayGrantSubjectKind'
        team:
          type: string
          description: Team slug or ID
        userEmail:
          type: string
          description: An existing user's email
        group:
          type: string
          minLength: 1
          maxLength: 256
    MyGatewayAccess:
      type: string
      enum:
      - team_member
      - team_grant
      - user_grant
      - group_grant
    MyGateway:
      type: object
      required:
      - id
      - slug
      - name
      - description
      - ownerKind
      - url
      - access
      - capabilityCount
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        ownerKind:
          $ref: '#/components/schemas/GatewayOwnerKind'
        teamSlug:
          type: string
        teamName:
          type: string
        url:
          type: string
        access:
          type: array
          description: Why the caller may use it (at least one)
          items:
            $ref: '#/components/schemas/MyGatewayAccess'
        groups:
          type: array
