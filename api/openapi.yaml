        required: true
        schema:
          type: string
      - name: resource
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The request is valid
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OAuthConsent'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - oauth
      operationId: decideOAuthConsent
      summary: Allow or deny an authorization request; returns where to send the browser
      description: Allow records the caller's consent for the client and gateway (audited as oauth.consent, or as
        oauth.grant_confirmed when the page was the first-use notice of a trusted client) and issues a single-use
        authorization code valid for 60 seconds. Deny sends the client access_denied. The optional toolScope contains
        classes only and may narrow but not widen the request (400 oauth_invalid_scope); omission uses the requested
        ceiling. Changing scope replaces the grant and invalidates its old tokens and pending codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthConsentDecision'
      responses:
        '200':
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - redirectUrl
                    properties:
                      redirectUrl:
                        type: string
        '400':
          $ref: '#/components/responses/ErrorReply'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
