      operationId: getTeamNotificationDestination
      summary: One destination
      description: 'A webhook destination. The URL is sealed with ENCRYPTION_KEY and never returned (a Slack incoming-webhook
        URL is itself a credential): urlDisplay shows scheme and host only. Format json is signed; the signing secret is shown
        once on creation and on rotation. Format slack is unsigned ({"text": ...}).'
      responses:
        '200':
          description: Destination
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationDestination'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    patch:
      tags:
      - notifications
      operationId: updateTeamNotificationDestination
      summary: Change a destination (team owners and admins, browser session only)
      description: Format can't change (create another destination). Sending url replaces the sealed URL (checked as on creation);
        leaving it out keeps it. Turning enabled back on after an automatic stop (disabledReason failures) clears the failure
        count. 409 name_taken, team_archived. 412 and 428 for If-Match. 422 as on creation.
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationDestinationUpdate'
      responses:
        '200':
          description: Updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationDestination'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '422':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
    delete:
      tags:
      - notifications
      operationId: deleteTeamNotificationDestination
      summary: Delete a destination and its delivery log (team owners and admins, browser session only)
      description: Deliveries still waiting for it are dropped.
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
