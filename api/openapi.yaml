      operationId: adminCreateAgentPlatform
      summary: Trust an agent platform as an issuer of identity tokens (platform admins; browser session only)
      description: 'jwksUrl defaults to <issuer>/.well-known/mcp-identity-jwks.json and audience to this portal''s
        APP_URL (the platform sets it as the server''s identityAudience). The JWKS URL follows the rule for MCP
        servers (an internal address only for a host a platform admin allowed) and is https always, even for an
        allowed internal host (422 url_not_allowed with details.reason). 422 invalid_issuer; 400 invalid_name or invalid_audience; 409 name_taken, issuer_taken or
