      summary: The allowlist of internal networks and hosts MCP servers may use (platform admins and auditors)
      description: entries are the platform admins' (editable); deploymentEntries come from UPSTREAM_ALLOWED_NETWORKS
        and are read-only. Loopback, link-local (including cloud metadata), unspecified, multicast and broadcast
        addresses stay blocked whatever the entries say.
      responses:
        '200':
          description: Settings
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
