  /v1/auth-providers:
    get:
      tags:
      - auth-providers
      operationId: listAuthProviders
      summary: Auth providers a server's team can require (any active signed-in person)
      description: Enabled providers only, ordered by name, with the fields needed to pick one. Never a client ID,
        secret or endpoint. With team (a team the caller can see; 404 team_not_found otherwise) only the providers a
        server of that team may require are listed (open ones, and restricted ones that list the team or, with serverId
        (a server of that team), that server). That is a convenience for the picker; saving a requirement and every call
        check the provider's access list again. Without team every enabled provider is listed (connecting an account is
        not limited by it).
      parameters:
      - name: team
        in: query
        required: false
        description: A team slug or ID; limits the list to providers servers of this team may require
        schema:
          type: string
      - name: serverId
        in: query
        required: false
        description: With team, a server of that team; also counts providers that list this server
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Providers ordered by name
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthProviderSummary'
        '401':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/auth-providers:
    get:
      tags:
      - admin
      - auth-providers
      operationId: adminListAuthProviders
      x-omp-token-scopes:
      - platform:read
      summary: Every auth provider, enabled or not (platform admins and auditors)
      description: At most 100 providers exist, so this is not paged. The client secret is never returned.
      responses:
        '200':
          description: Providers ordered by name
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthProvider'
        '403':
          $ref: '#/components/responses/ErrorReply'
    post:
      tags:
      - admin
      - auth-providers
      operationId: adminCreateAuthProvider
      summary: Configure an auth provider (platform admins)
      description: 'Endpoints must be https (plain http only where the internal-network allowlist allows it, or on
        loopback in development) without user info or a fragment; tokenUrl, revocationUrl and userinfoUrl are dialled
        through the same address guard as MCP servers, authorizationUrl only by browsers. 422 url_not_allowed
        (details.field, details.reason as for MCP servers). 422 invalid_slug (details.reason reserved) for done and
        callback, which are paths under /connect/. 409 slug_taken; 409 too_many_providers (at most 100). 400
        invalid_scope (details.scope). 422 invalid_param (details.key, details.reason reserved, invalid or too_many)
        for extraAuthorizeParams. 422 pkce_required (tokenAuthMethod none without pkce); 422 client_secret_required
        (another tokenAuthMethod without clientSecret). The secret is sealed with ENCRYPTION_KEY and never returned,
        logged or audited. Audited as auth_provider.create.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthProviderCreate'
      responses:
        '201':
          description: Created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthProvider'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
        '422':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/auth-providers/{providerId}:
    parameters:
    - $ref: '#/components/parameters/ProviderIdParam'
    get:
      tags:
      - admin
      - auth-providers
      operationId: adminGetAuthProvider
      x-omp-token-scopes:
      - platform:read
      summary: One auth provider (platform admins and auditors)
      responses:
        '200':
          description: Provider
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthProvider'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    patch:
      tags:
      - admin
      - auth-providers
      operationId: adminUpdateAuthProvider
      summary: Change an auth provider (platform admins); the slug never changes
      description: 'Omit clientSecret to keep it. Changing clientId marks every connection to the provider
        needs_reconsent and erases their tokens (they belong to the old app). Turning the provider off refuses calls
        that require it and new connections at once; connections are kept. Errors as for create. Audited as
        auth_provider.update (clientSecretChanged, never the secret). While MCP servers in oauth mode link the
        provider (registration platform_provider), changing authorizationUrl or tokenUrl is 409 in_use (details as
        for delete); changing clientId also resets their server connections. Server-bound providers (kind
        mcp_server) are not reachable here (404).'
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthProviderUpdate'
      responses:
        '200':
          description: Updated provider
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthProvider'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '422':
          $ref: '#/components/responses/ErrorReply'
        '428':
          $ref: '#/components/responses/ErrorReply'
    delete:
      tags:
      - admin
      - auth-providers
      operationId: adminDeleteAuthProvider
      summary: Delete an auth provider and every connection to it (platform admins)
      description: 409 in_use (details.serverCount, details.servers with up to 20 {id, slug, name, teamSlug}) while any MCP
        server requires it, as its requirement or in a capability override, or links it in oauth mode (Admin servers filter by provider).
        Otherwise each connection's tokens are erased and, where the provider has a revocation endpoint, revoked
        there (best effort). Audited as auth_provider.delete (connectionCount) and provider_connection.revoke (reason
        provider_deleted) per connection.
      responses:
        '200':
          $ref: '#/components/responses/OkReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '409':
          $ref: '#/components/responses/ErrorReply'
  /v1/admin/auth-providers/{providerId}/access:
    parameters:
    - $ref: '#/components/parameters/ProviderIdParam'
    get:
      tags:
      - admin
      - auth-providers
      operationId: adminGetAuthProviderAccess
      summary: Who may use an auth provider (platform admins and auditors)
      description: 'Browser session only, like the change: an automation token never sees or decides who may use a
        credential provider (decision 58). The provider''s access mode, its listed teams and servers, and (blocked, blockedCount) the servers
        that require the provider although the list excludes them: their calls are refused (-32010
        provider_not_allowed) until a team or the server is added. Server-bound providers (kind mcp_server) are not
        reachable here (404 provider_not_found).'
      responses:
        '200':
          description: The access list
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthProviderAccess'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
    put:
      tags:
      - admin
      - auth-providers
      operationId: adminSetAuthProviderAccess
      summary: Replace who may use an auth provider (platform admins; browser session only)
      description: 'Replaces the mode and both lists. open: any team''s server may require the provider (the lists are
        kept but not consulted). restricted: only a server of a listed team, or a listed server, may; it is checked when
        a requirement is saved (422 provider_not_allowed), when a person allows a server to use their account (a consent
        link or My connections) and on every call, so removing a team stops delivery on the next call (also an
        agent''s relayed call). Providers created after the upgrade start restricted with empty lists; existing ones
        stay open. The provider''s revision (If-Match) must match and moves. 422 team_not_found or server_not_found
        for an ID that does not exist; 422 too_many_entries (500 each); 400 invalid_access_mode. Session only: an
        automation token never decides who may use a credential provider (decision 58). Audited as
        auth_provider.access_update with the list before and after.'
      parameters:
      - $ref: '#/components/parameters/IfMatchHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthProviderAccessInput'
      responses:
        '200':
          description: The new access list
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/AuthProviderAccess'
        '400':
          $ref: '#/components/responses/ErrorReply'
        '403':
          $ref: '#/components/responses/ErrorReply'
        '404':
          $ref: '#/components/responses/ErrorReply'
        '412':
          $ref: '#/components/responses/ErrorReply'
        '422':
