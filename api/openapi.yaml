      properties:
        classes:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ToolClass'
        tools:
          type: array
          maxItems: 500
          items:
            type: string
            minLength: 1
            maxLength: 1100
            pattern: '^[^\u0000-\u001F\u007F-\u009F*?\[\]{}\\]+$'
            description: Exact case-sensitive exposed name, including future aliases. At most 1100 UTF-8 bytes (the byte bound is checked by the API); no control characters or glob operators (* ? [ ] { } backslash). No server__ prefix is required.
    GatewayGrant:
      type: object
