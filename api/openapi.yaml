    post:
      tags:
      - admin
      - agent-platforms
      operationId: adminTestAgentPlatform
      summary: Fetch the platform's JWKS now (platform admins; browser session only)
      description: Through the same guarded path as a verification (address rule and allowlist of MCP servers, no
        redirects, 5 seconds, at most 64 KiB, a JSON content type). Always 200; ok false with an error code says why
        the fetch failed (not_allowed, redirect, timeout, unreachable, http_status, content_type, too_large,
        invalid_json, no_usable_keys). The result is stored as the platform's last fetch; a good one refreshes this
        replica's cache. Not audited (it changes nothing but the stored result).
      responses:
        '200':
          description: The result
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
