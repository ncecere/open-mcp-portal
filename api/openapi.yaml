      summary: What a consent link is for, so the web app can confirm before leaving for the provider
      description: Signed in, and only the person the link was made for; anyone else gets 404 connect_request_not_found,
        the same as an unknown ID. 410 connect_request_expired once it expired (10 minutes) or was used, or when it was
        made before servers had to be allowed; 410 connect_request_server_changed when the server's address or its
